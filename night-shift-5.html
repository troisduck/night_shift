  --iron-ivory: #CFC3A1;         /* слоновая кость: таблички, шкалы приборов — тише бумаги в руках и тише ламп */
  --iron-ivory-lo: #B8AB89;      /* нижняя кромка таблички */
  --iron-bakelite: #1E1A17;      /* бакелит: колпачки кнопок, основания тумблеров, корпус табло */
  --iron-bakelite-hi: #3B342E;   /* верхняя грань колпачка */
  --iron-alu: #A8ACA4;           /* алюминий: ободки, гнёзда, ручки-скобы, рычаги */
  --iron-alu-hi: #D5D8CF;        /* алюминий на свету */
  --iron-alu-dark: #6F736C;      /* алюминий в тени */
  --iron-plate-red: #9C2A21;     /* красная табличка с кремовыми буквами */
  --iron-hazard: #E5B511;        /* жёлто-чёрная штриховка — только вокруг АЗ */
  --ann-off: #2A2F2C;            /* погашенное окно табло: дымчатое стекло. Горящее — светлое, погашенное — тёмное */
  --ann-off-txt: #9AA29C;        /* надпись на погашенном окне: читается (≈ 5:1), но не светится */
  --iron-desk: #3A3027;          /* столешница пульта (нижняя полоса) */
  --iron-desk-edge: #57493C;     /* передняя кромка столешницы */
  --engrave: #E3D8BA;            /* надписи краской по эмали и бакелиту */
  --engrave-dim: #D3CBB1;        /* второстепенные надписи по эмали (контраст ≥ 4,5:1) */
  --engrave-ink: #1A1815;        /* чёрные буквы на табличках слоновой кости */
  --engrave-line: rgba(227,216,186,.5); /* линии скобок групп, нанесённые краской, — тише букв */

  /* ===== СВЕТ — только источники света; светится = живые данные прямо сейчас ===== */
  --sig-ok: #3DDC6E;             /* норма, включено, работает */
  --sig-warn: #FFB020;           /* внимание */
  --sig-bad: #FF3B2E;            /* опасность, авария, срабатывание */
  --sig-info: #3E9BEA;           /* холод, сведения, работа автоматики */
  --sig-neu: #F2EBD6;            /* нейтральные цифры: часы, величины без оценки */
  --off-ok: #1F3B28;             /* погасшее стекло тех же ламп: тусклое, но узнаваемое */
  --off-warn: #3F3011;
  --off-bad: #3E1813;
  --off-info: #182B3E;
  --off-neu: #34352F;            /* колпачок многоцветной лампы, когда она погашена */
  --hot-ok: #E4FFEA;             /* раскалённая середина горящей лампы — единственный почти белый */
  --hot-warn: #FFF4D2;
  --hot-bad: #FFDCD2;
  --hot-info: #DDEEFF;
  --halo-ok: rgba(61,220,110,.34);    /* свет лампы на окружающей эмали */
  --halo-warn: rgba(255,176,32,.34);
  --halo-bad: rgba(255,59,46,.38);
  --halo-info: rgba(62,155,234,.32);
  /* горящая линза табло — глубже сигнального цвета того же тона, чтобы читалась белая подсвеченная надпись (HighFleet, «ЗАПРАВКА») */
  --lens-warn: #CF660B; --lens-bad: #D22E1E; --lens-info: #2A74C4; --lens-ok: #24984E;
  --glass-print: #A3A99F;        /* надписи, отпечатанные на стекле индикатора: единицы */
  --glass-live: #DCD6C2;         /* живой поясняющий текст под стеклом */
  --mark-lit: #FFEBC2;           /* молочная лампа отметки (звёзды смены): тёплый белый, не сигнальный цвет */
  --mark-halo: rgba(255,226,170,.3);

  /* ===== БУМАГА — всё, что объясняет ===== */
  --paper: #EFE6CE;              /* лист */
  --paper-2: #CDC09E;
  --paper-3: #A2977B;
  --paper-desk: #A69B7E;         /* лист реплики Палыча на столе: светлее ленты, темнее шкал приборов */            /* лента самописца на щите: под стеклом и в полутени — темнее плаката и листа в руках */            /* лист под стеклом: плакат мнемосхемы, лента самописцев — в полутени, темнее листа в руках */
  --paper-card: #B6A47C;         /* картон бирок на закрытых крышках — тише рабочих панелей */
  --paper-ink: #1F1D1A;          /* типографская краска */
  --paper-pen: #2F3A8F;          /* шариковая паста */
  --paper-pencil: #57534C;       /* карандаш */
  --paper-stamp: #B3261E;        /* штемпельная краска */
  --paper-rule: #A6B3C1;         /* линовка журнала: серо-синяя, тише красной линии полей */
  --paper-margin: #C9655C;       /* красная линия полей журнала */
  --paper-grid: #BEA084;         /* сетка самописца, отпечатанная на ленте (темнее листа под стеклом) */
  --paper-grid-major: #A67D60;   /* крупные деления сетки */
  --paper-tape: #D8C78C;         /* малярный скотч */
  --ink-ok: #1C6E35;             /* чернила графиков — тёмные оттенки сигнальных цветов */
  --ink-warn: #7D5A07;
  --ink-bad: #B3261E;
  --ink-info: #1F4F9C;
  --ink-hot: #A84E0E;
  --paint-ok: #3A8A4E;           /* краска зон на шкалах: печать, а не свет — темнее и тише ламп */
  --paint-warn: #C8902A;
  --paint-bad: #B93A2B;
  --paint-info: #3A699C;

  /* ===== УКАЗАТЕЛЬ «смотри сюда» — несигнальный двойной контур ===== */
  --look-light: #F2EBD6;
  --look-dark: #1E1A17;

  /* ===== СВЕТ ЗАЛА — подсветка шкал живых приборов (STYLE.md, 2.2); ключевой свет запекает Tex по FEEL.light ===== */
  --scale-lamp: rgba(255, 222, 160, .5);      /* тёплая лампа за стеклом шкалы: ярче у верхней кромки */
  --scale-shade: rgba(46, 34, 16, .26);      /* края поля шкалы, куда лампа не достаёт */
  --scale-lamp-duty: rgba(255, 232, 186, 1);
  --win-w: 8.6rem;               /* окно в город: ширина колонки справа от щита */ /* «дежурная» подсветка шкалы прибора текущей цели — чуть ярче */

  /* ===== ДВИЖЕНИЕ (STYLE.md, 2.9): лёгкое — быстро, тяжёлое — медленно ===== */
  --t-hover: 100ms;          /* наведение: блик кромки, крышка приподнимается */
  --t-press: 50ms;           /* кнопка вниз */
  --t-release: 100ms;        /* кнопка вверх */
  --t-lamp-on: 80ms;         /* лампа разгорается */
  --t-lamp-off: 200ms;       /* нить остывает */
  --t-paper: 320ms;          /* бумага и таблички */
  --t-heavy: 560ms;          /* крышка АЗ, дверь, заглушка */
  --ease-paper: cubic-bezier(.2, .7, .25, 1);       /* с замедлением в конце */
  --ease-heavy: cubic-bezier(.5, -.32, .3, 1.22);   /* короткий рывок назад перед движением, перелёт в конце */

  /* ===== ШРИФТЫ — по материалу (STYLE.md, «Шрифтовая карта»). Все встроены в файл (блок «ВСТРОЕННЫЕ ШРИФТЫ»),
     системные запасные — только на случай, если браузер не принял встроенный.
     ns-ok: V-fonts-many — пять гарнитур — пять материалов (гравировка, табло, машинопись, рукопись, слой игры); задание 4, раздел 8.4, разрешает до шести ===== */
  --f-engrave: "NS Plate", "NS Narrow", "Arial Narrow", sans-serif;   /* краска и гравировка по металлу: жирный узкий гротеск, как на пультах HighFleet */
  --f-plate: "NS Narrow", "Arial Narrow", "Liberation Sans Narrow", Arial, sans-serif;   /* табло, шкалы, мелкие подписи на щите */
  --f-text: "NS Sans", "Segoe UI", "Liberation Sans", Arial, sans-serif;               /* слой игры и текст для чтения */
  --f-type: "NS Mono", "Courier New", "Liberation Mono", monospace;                    /* машинопись */
  --f-hand: "NS Hand", "Segoe Print", cursive;                                         /* рукопись: ручка и карандаш */
  --f-serif: "NS Serif", "Georgia", serif;                                             /* типография: заголовки бланков и приказов */

  /* ===== ФАКТУРЫ — у каждого материала своя, все статичные ===== */
  --tex-enamel:                  /* эмаль: почти гладкая, редкие поры, свет сверху */
    radial-gradient(circle at 23% 31%, rgba(0,0,0,.26) 0 .7px, transparent 1.3px) 0 0 / 61px 47px,
    radial-gradient(circle at 71% 64%, rgba(255,255,255,.07) 0 .7px, transparent 1.3px) 0 0 / 37px 83px,
    radial-gradient(circle at 48% 12%, rgba(0,0,0,.18) 0 .6px, transparent 1.2px) 0 0 / 97px 71px,
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.06));
  --tex-ivory:                   /* табличка: гладкий пластик, чуть светлее сверху */
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 40%, rgba(0,0,0,.05));
  --tex-paper:                   /* бумага: волокно */
    repeating-linear-gradient(83deg, rgba(120,95,60,.045) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-71deg, rgba(255,255,255,.22) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(12deg, rgba(110,85,50,.035) 0 2px, transparent 2px 23px);
  --tex-card:                    /* картон: грубое волокно */
    repeating-linear-gradient(78deg, rgba(90,65,30,.08) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(-64deg, rgba(255,255,255,.12) 0 1px, transparent 1px 9px);
  --tex-bakelite:                /* бакелит: глянец сверху и микроцарапины */
    linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0) 46%),
    repeating-linear-gradient(117deg, rgba(255,255,255,.03) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(31deg, rgba(255,255,255,.02) 0 1px, transparent 1px 13px);
  --tex-alu:                     /* алюминий: продольная шлифовка */
    repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 1px, rgba(0,0,0,.05) 1px 2px, transparent 2px 3px);
  --tex-desk:                    /* столешница: пластик под дерево */
    repeating-linear-gradient(178.6deg, rgba(0,0,0,.12) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(181.3deg, rgba(255,226,186,.04) 0 2px, transparent 2px 19px),
    linear-gradient(180deg, rgba(255,255,255,.035), rgba(0,0,0,.1));
  --glint: linear-gradient(112deg, transparent 0 14%, rgba(255,255,255,.07) 14% 21%, transparent 21%); /* один косой блик на стекле */


  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Пульт всегда тёмный — так требует обстановка БЩУ; токены одинаковы в обеих темах */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --iron-frame: #1D2420; } }
:root[data-theme="dark"] { --iron-frame: #1D2420; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; font-size: clamp(9px, min(1vw, 1.7778vh), 24px); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; color: var(--engrave); overflow: hidden;
  background: var(--iron-frame);   /* рама щита: ровная, без виньетки — тепло заложено в самих цветах */
  font: 400 1rem/1.25 var(--f-plate);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; }

/* ---------- сетка пульта ---------- */
#app { height: 100%; display: grid; grid-template-rows: 3.3rem auto minmax(0, 1fr) 13.2rem; grid-template-columns: minmax(0, 1fr) var(--win-w); gap: .5rem; padding: .5rem .7rem .6rem; counter-reset: panel; }   /* номера панелей П-01…П-12 — сквозные, в порядке разметки */
#desk { display: grid; grid-template-columns: 21rem minmax(0, 1fr) 20rem; gap: .5rem; min-height: 0; }
#topbar { grid-column: 1 / -1; grid-row: 1; } #annunciator { grid-column: 1; grid-row: 2; } #desk { grid-column: 1; grid-row: 3; }
#bottom { grid-column: 1 / -1; grid-row: 4; } #window { grid-column: 2; grid-row: 2 / span 2; }
.col { display: flex; flex-direction: column; gap: .5rem; min-height: 0; min-width: 0; }
.blk-row { display: flex; gap: .5rem; min-height: 0; }
.blk-row > .blk { flex: 1 1 0; min-width: 0; }
#row-rods { flex: 11.6 1 0; } #row-boron { flex: 8.6 1 0; } #b-pumps { flex: 9.4 1 0; }
#tier1 { flex: 13.6 1 0; } #b-mimic { flex: 16.4 1 0; }
#b-grid { flex: 12.4 1 0; } #b-turb { flex: 13.4 1 0; } #b-dg { flex: 4.8 1 0; }
#b-rods { flex: 2.1 1 0; } #b-scram { flex: 1 1 0; }
#b-boron { flex: 1.6 1 0; } #b-xenon { flex: 1 1 0; }
#b-power { flex: 1.12 1 0; } #b-temp { flex: 1 1 0; } #b-pres { flex: 1.08 1 0; }

/* ---------- винты: прямой шлиц, у каждого свой угол (--sa/--sb задаёт панель) ----------
   Рисуются слоями фона таблички: шляпка .5rem и шлиц в квадрате .34rem по центру шляпки. */
.blk-h, .brand {
  --screw: radial-gradient(circle at 36% 30%, #F1F2EB 0, #BFC2BA .07rem, #858982 .16rem, #444842 .225rem, rgba(0,0,0,.6) .245rem, rgba(0,0,0,0) .29rem);
  --slot-a: linear-gradient(var(--sa, 35deg), transparent 36%, #12100E 36% 56%, rgba(255,255,255,.45) 56% 64%, transparent 64%);
  --slot-b: linear-gradient(var(--sb, -50deg), transparent 36%, #12100E 36% 56%, rgba(255,255,255,.45) 56% 64%, transparent 64%);
  --screws:
    var(--slot-a) .44rem 50% / .34rem .34rem no-repeat, var(--screw) .36rem 50% / .5rem .5rem no-repeat,
    var(--slot-b) calc(100% - .44rem) 50% / .34rem .34rem no-repeat, var(--screw) calc(100% - .36rem) 50% / .5rem .5rem no-repeat;
}
#b-power { --sa: 14deg; --sb: -61deg; }  #b-rods { --sa: 78deg; --sb: 23deg; }   #b-scram { --sa: -33deg; --sb: 52deg; }
#b-boron { --sa: 41deg; --sb: -12deg; }  #b-xenon { --sa: -70deg; --sb: 8deg; }  #b-pumps { --sa: 61deg; --sb: -38deg; }
#b-temp { --sa: -5deg; --sb: 73deg; }    #b-pres { --sa: 29deg; --sb: -83deg; }  #b-grid { --sa: -47deg; --sb: 17deg; }
#b-turb { --sa: 88deg; --sb: -24deg; }   #b-dg { --sa: 3deg; --sb: 44deg; }      .brand { --sa: -18deg; --sb: 66deg; }

/* ---------- верхняя полоса ---------- */
#topbar { display: flex; align-items: center; gap: .8rem; padding: 0 .1rem; min-width: 0; }
/* гравированная табличка с названием */
.brand {
  flex: 0 0 auto; padding: .16rem 1.25rem .12rem; white-space: nowrap;
  font: 700 1.6rem/1.1 var(--f-plate); letter-spacing: .06em; text-transform: uppercase; color: var(--engrave-ink);
  background: var(--screws), var(--tex-ivory), var(--iron-ivory); border-radius: 2px;
  box-shadow: inset 0 -2px 0 var(--iron-ivory-lo), 0 0 0 1px var(--iron-seam), 0 2px 0 rgba(0,0,0,.45);
}
/* название уровня — бумажная бирка в металлическом кармане */
.lvl-name {
  position: relative; flex: 0 0 auto; max-width: 15rem; padding: .24rem .65rem .16rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font: 400 1.1rem/1.15 var(--f-type); color: var(--paper-ink);
  background: var(--tex-paper), var(--paper-2);
  border: .2rem solid var(--iron-alu); border-top-width: .08rem; border-radius: 1px 1px 3px 3px;
  box-shadow: inset 0 .55rem .35rem -.45rem rgba(31,29,26,.3), 0 0 0 1px var(--iron-seam), 0 2px 0 rgba(0,0,0,.4);
}
/* табло задания (после плейтеста П2 автор выбрал: окно с заданием + индикатор на щите).
   Гравировка «ЗАДАНИЕ», бирка с заданием машинописью в металлическом кармане (бумага в полутени — тише живых приборов),
   справа — ряд из десяти ламп в рамке: загораются молочным по мере выполнения и гаснут по одной, если вышел из коридора;
   лампа «В ЦЕЛИ»: зелёная — условие выполняется, янтарная — в коридоре, но нарушено второе условие (что именно — на стекле) */
.goal { position: relative; flex: 1 1 auto; min-width: 0; max-width: 52rem; margin: 0 auto; display: flex; align-items: center; gap: .7rem; }
.goal-h { flex: 0 0 auto; font: 700 .82rem/1 var(--f-engrave); letter-spacing: .14em; text-transform: uppercase; color: var(--engrave-dim); }
.goal-slip { flex: 1 1 auto; min-width: 0; padding: .3rem .65rem .24rem; color: var(--paper-ink); background: var(--tex-paper), var(--paper-2);
  border: .2rem solid var(--iron-alu); border-top-width: .08rem; border-radius: 1px 1px 3px 3px;
  box-shadow: inset 0 .55rem .35rem -.45rem rgba(31,29,26,.3), 0 0 0 1px var(--iron-seam), 0 2px 0 rgba(0,0,0,.4); }
.goal-label { font: 400 .95rem/1.12 var(--f-type); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
.goal-meter { flex: 0 0 auto; display: grid; grid-template-columns: auto auto; align-items: center; column-gap: .6rem; row-gap: .14rem; }
.goal-lamps { display: flex; gap: .32rem; padding: .28rem .42rem; border: .22rem solid; background: var(--iron-well);
  border-image: linear-gradient(180deg, #A7ACA2 0, #646960 22%, #4A4E47 70%, #2C2F2A 100%) 1;
  box-shadow: inset 0 .2rem .3rem rgba(0,0,0,.9), 0 0 0 1px #070806, 0 .1rem .16rem rgba(0,0,0,.5); }
.goal-lamps .lmp, .goal-ok .lmp { width: .62rem; height: .62rem; }
.goal-count { grid-column: 1; font: 400 .84rem/1 var(--f-plate); color: var(--glass-live); white-space: nowrap; text-align: center; }
.goal-ok { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: center; gap: .22rem;
  font: 700 .6rem/1 var(--f-engrave); letter-spacing: .08em; text-transform: uppercase; color: var(--engrave-dim); white-space: nowrap; }
/* часы — нейтральные цифры в окошке */
.clock {
  font: 700 1.35rem/1 var(--f-plate); font-variant-numeric: tabular-nums; min-width: 4.4rem; text-align: center; color: var(--sig-neu);
  padding: .34rem .5rem .3rem; background: var(--glint), var(--iron-well); border-radius: 2px;
  box-shadow: inset 0 .1rem .3rem rgba(0,0,0,.9), 0 0 0 1px var(--iron-alu-dark), 0 0 0 2px var(--iron-seam);
}
.tb-btns { display: flex; align-items: center; gap: .6rem; }
.tb-btns svg { width: 1rem; height: 1rem; vertical-align: -.15rem; fill: currentColor; }
/* слой игры (STYLE.md 2.14): пауза, скорость, звук, «Заново», «Смены» — плоская спокойная полоса, без фасок, винтов, износа.
   Старые правила клавиш-«магнитофона» ниже перекрыты блоком «СЛОЙ ИГРЫ» в конце стилей */
.tb-keys { display: flex; gap: .12rem; padding: .22rem; border-radius: 2px; background: var(--tex-bakelite), #121410;
  box-shadow: inset 0 .2rem .3rem rgba(0,0,0,.9), inset 0 -1px 0 rgba(255,250,236,.12), 0 0 0 1px #070806, 0 1px 0 1px rgba(255,250,236,.08); }
.tb-keys .btn { --cap-lo: #1D1E1A; min-width: 3rem; height: 2.45rem; padding: 0 .6rem .42rem; font-size: 1.12rem; transition: padding .09s ease-out; }
.tb-keys .btn::before { display: none; }
/* клавиша: ровная верхняя грань и высокий передний торец; нажатая утоплена — торец ушёл в колодец, низ клавиши на месте */
.tb-keys .btn::after { border-width: .1rem .1rem .4rem; box-shadow: 0 0 0 1px #050504, inset 0 1px 0 rgba(255,250,236,.22); transition: top .09s ease-out; }
.tb-keys .btn:active, .tb-keys .btn.sel { transform: none; padding-top: .3rem; padding-bottom: .12rem; color: var(--cap-txt); }
.tb-keys .btn:active::after, .tb-keys .btn.sel::after { --cap: #292B25; top: .3rem; border-width: .08rem .1rem .1rem; border-top-color: var(--cap-side);
  box-shadow: 0 0 0 1px #050504, inset 0 .14rem .24rem rgba(0,0,0,.6); }
.tb-keys #btn-pause { padding-left: .75rem; padding-right: .75rem; }
.tb-keys #btn-pause span { margin-left: .4rem; }
/* служебные кнопки — отдельный маленький блок; место для регуляторов громкости (шаг 2) — рядом со звуком */
.tb-serv { display: flex; gap: .7rem; }
.tb-serv .btn { padding: .28rem .6rem .4rem; min-width: 2.5rem; font-size: .98rem; }
/* громкость: планка с тремя фейдерами под кнопкой звука — как органы пульта, контрастно */
.snd-grp { position: relative; display: flex; gap: .3rem; }
.vol-panel { position: absolute; right: 0; top: calc(100% + .5rem); z-index: 60; width: 19rem; padding: .55rem .8rem .5rem;
  background: var(--tex-bakelite), #15140F; border-radius: 3px; box-shadow: 0 0 0 1px #050504, 0 .4rem 1rem rgba(0,0,0,.65); color: #ECE5D0; }
.vol-panel[hidden] { display: none; }
.vol-row { display: grid; grid-template-columns: 7.4rem 1fr 2.8rem; align-items: center; gap: .55rem; margin: .3rem 0; font-size: .95rem; font-weight: 700; cursor: pointer; }
.vol-row output { text-align: right; font: 700 .92rem/1 var(--f-type), ui-monospace, monospace; }
.vol-row input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 1.7rem; margin: 0; background: transparent; cursor: pointer; }
.vol-row input[type=range]::-webkit-slider-runnable-track { height: .45rem; border-radius: 2px; background: #050504; box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,250,236,.14); }
.vol-row input[type=range]::-moz-range-track { height: .45rem; border-radius: 2px; background: #050504; box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,250,236,.14); }
.vol-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 1.1rem; height: 1.55rem; margin-top: -.55rem; border-radius: 2px; border: 0;
  background: linear-gradient(180deg, #F2EAD2 0, #D3C8A6 60%, #B8AD8A 100%); box-shadow: 0 0 0 1px #050504, 0 .12rem 0 #5E5744, inset 0 -.6rem 0 -.52rem #2C2923; }
.vol-row input[type=range]::-moz-range-thumb { width: 1.1rem; height: 1.55rem; border-radius: 2px; border: 0;
  background: linear-gradient(180deg, #F2EAD2 0, #D3C8A6 60%, #B8AD8A 100%); box-shadow: 0 0 0 1px #050504, 0 .12rem 0 #5E5744, inset 0 -.6rem 0 -.52rem #2C2923; }
.vol-row input[type=range]:focus-visible { outline: 2px solid #ECE5D0; outline-offset: 2px; }
#app.menu-mode .goal, #app.menu-mode .lvl-name, #app.menu-mode .clock, #app.menu-mode .tb-btns { visibility: hidden; }

/* ---------- панели: модульные щиты из эмалированной стали ---------- */
.blk {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: .3rem;
  min-height: 0; padding: .5rem .75rem .6rem; border-radius: 2px; overflow: hidden; counter-increment: panel;
  background: var(--tex-enamel), var(--iron-enamel);
  /* свет один, от потолочных ламп: светлая кромка сверху, тёмный стык снизу */
  box-shadow: inset 0 1px 0 var(--iron-enamel-hi), inset 0 -2px 0 var(--iron-seam), 0 1px 0 rgba(0,0,0,.5);
}
#b-dg { background: var(--tex-enamel), var(--iron-enamel-new); }   /* эту панель когда-то заменили */
/* номер панели по единой системе — тише названия */
.blk::before {
  content: "П-" counter(panel, decimal-leading-zero); position: absolute; top: .34rem; right: .5rem; z-index: 1;
  font: 400 .72rem/1 var(--f-plate); letter-spacing: .06em; color: var(--engrave-dim); pointer-events: none;
}
/* название панели — краской по эмали, со скобкой над группой (так на настоящих щитах и в HighFleet).
   Таблички слоновой кости остаются там, где подписывают один орган (ГЦН-1…4) или весь щит:
   двенадцать светлых табличек в углах панелей читались как заголовки окон программы. */
.blk-h {
  align-self: stretch; flex: 0 0 auto; display: flex; align-items: center; gap: .45rem; min-width: 0;
  margin: 0 .85rem 0 .3rem;   /* справа — номер панели под винтом */
  padding: .06rem 0 0; font: 700 .98rem/1.1 var(--f-engrave); letter-spacing: .05em; text-transform: uppercase; text-align: center;
  color: var(--engrave); text-shadow: 0 1px 0 rgba(0,0,0,.55);   /* краска по эмали: жирный узкий гротеск, как на пультах HighFleet */
}
/* скобка: линия на уровне букв, концы загнуты вниз — к органам, которые она объединяет */
.blk-h::before, .blk-h::after { content: ""; flex: 1 1 .6rem; min-width: .6rem; height: .42rem; margin-top: .42rem; border-top: .12rem solid var(--engrave-line); }
.blk-h::before { border-left: .12rem solid var(--engrave-line); }
.blk-h::after { border-right: .12rem solid var(--engrave-line); }
#b-pres.auto .blk-h { margin-right: 3.6rem; }
#b-pres.auto .btn.latch { cursor: default; }
#b-pres.auto .btn.latch:active, #b-pres.auto .btn.latch:active::before { transform: none; }
.badge-auto.flash { animation: autoFlash .9s steps(1, end) 1; }
@keyframes autoFlash { 0%, 66% { background: #E9F4FF; } 33%, 100% { background: var(--sig-info); } }   /* справа — окошко «авто», когда автоматика включена */
.sub { font-size: .86rem; color: var(--engrave-dim); line-height: 1.12; padding: 0 .3rem; white-space: pre-line; }
/* живой текст, который может менять цвет, — в окошке тёмного стекла (на эмали сигнальные цвета не читаются) */
#r-allow { align-self: flex-start; max-width: calc(100% - .6rem); padding: .14rem .45rem .1rem; margin: 0 .3rem; color: var(--glass-live); }   /* справа — записка у насосов */
.sub.s-warn { color: var(--sig-warn); } .sub.s-bad { color: var(--sig-bad); } .sub.s-ok { color: var(--sig-ok); }
.win, .rate-txt, .p-st, #r-allow { background: var(--glint), var(--iron-well); border-radius: 2px; box-shadow: inset 0 .08rem .25rem rgba(0,0,0,.9), 0 0 0 1px var(--iron-seam), 0 1px 0 1px rgba(255,255,255,.06); }

/* ---------- цифровые индикаторы: дымчатое стекло в утопленной рамке ---------- */
.read {
  position: relative; display: flex; align-items: center; gap: .45rem; flex: 0 0 auto; padding: .25rem .55rem;
  background: var(--iron-well); border-radius: 2px;
  box-shadow: inset 0 .12rem .35rem rgba(0,0,0,.9), 0 0 0 1px var(--iron-alu-dark), 0 0 0 2px var(--iron-seam), 0 1px 0 2px rgba(255,255,255,.07);
}
.read::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--glint); pointer-events: none; }
.seg { height: 2.3rem; flex: 0 0 auto; }
.read.sm .seg { height: 1.7rem; }
.read-row { display: flex; gap: .45rem; flex: 0 0 auto; } .read-row > .read { flex: 1 1 auto; min-width: 0; } .read-row > .read + .read { flex: 0 1 auto; }
.seg svg { height: 100%; display: block; }
.unit { font-weight: 700; font-size: 1.05rem; color: var(--glass-print); white-space: nowrap; }
.read .sub { margin-left: auto; text-align: right; color: var(--glass-live); font-size: .8rem; min-width: 0; }
.read .lbl { font-weight: 700; font-size: 1rem; color: var(--engrave); margin-right: .2rem; }
/* цвет цифр — игровой сигнал; свечение сдержанное, без ореола */
.seg-svg { --c: var(--sig-neu); }
.seg-svg .sg { fill: rgba(242,235,214,.055); }   /* погасшие сегменты едва видны */
.seg-svg .sg.on { fill: var(--c); }
.seg-svg.s-ok { --c: var(--sig-ok); } .seg-svg.s-warn { --c: var(--sig-warn); } .seg-svg.s-bad { --c: var(--sig-bad); }
.seg-svg.s-info { --c: var(--sig-info); } .seg-svg.s-neu { --c: var(--sig-neu); }

/* ---------- шкалы: узкопрофильные стрелочные приборы ---------- */
.scale {
  position: relative; height: 1.85rem; margin: .15rem .3rem 0; flex: 0 0 auto;
  background: var(--tex-ivory), var(--iron-ivory); border-radius: 2px;
  box-shadow: inset 0 1px 3px rgba(31,29,26,.45), 0 0 0 1px var(--iron-seam), 0 0 0 .2rem var(--iron-bakelite), 0 1px 0 .2rem rgba(255,255,255,.08);
}
.scale.thin { height: 1.6rem; }
.sc-track { position: absolute; left: .5rem; right: .5rem; top: 0; bottom: 0; }
/* зоны нормы и опасности нанесены краской прямо на шкалу */
.sc-zones i { position: absolute; top: .2rem; height: .3rem; }
.z-ok { background: var(--paint-ok); } .z-warn { background: var(--paint-warn); } .z-bad { background: var(--paint-bad); } .z-info { background: var(--paint-info); }
.sc-fill { display: none; }   /* стрелочный прибор: величину показывает стрелка */
.sc-minor i { position: absolute; top: .5rem; width: 1px; height: .16rem; margin-left: -.5px; background: var(--engrave-ink); }
/* задание — скобка-указатель на ободе: заметная, но тише стрелки (STYLE.md, 2.7) */
.sc-target { position: absolute; top: -.02rem; height: .42rem; border: .14rem solid var(--ink-ok); border-bottom: 0; border-radius: 1px 1px 0 0; background: rgba(46,158,71,.12); display: none; }
/* стрелка: тёмная на подсвеченной шкале, толще, с заострённым концом и тенью от ключевого света (вниз-вправо) */
.sc-needle { position: absolute; top: .2rem; width: .26rem; height: 1.04rem; margin-left: -.13rem; background: var(--engrave-ink); border-radius: 0 0 .06rem .06rem;
  box-shadow: .1rem .08rem 0 rgba(31,29,26,.28); }
.sc-needle::before { content: ""; position: absolute; left: 0; bottom: 100%; border-left: .13rem solid transparent; border-right: .13rem solid transparent; border-bottom: .2rem solid var(--engrave-ink); }
.scale.thin .sc-needle { height: .86rem; }
/* подсветка шкалы: лампа за стеклом у живого прибора; к краям поля свет падает. У заглушек её нет */
.blk.duty { --scale-lamp: var(--scale-lamp-duty); }
.blk.duty .scale { background: var(--tex-ivory), #DCD1B0; }   /* у прибора цели поле шкалы на свету — светлее остальных */
.scale::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(ellipse 60% 140% at 50% -20%, var(--scale-lamp), rgba(255,222,160,0) 72%),
              linear-gradient(90deg, var(--scale-shade), rgba(46,34,16,0) 22%, rgba(46,34,16,0) 78%, var(--scale-shade)); }
/* белый треугольник над шкалой — задание (диспетчера или клапана) */
.sc-mark { position: absolute; top: -.58rem; width: 0; height: 0; margin-left: -.36rem; border-left: .36rem solid transparent; border-right: .36rem solid transparent; border-top: .48rem solid var(--sig-neu); display: none; }
.sc-ticks { position: absolute; left: .5rem; right: .5rem; top: .7rem; height: .9rem; font-size: .76rem; line-height: 1.1; color: var(--engrave-ink); }
.scale.thin .sc-ticks { top: .55rem; }
.sc-ticks span { position: absolute; top: .12rem; transform: translateX(-50%); white-space: nowrap; }
.sc-ticks span::before { content: ""; position: absolute; left: 50%; top: -.34rem; width: 1px; height: .3rem; background: var(--engrave-ink); }
.sc-ticks span.l { transform: none; } .sc-ticks span.l::before { left: 0; }
.sc-ticks span.r { transform: translateX(-100%); } .sc-ticks span.r::before { left: auto; right: 0; }

/* ---------- кнопки: колпачок в прямоугольном фланце (ориентир — HighFleet и настоящие пульты) ----------
   Объём дают грани, а не градиент: лицо колпачка ровное по тону, верхняя фаска на свету, боковые в полутени,
   нижняя — в тени. Между колпачком и фланцем — чёрный зазор, фланец — прямоугольная накладка со своей кромкой.
   Скругления не больше 2 px: это металл и бакелит. ::before — фланец, ::after — колпачок.
   Нажатие (80–120 мс): колпачок с надписью уходит вниз, нижняя фаска прячется, верхняя уходит в тень. */
.btn {
  --cap: #30322C; --cap-hi: #5B5E54; --cap-side: #3F4139; --cap-lo: #121310; --cap-txt: #E6DDC2;
  position: relative; z-index: 0; cursor: pointer; border: 0; border-radius: 2px; background: none; color: var(--cap-txt);
  padding: .4rem .75rem .5rem; font-weight: 700; font-size: 1rem; line-height: 1.1; letter-spacing: .03em;
  text-shadow: 0 1px 0 rgba(0,0,0,.7); box-shadow: none; touch-action: manipulation;
  /* отпускание и наведение: колпачок возвращается за --t-release, верхняя фаска ловит свет за --t-hover */
  transition: transform var(--t-release) ease-out, --cap var(--t-hover) ease-out, --cap-hi var(--t-hover) ease-out;
}
.btn::before { content: ""; position: absolute; inset: -.28rem; z-index: -2; border-radius: 2px; pointer-events: none; transition: transform var(--t-release) ease-out;
  background: var(--tex-bakelite), #272923;
  box-shadow: inset 0 1px 0 rgba(255,250,236,.17), inset 0 -1px 0 rgba(0,0,0,.6), 0 0 0 1px #080907, 0 .1rem 0 1px rgba(0,0,0,.45); }
.btn::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 2px; pointer-events: none;
  border-style: solid; border-width: .12rem .1rem .22rem; border-color: var(--cap-hi) var(--cap-side) var(--cap-lo);
  background: var(--tex-bakelite), var(--cap);
  box-shadow: 0 0 0 .09rem #050504, inset 0 1px 0 rgba(255,250,236,.2); }
.btn:hover { --cap: #373931; --cap-hi: #7A7D71; --cap-side: #46483F; }
.btn:active, .btn.pressed { transform: translateY(.16rem); transition-duration: var(--t-press); }
.btn:active::before, .btn.pressed::before { transform: translateY(-.16rem); transition-duration: var(--t-press); }
.btn:active::after, .btn.pressed::after { border-width: .1rem .1rem .08rem; border-top-color: var(--cap-side);
  box-shadow: 0 0 0 .09rem #050504, inset 0 .14rem .22rem rgba(0,0,0,.45); }
.btn:disabled { cursor: default; transform: none; --cap: #26271F; --cap-hi: #35362E; --cap-side: #2B2C25; --cap-lo: #10110E; --cap-txt: #8E887A; }
.btn:disabled::before { transform: none; }
.btn small { display: block; font-size: .78rem; font-weight: 400; color: #CFC6AC; margin-top: .06rem; letter-spacing: 0; }
.btn:disabled small { color: #858072; }
/* слоновая кость — главное действие в окнах журнала */
.btn.primary { --cap: #D3C8A6; --cap-hi: #F0E8D0; --cap-side: #BDB291; --cap-lo: #7F755A; --cap-txt: var(--engrave-ink); text-shadow: 0 1px 0 rgba(255,253,244,.5); }
.btn.primary::after { background: var(--tex-ivory), var(--cap); box-shadow: 0 0 0 .09rem #050504, inset 0 1px 0 rgba(255,255,255,.4); }
.btn.primary:hover { --cap: #DCD2B2; --cap-hi: #F6EFDA; }
.btn.primary small { color: #3A362E; }
.btn.big { font-size: 1.15rem; padding: .5rem .95rem .6rem; }
.btn-row { display: flex; gap: .8rem; flex: 0 0 auto; padding: .34rem .34rem .38rem; }
.btn-row .btn { flex: 1 1 0; min-width: 0; }
/* «Нагрев» и «Впрыск» — кнопки с подсветкой: линза из молочного пластика, за ней две лампы.
   Погашенная — серая и тёмная, горящая — светлая и цветная (нагрев жёлтым, впрыск зелёным): разница прежде всего в яркости.
   Зафиксированная кнопка утоплена. */
.btn.latch { --cap: #7D7768; --cap-hi: #9A9484; --cap-side: #6C6759; --cap-lo: #3E3A31; --cap-txt: #15130F; text-shadow: 0 1px 0 rgba(255,253,244,.18); }
.btn.latch .lmp { display: none; }
.btn.latch:disabled { --cap: #625D51; --cap-hi: #77725F; --cap-side: #57534A; --cap-lo: #33302A; --cap-txt: #25231F; }
.btn.latch:has(.lmp.warn) { --cap: var(--sig-warn); --cap-hi: #FFE2A6; --cap-side: #E39A14; --cap-lo: #9A6205; --cap-txt: #1A1400; text-shadow: 0 1px 0 rgba(255,253,244,.35); }
.btn.latch:has(.lmp.ok) { --cap: var(--sig-ok); --cap-hi: #C3F7D2; --cap-side: #2DB85A; --cap-lo: #187A38; --cap-txt: #02240F; text-shadow: 0 1px 0 rgba(255,253,244,.35); }
/* ns-ok: два горячих пятна — свет ламп за горящей линзой, а не украшение */
.btn.latch:has(.lmp.warn)::after, .btn.latch:has(.lmp.ok)::after {
  background: radial-gradient(ellipse 34% 62% at 31% 52%, rgba(255,252,236,.66), rgba(255,252,236,0) 100%), radial-gradient(ellipse 34% 62% at 69% 48%, rgba(255,252,236,.66), rgba(255,252,236,0) 100%), var(--cap); }
.btn.latch.on { transform: translateY(.12rem); }
.btn.latch.on::before { transform: translateY(-.12rem); }
.btn.latch.on::after { border-width: .1rem .1rem .08rem; border-top-color: var(--cap-side); box-shadow: 0 0 0 .09rem #050504, inset 0 .12rem .2rem rgba(0,0,0,.35); }
.btn:focus-visible, .az-btn:focus-visible, .az-cover:focus-visible, .lvl:focus-visible, .tog:focus-visible {
  outline: .16rem solid var(--look-light); outline-offset: .42rem; }

/* ---------- табло сигнализации: окна из молочного стекла ---------- */
#annunciator {
  position: relative; display: flex; flex-wrap: wrap; gap: .22rem; min-height: 2.6rem; padding: .28rem 7.3rem .28rem .28rem;
  background: var(--iron-bakelite); border-radius: 3px;
  box-shadow: inset 0 .1rem .35rem rgba(0,0,0,.85), 0 0 0 1px var(--iron-seam), 0 1px 0 1px rgba(255,255,255,.05);
}
/* кнопка «Квитировать» — увесистая кнопка пульта без фиксации, справа на табло */
#btn-ack { position: absolute; right: .28rem; top: .28rem; bottom: .28rem; width: 6.8rem; padding: .15rem .3rem .3rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; font-size: .9rem; line-height: 1.05; }
/* подсказка клавиши — слой игры, а не надпись на щите: маленькая «клавиша» одного вида (латиница — только в ней) */
.kc { display: inline-block; min-width: 1.2rem; padding: .08rem .28rem .1rem; font: 700 .72rem/1 var(--f-type), ui-monospace, monospace; letter-spacing: 0;
  color: #15130F; background: #E3DBC2; border-radius: 2px; box-shadow: 0 .1rem 0 #8C846C, 0 0 0 1px #050504; text-shadow: none; }
.ann {
  --lit: var(--ann-off); --hot: rgba(255,250,236,.92); --sh: .07;
  position: relative; z-index: 0; flex: 1 1 5.4rem; max-width: 12.5rem; min-height: 2.3rem; display: flex; align-items: center; justify-content: center;
  text-align: center; padding: .1rem .2rem; font-weight: 700; font-size: .84rem; line-height: 1.02; color: var(--ann-off-txt);
  background-color: var(--ann-off); border-radius: 1px;
  background-image: linear-gradient(180deg, rgba(255,255,255,var(--sh)), rgba(255,255,255,0) 35%, rgba(0,0,0,.08));
  box-shadow: inset 0 .1rem .2rem rgba(0,0,0,.35), 0 0 0 1px #0B0A09;
  transition: background-color .15s linear, color .15s linear;       /* лампа накаливания гаснет ≈150 мс */
}
/* за стеклом горящего окна видны два горячих пятна от двух ламп */
.ann::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .15s linear;
  background: radial-gradient(ellipse 36% 62% at 30% 52%, var(--hot), transparent 100%), radial-gradient(ellipse 36% 62% at 70% 48%, var(--hot), transparent 100%); }
.ann.on-warn, .ann.on-bad, .ann.on-info, .ann.on-ok { --sh: .2; background-color: var(--lit); color: #121110; text-shadow: 0 1px 0 rgba(255,253,244,.22); transition-duration: .08s; }  /* загорается ≈80 мс */
.ann.on-warn::before, .ann.on-bad::before, .ann.on-info::before, .ann.on-ok::before { opacity: 1; transition-duration: .08s; }
.ann.on-warn { --lit: var(--sig-warn); --hot: rgba(255,244,210,.9); }
.ann.on-bad { --lit: var(--sig-bad); --hot: rgba(255,220,210,.92); }
.ann.on-info { --lit: var(--sig-info); --hot: rgba(221,238,255,.72); }
.ann.on-ok { --lit: var(--sig-ok); --hot: rgba(228,255,234,.8); }
/* новая, не квитированная сигнализация мигает (≤ 2 раз в секунду, с инерцией нити); квитированная горит ровно.
   Состояние квитирования живёт в Game (ann), интерфейс только ставит .unack */
.ann.unack { animation: annBlink 1s linear infinite; }
.ann.unack::before { animation: annBlinkHot 1s linear infinite; }
@keyframes annBlink { 0%, 42% { background-color: var(--lit); color: #121110; } 57%, 92% { background-color: var(--off-bg, var(--ann-off)); color: var(--off-txt, var(--ann-off-txt)); } 100% { background-color: var(--lit); color: #121110; } }
@keyframes annBlinkHot { 0%, 42% { opacity: 1; } 57%, 92% { opacity: 0; } 100% { opacity: 1; } }

/* ---------- лампы: цветной колпачок в металлическом ободке ---------- */
.lmp {
  --off: var(--off-neu); --lit: var(--off); --hot: transparent; --halo: transparent;
  position: relative; z-index: 0; display: inline-block; width: .85rem; height: .85rem; border-radius: 50%; flex: 0 0 auto; vertical-align: middle;
  background-color: var(--off);
  background-image: radial-gradient(circle at 34% 30%, rgba(255,255,255,.26) 0 12%, transparent 34%);   /* стекло колпачка */
  box-shadow: inset 0 -1px 2px rgba(0,0,0,.5), 0 0 0 .1rem var(--iron-alu), 0 0 0 .16rem var(--iron-seam);
  transition: background-color .15s linear;
}
.lmp::after { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: 0; transition: opacity .15s linear;
  background: radial-gradient(circle at 42% 40%, var(--hot) 0 26%, transparent 66%); }
.lmp::before { content: ""; position: absolute; inset: -.42rem; z-index: -1; border-radius: 50%; opacity: 0; transition: opacity .15s linear; pointer-events: none;
  background: radial-gradient(circle, var(--halo) 0, transparent 68%); }
.lmp.ok, .lmp.warn, .lmp.bad, .lmp.info { background-color: var(--lit); transition-duration: .08s; }
.lmp.ok::after, .lmp.warn::after, .lmp.bad::after, .lmp.info::after,
.lmp.ok::before, .lmp.warn::before, .lmp.bad::before, .lmp.info::before { opacity: 1; transition-duration: .08s; }
.lmp.ok { --lit: var(--sig-ok); --off: var(--off-ok); --hot: var(--hot-ok); --halo: var(--halo-ok); }
.lmp.warn { --lit: var(--sig-warn); --off: var(--off-warn); --hot: var(--hot-warn); --halo: var(--halo-warn); }
.lmp.bad { --lit: var(--sig-bad); --off: var(--off-bad); --hot: var(--hot-bad); --halo: var(--halo-bad); }
.lmp.info { --lit: var(--sig-info); --off: var(--off-info); --hot: var(--hot-info); --halo: var(--halo-info); }
/* молочная лампа — отметка, а не сигнал: звёзды смены на пульте «График смен» (STYLE.md 2.4) */
.lmp.mlk { --lit: var(--mark-lit); --hot: #FFFDF4; --halo: var(--mark-halo); background-color: var(--lit); transition-duration: .08s; }
.lmp.mlk::after, .lmp.mlk::before { opacity: 1; transition-duration: .08s; }
#l-heat { --off: var(--off-warn); }   /* нагрев горит жёлтым — погашенный колпачок тоже жёлтый */
#l-spray { --off: var(--off-ok); }
.lmp.blink { animation: lmpBlink 1s linear infinite; }
.lmp.blink::after, .lmp.blink::before { animation: annBlinkHot 1s linear infinite; }
@keyframes lmpBlink { 0%, 42% { background-color: var(--lit); } 57%, 92% { background-color: var(--off); } 100% { background-color: var(--lit); } }

/* ---------- блоки реактора ---------- */
.rate-row { display: flex; align-items: center; gap: .5rem; padding: 0 .3rem; flex: 0 0 auto; }
.rate-row b { font: 700 .98rem/1 var(--f-engrave); letter-spacing: .08em; text-transform: uppercase; color: var(--engrave); text-shadow: 0 1px 0 rgba(0,0,0,.55); }
.rate-txt { font-weight: 700; font-size: 1.32rem; white-space: nowrap; color: var(--sig-neu); padding: .06rem .5rem .02rem; }
.rate-txt.s-ok { color: var(--sig-ok); } .rate-txt.s-warn { color: var(--sig-warn); } .rate-txt.s-bad { color: var(--sig-bad); } .rate-txt.s-info { color: var(--sig-info); }
.rods-body { display: flex; gap: .55rem; flex: 1 1 auto; min-height: 0; }
/* разрез зоны в миниатюре — та же крашеная панель со светлыми линиями, что и мнемосхема: живые только стержни и нагрев */
.rodviz [stroke="#1F1D1A"] { stroke: #CFC9B5; } #rv-rods rect { fill: #D6D0BC; } .rodviz rect[fill="#8A8678"] { fill: #4A5650; }
.rodviz { flex: 0 0 3.6rem; height: 100%; min-height: 0; background: #2B3833; border-radius: 1px; box-shadow: inset 0 1px 3px rgba(31,29,26,.5), 0 0 0 .16rem var(--iron-bakelite), 0 0 0 calc(.16rem + 1px) var(--iron-seam); }
.rods-ctl { flex: 1; display: flex; flex-direction: column; gap: .3rem; justify-content: space-between; min-width: 0; padding: 0 .16rem;
 }
.btn.hold { font-size: 1.06rem; padding: .22rem .4rem .34rem; touch-action: none; }
.btn.hold small { font-size: .72rem; }
#b-rods .read.sm { padding: .2rem .45rem; gap: .35rem; }
#b-rods .read.sm .seg { height: 1.5rem; }
.u-sm { font-weight: 400; font-size: .7rem; }
/* ярус 1 (STYLE.md, 2.4): мощность — самые крупные цифры на щите */
/* ярус 1 (STYLE.md 2.4): мощность, вода, давление, генератор — самые крупные цифры */
#tier1 .read .seg, #b-grid .read .seg { height: 3.1rem; }
#tier1 .read .unit, #b-grid .read .unit { font-size: 1.3rem; }
#b-scram { align-items: center; text-align: center; }
/* АЗ: красный грибок под откидной крышкой, вокруг жёлто-чёрная штриховка (больше её на пульте нет) */
.az-wrap { position: relative; width: 5.4rem; height: 5.4rem; flex: 0 0 auto; border-radius: .3rem;
  background: radial-gradient(circle, var(--iron-bakelite) 0 2.2rem, transparent calc(2.2rem + 1px)),
              repeating-linear-gradient(-45deg, var(--iron-hazard) 0 .42rem, var(--iron-bakelite) .42rem .84rem);
  box-shadow: inset 0 0 0 .14rem var(--iron-bakelite), 0 0 0 1px var(--iron-seam), 0 2px 0 rgba(0,0,0,.4); }
.az-btn { position: absolute; inset: .62rem; border-radius: 50%; border: .2rem solid #4A0E09; cursor: pointer; padding: 0;
  font: 700 1.3rem/1 var(--f-plate); letter-spacing: .04em; color: var(--sig-neu);
  background: radial-gradient(circle at 38% 30%, #E0483A 0, #C22A1E 40%, #9A1A11 78%, #6E0F09 100%);
  box-shadow: 0 .3rem 0 #4A0E09, 0 .42rem .5rem rgba(0,0,0,.55), inset 0 -.2rem .35rem rgba(0,0,0,.35), inset 0 .12rem .2rem rgba(255,255,255,.18);
  transition: transform .06s; }
.az-btn:active, .az-btn.fired { transform: translateY(.34rem); box-shadow: 0 .06rem 0 #4A0E09, 0 .12rem .2rem rgba(0,0,0,.55), inset 0 -.12rem .25rem rgba(0,0,0,.4); }   /* глубокий ход грибка */
.az-btn.fired { background: radial-gradient(circle at 38% 30%, #C73A2D 0, #A72218 45%, #7C140D 100%); }   /* грибок утоплен и зафиксирован */
/* крышка тяжёлая: откидывается с рывком и перелётом за --t-heavy; при наведении чуть приподнимается */
.az-cover { position: absolute; inset: 0; z-index: 2; padding: 0; border: 0; background: none; cursor: pointer; transform-origin: 50% 0;
  transform: perspective(14rem) rotateX(0deg); transition: transform var(--t-heavy) var(--ease-heavy), opacity var(--t-heavy) ease; }
.az-cover:hover { transform: perspective(14rem) rotateX(9deg); transition-duration: var(--t-hover); transition-timing-function: ease-out; }
.az-cover svg { width: 100%; height: 100%; display: block; overflow: visible; }
.az-wrap.open .az-cover { transform: perspective(14rem) rotateX(78deg); opacity: .55; pointer-events: none; transition-duration: var(--t-heavy); transition-timing-function: var(--ease-heavy); }

/* ---------- тумблеры насосов: металлический рычаг на бакелитовом основании ---------- */
.pumps { display: flex; justify-content: space-around; gap: .3rem; flex: 1 1 auto; align-items: center; min-height: 0; }
.pump { display: flex; flex-direction: column; align-items: center; gap: .24rem; }
.p-name { font-weight: 700; font-size: .95rem; line-height: 1.05; padding: .08rem .4rem .04rem; color: var(--engrave-ink); background: var(--tex-ivory), var(--iron-ivory); border-radius: 1px;
  box-shadow: inset 0 -1px 0 var(--iron-ivory-lo), 0 0 0 1px rgba(30,26,23,.5); letter-spacing: .03em; }
.p-st { font-size: .78rem; color: var(--glass-live); min-height: 1em; white-space: nowrap; padding: .06rem .32rem .02rem; }
.p-st.s-bad { color: var(--sig-bad); } .p-st.s-warn { color: var(--sig-warn); } .p-st.s-ok { color: var(--sig-ok); }
.tog { position: relative; width: 2.3rem; height: 3.1rem; border-radius: 2px; border: 0; cursor: pointer; padding: 0;
  --th: radial-gradient(circle at 38% 32%, var(--iron-alu-hi) 0, var(--iron-alu) .1rem, var(--iron-alu-dark) .18rem, transparent .2rem);
  background:
    radial-gradient(circle at 50% 50%, var(--iron-alu-hi) 0 .2rem, var(--iron-alu) .22rem .36rem, var(--iron-alu-dark) .38rem .44rem, transparent .46rem),
    linear-gradient(var(--ta, 30deg), transparent 40%, var(--iron-bakelite) 40% 60%, transparent 60%) 50% .39rem / .24rem .24rem no-repeat,
    var(--th) 50% .3rem / .42rem .42rem no-repeat,
    linear-gradient(var(--tb, -40deg), transparent 40%, var(--iron-bakelite) 40% 60%, transparent 60%) 50% calc(100% - .39rem) / .24rem .24rem no-repeat,
    var(--th) 50% calc(100% - .3rem) / .42rem .42rem no-repeat,
    var(--tex-bakelite), var(--iron-bakelite);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -.12rem 0 rgba(0,0,0,.45), 0 0 0 1px var(--iron-seam), 0 .14rem .2rem rgba(0,0,0,.45); }
.pump:nth-child(1) .tog { --ta: 22deg; --tb: -66deg; } .pump:nth-child(2) .tog { --ta: -48deg; --tb: 11deg; }
.pump:nth-child(3) .tog { --ta: 83deg; --tb: 37deg; }  .pump:nth-child(4) .tog { --ta: -9deg; --tb: -79deg; }
.tog .lever { position: absolute; left: calc(50% - .17rem); bottom: 50%; width: .34rem; height: 1.25rem; border-radius: .1rem .1rem .17rem .17rem;
  background: linear-gradient(90deg, var(--iron-alu-dark), var(--iron-alu-hi) 40%, var(--iron-alu) 70%, var(--iron-alu-dark));
  transform-origin: 50% 100%; transform: rotate(180deg); transition: transform .12s ease-out; box-shadow: 1px 1px 0 rgba(0,0,0,.4); }
.tog .lever::after { content: ""; position: absolute; left: -.13rem; top: -.2rem; width: .6rem; height: .6rem; border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, var(--iron-alu-hi), var(--iron-alu) 55%, var(--iron-alu-dark)); box-shadow: 0 1px 1px rgba(0,0,0,.45); }
.tog.on .lever { transform: rotate(0deg); }

/* ---------- ДГ ---------- */
.dg-row { display: flex; align-items: center; gap: .7rem; padding-left: .14rem; }
.dg-row .btn { flex: 0 0 auto; }
.dg-status { display: flex; align-items: center; gap: .5rem; flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 1rem; line-height: 1.15; padding: 0; color: var(--engrave); }
/* «авто» у давления — маленькое светящееся окошко: автоматика держит давление сама */
.badge-auto { position: absolute; right: .5rem; top: 1.14rem; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: #0B1B2B; background: var(--sig-info); border-radius: 1px; padding: .06rem .35rem .02rem; box-shadow: 0 0 0 1px #0B0A09, 0 0 0 .14rem var(--iron-alu-dark); white-space: nowrap; }

/* ---------- закрытые панели: глухая крышка на винтах, картонная бирка на проволоке с пломбой ---------- */
.cover {
  position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  padding: .5rem; text-align: center; border-radius: inherit;
  background:
    var(--tex-enamel), var(--iron-enamel-plug);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 var(--iron-seam), inset 0 0 0 .3rem rgba(0,0,0,.08);
  transition: transform .5s ease-in, opacity .4s .1s;
}
.cover svg { width: 5rem; height: 1.6rem; display: block; overflow: visible; }
.cover span {
  --tilt: -2deg; position: relative; margin-top: .45rem; padding: .64rem .75rem .26rem; max-width: 92%;
  font: 700 .95rem/1.1 var(--f-plate); color: var(--paper-ink); background: var(--tex-card), var(--paper-card); border-radius: 3px;
  transform: rotate(var(--tilt)); transform-origin: 50% .37rem; box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.cover span::before { content: ""; position: absolute; left: 50%; top: .2rem; width: .34rem; height: .34rem; margin-left: -.17rem; border-radius: 50%;
  background: var(--iron-enamel-plug); box-shadow: 0 0 0 .1rem #B9A675; }   /* дырочка бирки с картонным пистоном */
.cover span::after { content: ""; position: absolute; left: 50%; bottom: calc(100% - .37rem); width: 1px; height: .85rem; background: var(--iron-alu-dark); }   /* проволока к пломбе */
#b-boron .cover span { --tilt: 3deg; } #b-xenon .cover span { --tilt: -4deg; } #b-pumps .cover span { --tilt: 1.5deg; }
#b-temp .cover span { --tilt: -3deg; } #b-pres .cover span { --tilt: 2.5deg; } #b-grid .cover span { --tilt: -1deg; }
#b-turb .cover span { --tilt: 2deg; } #b-dg .cover span { --tilt: -2.5deg; } #b-rods .cover span { --tilt: 1deg; }
.blk:not(.locked) > .cover { transform: translateY(.9rem); opacity: 0; pointer-events: none; }   /* крышку отвинтили и сняли */

/* ---------- указатель «смотри сюда»: один вид на всю игру ----------
   Несигнальный двойной контур (светлый в тёмной обводке), пульсирует через opacity.
   .blk.fresh — только что открытая панель; .look — прибор или кнопка, о которых говорит Палыч (2.0). */
.blk.fresh::after, .look::after {
  content: ""; position: absolute; inset: .14rem; z-index: 8; pointer-events: none; border-radius: 2px;
  border: .2rem solid var(--look-light); box-shadow: 0 0 0 .14rem var(--look-dark), inset 0 0 0 .12rem var(--look-dark);
  animation: lookPulse 1.1s ease-in-out 5 alternate;
}
.look { position: relative; }
.look::after { inset: -.3rem; animation-iteration-count: infinite; }
/* ns-ok: указатель «смотри сюда» пульсирует по заданию автора (CLAUDE.md, «Общий язык интерфейса»); при reduced-motion горит ровно.
   ns-ok: V-anim-many — бесконечные анимации идут только по состоянию: мигание тревог и ламп, указатель; в покое щит неподвижен */
@keyframes lookPulse { from { opacity: 1; } to { opacity: .22; } }

/* ---------- следы людей: инвентарный номер, затёртости. Шпаргалки-инструкции на щите не живут (STYLE.md, 2.12) ---------- */
.trace { pointer-events: none; }
/* записка у насосов, шариковая ручка; приклеена кусочком скотча */
.note-scrap { position: absolute; right: .6rem; bottom: .5rem; padding: .2rem .5rem .12rem; transform: rotate(2.5deg);
  font: 400 1.05rem/1.1 var(--f-hand); color: var(--paper-pen); background: var(--tex-paper), var(--paper); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.note-scrap::before { content: ""; position: absolute; left: 50%; top: -.32rem; width: 1.8rem; height: .55rem; margin-left: -.9rem; background: rgba(216,199,140,.75); transform: rotate(-3deg); }
/* инвентарный номер кисточкой на раме мнемосхемы */
.paint { position: absolute; left: .7rem; bottom: .08rem; font: 400 .86rem/1 var(--f-hand); color: var(--engrave); letter-spacing: .02em; transform: rotate(-1deg); }
/* заводской шильдик */
.plate-fab { width: 4.6rem; height: 1.4rem; flex: 0 0 auto; display: block; }

/* ---------- мнемосхема: светлый плакат в раме ---------- */
#b-mimic { padding: .42rem .42rem .9rem; }
#b-mimic::before { top: auto; bottom: .17rem; }   /* номер панели — на нижней кромке рамы */
#mimic { width: 100%; height: 100%; display: block; }
#mimic text { font-family: var(--f-plate); font-weight: 700; fill: var(--paper-ink); }
#mimic .lbl { font-size: 15px; }
#mimic .tag { font-size: 14px; fill: var(--sig-neu); }
#mimic .note { font-size: 12.5px; fill: #3A3632; font-weight: 400; }
#mimic .mm-flow { fill: none; stroke-linecap: round; }
/* мнемосхема тише живых приборов (МНЕМ-01, СВЕТ-01). Два варианта сравнены прищуром (polish/shots/P3/b): выбран (б) —
   на крашеной панели из всей схемы выделяется только горячая вода в реакторе, то есть живые данные; плакат (а) оставался
   большим светлым пятном. Вариант (а) остаётся без класса .mm-b:
   (а) по умолчанию — плакат под стеклом в полутени: бумага и заливки аппаратов темнее, внизу тень от рамы;
   (б) .mm-b — крашеная панель со светлыми линиями: светятся только трубы (цвет — температура) и окошки цифр.
   Цвета труб — информация, их не трогаем. */
#mimic [fill="#CDC09E"] { fill: #9D9377; }
#mimic [fill="#E6E0CF"] { fill: #B3AC98; }
#mimic [fill="#C9C3B1"] { fill: #9A9483; }
#mimic [stroke="#E6E0CF"] { stroke: #B3AC98; }
#mimic [stroke="#EFE6CE"], #mimic .mm-flow [stroke="#EFE6CE"] { stroke: #D3CAB2; }
#hatch rect { fill: #9A9483; }
#b-mimic .glass { background: linear-gradient(180deg, rgba(8,10,9,.06) 0, rgba(8,10,9,0) 30%, rgba(8,10,9,.2) 100%),
    linear-gradient(118deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.07) 24%, rgba(255,255,255,.02) 34%, rgba(255,255,255,0) 40%); }

#b-mimic.mm-b #mimic [fill="#9D9377"], #b-mimic.mm-b #mimic [fill="#CDC09E"] { fill: #31403A; }
#b-mimic.mm-b #mimic [fill="#E6E0CF"] { fill: #26322D; }
#b-mimic.mm-b #mimic [fill="#C9C3B1"], #b-mimic.mm-b #hatch rect { fill: #3B4943; }
#b-mimic.mm-b #mimic [stroke="#1F1D1A"], #b-mimic.mm-b #hatch path { stroke: #CFC9B5; }
#b-mimic.mm-b #mimic [fill="#1F1D1A"] { fill: #CFC9B5; }
#b-mimic.mm-b #mm-rods, #b-mimic.mm-b #mm-rods * { fill: #161A17; }   /* стержни — тёмные на светящейся воде */
#b-mimic.mm-b #mm-vwater { opacity: .52; }   /* вода в корпусе — большая площадь: цвет температуры остаётся, но тише труб и цифр */
#b-mimic.mm-b #mimic [stroke="#E6E0CF"] { stroke: #26322D; }
#b-mimic.mm-b #mimic text { fill: #D9D3C0; }
#b-mimic.mm-b #mimic .note { fill: #AFA996; }
#b-mimic.mm-b #mimic rect[fill^="url(#p"], #b-mimic.mm-b #mimic rect[fill="url(#gAge)"] { display: none; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: .25; } }   /* «пауза» мигает, когда жмут при остановленном времени */

/* ---------- столешница пульта ---------- */
#bottom { display: grid; grid-template-columns: 34rem minmax(0, 1fr); gap: .5rem; min-height: 0;
  margin: 0 -.7rem -.6rem; padding: .55rem .7rem .75rem;            /* столешница во всю ширину пульта */
  background:
    radial-gradient(ellipse 22% 1.1rem at 50% 100%, rgba(232,214,186,.13), transparent 100%),   /* кромку затёрли локтями */
    var(--tex-desk), var(--iron-desk);
  box-shadow: inset 0 2px 0 rgba(0,0,0,.45), inset 0 -.32rem 0 var(--iron-desk-edge); }

/* ---------- наставник и графики ---------- */
/* ---------- Палыч: громкоговорящая связь на столе, реплика — на бумажном листе ---------- */
.mentor { position: relative; display: flex; gap: .8rem; min-height: 0; padding: .6rem .8rem .6rem .7rem; border-radius: 3px;
  background: var(--tex-bakelite), var(--iron-bakelite);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.5), 0 0 0 1px #0B0A09, 0 3px 0 rgba(0,0,0,.35); }
.m-side { flex: 0 0 6rem; display: flex; flex-direction: column; gap: .45rem; min-height: 0; }
/* портрет — фотокарточка из служебного удостоверения: рисунок тушью на бумаге, белое поле, уголок печати (ПАЛ-01) */
.face { flex: 0 0 6rem; width: 6rem; height: 6rem; border-radius: 1px; background: #B9B099; padding: .22rem; box-sizing: border-box;
  box-shadow: 0 0 0 1px rgba(20,18,14,.55), 0 .12rem .2rem rgba(0,0,0,.5); }
.face [fill="#E6DBBF"] { fill: #B2A991; } .face [fill="#C9C3B1"] { fill: #A39A83; }
.face [fill="#F4F1E8"], .face [fill="#E2DCCB"] { fill: #BCB39B; } .face [fill="#E1A97F"] { fill: #B8AF97; } .face [fill="#C98E66"] { fill: #968D77; }
.face [fill="#1F4F9C"], .face [fill="#5A4636"] { fill: #2C2A25; }
.m-side { position: relative; }
.m-side::after { content: ""; position: absolute; left: 3.6rem; top: 3.7rem; width: 2.6rem; height: 2.6rem; border-radius: 50%; pointer-events: none;   /* оттиск печати на уголке карточки */
  border: .14rem solid rgba(122,48,92,.55); clip-path: inset(0 45% 45% 0); }
/* решётка громкоговорителя: перфорированный металл, лампа вызова вспыхивает при новой реплике */
.spk { position: relative; flex: 1 1 auto; min-height: 2.6rem; border-radius: .35rem;
  background: radial-gradient(circle, #0B0A09 0 .085rem, transparent .1rem) 0 0 / .34rem .34rem, var(--tex-alu), var(--iron-alu-dark);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 0 0 .14rem var(--iron-alu), 0 0 0 calc(.14rem + 1px) #0B0A09; }
.spk-lamp { --off: var(--off-neu); --lit: var(--sig-neu); --hot: #FFFBEF; --halo: rgba(242,235,214,.3);
  position: absolute; right: .32rem; top: .32rem; }
.mentor:has(.m-text.p2) .spk-lamp { --lit: var(--sig-warn); --off: var(--off-warn); --hot: var(--hot-warn); --halo: var(--halo-warn); }
.mentor:has(.m-text.p3) .spk-lamp { --lit: var(--sig-bad); --off: var(--off-bad); --hot: var(--hot-bad); --halo: var(--halo-bad); }
.mentor:has(.m-text.expl) .spk-lamp { --lit: var(--sig-info); --off: var(--off-info); --hot: var(--hot-info); --halo: var(--halo-info); }
.mentor:has(.m-text.flash) .spk-lamp { animation: spkCall 2.6s linear 1; }
.mentor:has(.m-text.flash) .spk-lamp::after, .mentor:has(.m-text.flash) .spk-lamp::before { animation: spkCallHot 2.6s linear 1; }
@keyframes spkCall { 0%, 88% { background-color: var(--lit); } 94%, 100% { background-color: var(--off); } }
@keyframes spkCallHot { 0%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
.m-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .4rem; }
.m-name { align-self: flex-start; font-weight: 700; font-size: .95rem; letter-spacing: .045em; text-transform: uppercase; padding: .1rem .55rem .06rem;
  color: var(--engrave-ink); background: var(--tex-ivory), var(--iron-ivory); border-radius: 1px; box-shadow: inset 0 -2px 0 var(--iron-ivory-lo), 0 0 0 1px #0B0A09; }
/* лист с репликой; важность — цветной закладкой (и лампой вызова) */
.m-text { --tab: var(--paper-pencil); position: relative; color-scheme: light; flex: 1 1 auto; min-height: 0; overflow: auto; padding: .35rem .7rem .35rem .95rem;
  font-family: var(--f-text); font-size: 1.1rem; line-height: 1.36; color: var(--paper-ink);
  background: linear-gradient(90deg, var(--tab) 0 .42rem, transparent .42rem), var(--tex-paper), var(--paper-desk); border-radius: 1px;   /* лист на столе, не в руках: тише живых приборов и когда Палыч говорит */
  box-shadow: 0 2px 0 rgba(0,0,0,.4); }
.m-text.p2 { --tab: var(--paint-warn); } .m-text.p3 { --tab: var(--paint-bad); } .m-text.expl { --tab: var(--paint-info); }
.m-text.flash { animation: msgIn .4s ease-out; }
/* молчит — лист в тени (текст читается, контраст ≥ 4,5:1); заговорил — лампа вызова и лист выходит на свет (STYLE.md 2.2) */
.m-text::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: rgba(12,11,9,.12); opacity: 1; transition: opacity 1.2s var(--ease-paper); }
.mentor.talk .m-text::after { opacity: 0; transition-duration: 180ms; }
@keyframes msgIn { from { opacity: .15; transform: translateX(.5rem); } to { opacity: 1; transform: none; } }
.m-actions { display: flex; gap: .4rem; flex: 0 0 auto; padding: .14rem .14rem .2rem; }
/* кнопка селектора «ВЫЗОВ»: бакелит громкоговорящей связи, надпись — функция капсом, рядом лампа вызова */
#btn-what { display: inline-flex; align-items: center; gap: .5rem; font: 700 .98rem/1 var(--f-engrave); letter-spacing: .1em; text-transform: uppercase; }
#btn-what .lmp { width: .62rem; height: .62rem; }
.mentor.asked #btn-what .lmp { --lit: var(--sig-info); --off: var(--off-info); --hot: var(--hot-info); --halo: var(--halo-info); background-color: var(--lit); }
.mentor.asked #btn-what .lmp::after, .mentor.asked #btn-what .lmp::before { opacity: 1; }
/* ---------- самописцы: корпус в столешнице, бумажная лента за стеклом, бумажная памятка «на что смотреть» ---------- */
.charts { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: .55rem; min-height: 0; }
.chart { display: flex; flex-direction: column; gap: .24rem; min-height: 0; min-width: 0; padding: .32rem .42rem .4rem; border-radius: 3px;
  background: var(--tex-bakelite), var(--iron-bakelite);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.5), 0 0 0 1px #0B0A09, 0 3px 0 rgba(0,0,0,.35); }
.ch-h { font-weight: 700; font-size: .98rem; color: var(--engrave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 .15rem; }
.chart canvas, canvas.sched { flex: 1 1 auto; min-height: 0; width: 100%; display: block; background: var(--tex-paper), var(--paper-3); border-radius: 1px;   /* лента за стеклом, в полутени — тише живых приборов */
  box-shadow: inset 0 1px 3px rgba(31,29,26,.45), 0 0 0 .14rem var(--iron-alu-dark), 0 0 0 calc(.14rem + 1px) #0B0A09; }
canvas.sched.off { display: none; }
canvas.sched { flex: 1 1 2.6rem; margin: .14rem .14rem 0; width: calc(100% - .28rem); box-shadow: inset 0 1px 3px rgba(31,29,26,.45), 0 0 0 .14rem rgba(214,224,220,.45), 0 0 0 calc(.14rem + 1px) var(--iron-seam); }
.chart .ch-look { display: none; }   /* памятка «на что смотреть» — в подсказке при наведении и у Палыча, не на корпусе */
.ch-look { font-size: .84rem; line-height: 1.15; color: var(--paper-ink); padding: .18rem .36rem .16rem; background: var(--tex-paper), var(--paper-2); border-radius: 1px; }   /* памятка на корпусе самописца — тише реплики Палыча */

/* ---------- окна: журнал, бланк, запись в журнале. Под окнами — просто затемнение ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 1.2rem; background: rgba(13,15,13,.76); }
.overlay[hidden] { display: none; }
.modal { display: none; width: min(62rem, 100%); max-height: 100%; overflow: auto; padding: 1.4rem 1.8rem 1.5rem; border-radius: 2px; color-scheme: light;
  color: var(--paper-ink); background: var(--tex-paper), var(--paper); box-shadow: 0 1rem 2.4rem rgba(0,0,0,.6); }
.modal.show { display: block; animation: modalIn .25s ease-out; }
@keyframes modalIn { from { opacity: 0; transform: translateY(.8rem); } }
.modal h2 { margin: 0; font-size: 2.3rem; line-height: 1.05; }
.modal p { margin: .35rem 0; font-family: var(--f-text); font-size: 1.12rem; line-height: 1.42; max-width: 48rem; }

/* ЖУРНАЛ — переиспользуемые части: обложка .j-cover, наклейка .j-label, разлинованная страница .j-page,
   строка записи .j-row, штамп .stamp. В 2.0 из них соберутся часовой журнал смены и «Личное дело». */
.j-cover { color-scheme: dark; color: var(--engrave); border-radius: 3px 7px 7px 3px; padding-left: 2.6rem;
  background:
    linear-gradient(90deg, rgba(0,0,0,.35) 0 1.7rem, rgba(255,255,255,.06) 1.7rem 1.8rem, transparent 1.8rem),   /* корешок */
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.08) 0 1px, transparent 1px 4px),                                 /* ледерин */
    #2B3A33;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -3px 0 rgba(0,0,0,.4), 0 1rem 2.4rem rgba(0,0,0,.6); }
.j-label { width: fit-content; max-width: 100%; margin: 0 auto .2rem; padding: .7rem 1.6rem .6rem; text-align: center; color: var(--paper-ink);
  background: linear-gradient(var(--paper-stamp), var(--paper-stamp)) 0 .45rem / 100% .16rem no-repeat,
              linear-gradient(var(--paper-stamp), var(--paper-stamp)) 0 calc(100% - .45rem) / 100% .16rem no-repeat,
              var(--tex-paper), var(--paper);
  border-radius: 1px; box-shadow: 0 2px 0 rgba(0,0,0,.4); }
.j-page { --line: 2.3rem; color-scheme: light; color: var(--paper-ink); border-radius: 1px; box-shadow: 0 2px 0 rgba(0,0,0,.4);
  background:
    linear-gradient(90deg, transparent 0 3.1rem, var(--paper-margin) 3.1rem calc(3.1rem + 1px), transparent calc(3.1rem + 1px)),   /* поля */
    repeating-linear-gradient(180deg, transparent 0 calc(var(--line) - 1px), var(--paper-rule) calc(var(--line) - 1px) var(--line)),  /* линовка */
    var(--tex-paper), var(--paper); }
.j-row { box-shadow: inset 0 -1px 0 var(--paper-rule); }
.stamp, .mr-head.ok::after {
  display: inline-block; padding: .12rem .7rem .06rem; font: 700 1.5rem/1.1 var(--f-plate); letter-spacing: .14em; text-transform: uppercase;
  color: var(--paper-stamp); border: .2rem solid var(--paper-stamp); border-radius: .25rem; opacity: .88; transform: rotate(-7deg); }

/* меню — обложка оперативного журнала, уровни — строки графика смен */
#m-menu .menu-title { margin: 0; font-weight: 700; font-size: 4.4rem; line-height: .95; letter-spacing: .05em; text-transform: uppercase; }
#m-menu .menu-sub { margin: .45rem auto 0; color: var(--paper-ink); font-size: 1.12rem; max-width: 46rem; }
.lvl-grid { display: grid; grid-template-columns: 1fr; gap: 0; margin: 1rem 0 .9rem; padding: 0 1.2rem 0 0; }
.lvl { display: grid; grid-template-columns: 3.1rem minmax(0, 1fr) auto; column-gap: .75rem; align-items: center; height: var(--line); text-align: left;
  padding: 0 .2rem 0 0; cursor: pointer; border: 0; background: transparent; color: var(--paper-ink); }
.lvl:hover:not(:disabled) { background: rgba(47,58,143,.08); }
.lvl:active:not(:disabled) { background: rgba(47,58,143,.14); }
.lvl:disabled { cursor: default; color: var(--paper-pencil); }
.lv-n { justify-self: end; padding-right: .6rem; font: 400 1.2rem/1 var(--f-type); color: var(--paper-ink); }
.lv-n svg { display: none; }
.lv-n::before { content: attr(data-n); }
.lvl:disabled .lv-n { color: var(--paper-pencil); }
.lv-t { font-weight: 700; font-size: 1.2rem; }
.lv-s { font-size: 1.05rem; color: var(--paper-pen); letter-spacing: .12em; }   /* звёзды проставлены шариковой ручкой */
.lv-s i { font-style: normal; color: #A8A190; }
.lv-s.txt { letter-spacing: 0; color: var(--paper-pencil); font-size: .98rem; }
.lvl.hard { box-shadow: inset .3rem 0 0 var(--paper-stamp), inset 0 -1px 0 var(--paper-rule); }
.lvl:focus-visible { outline: .14rem solid var(--paper-pen); outline-offset: -.14rem; box-shadow: none; }
.lvl.hard .lv-t { color: var(--paper-stamp); }
.menu-foot { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; color: var(--engrave-dim); font-size: 1rem; }

/* брифинг — машинописный бланк «Задание на смену» */
.form::before { content: "Задание на смену"; display: block; margin: -.2rem 0 .8rem; padding: .3rem 0 .26rem; text-align: center;
  font: 700 1.1rem/1 var(--f-plate); letter-spacing: .22em; text-transform: uppercase; color: var(--paper-ink);
  border-top: 2px solid var(--paper-ink); border-bottom: 1px solid var(--paper-ink); }
.mb-num { color: var(--paper-pencil); font: 400 1.1rem/1.2 var(--f-type); }
.form h2 { font: 400 2.3rem/1.1 var(--f-type); padding-bottom: .2rem; border-bottom: 1px dashed var(--paper-pencil); width: fit-content; max-width: 100%; }
.mb-lines { margin: .7rem 0; }
.mb-goal { display: flex; gap: .8rem; align-items: baseline; padding: .55rem .9rem; margin: .5rem 0; border: 1px solid var(--paper-ink); border-radius: 1px; font-size: 1.22rem; font-weight: 700; }
.mb-goal b { color: var(--paper-ink); }
.mb-goal span { color: var(--paper-pencil); font-weight: 400; }
.mb-new { display: inline-block; color: var(--paper-stamp); font-weight: 700; font-size: 1.12rem; margin: .5rem 0; padding: .1rem .5rem; border: .14rem solid var(--paper-stamp); border-radius: .2rem; transform: rotate(-.6deg); }
/* кнопки окон — на тёмной планке пульта под листом */
.mb-actions, .mr-actions { display: flex; gap: .7rem; flex-wrap: wrap; margin: 1.1rem -1.8rem -1.5rem; padding: .8rem 1.8rem .9rem;
  background: var(--tex-bakelite), var(--iron-bakelite); box-shadow: inset 0 2px 0 rgba(0,0,0,.45); }
.j-cover .menu-foot .btn { font-size: .98rem; }

/* итоги — запись в журнале с вклеенной лентой самописца; при успехе — штамп «ЗАЧТЕНО» */
#m-result.j-page { padding-left: 4rem; }
#m-result .mr-actions { margin-left: -4rem; padding-left: 4rem; }
.mr-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.mr-head h2 { font: 400 2.5rem/1.05 var(--f-hand); color: var(--paper-pen); }
.mr-head.bad h2 { color: var(--paper-stamp); }
.mr-head.ok::after { content: "Зачтено"; position: absolute; right: 13.5rem; top: -.2rem; pointer-events: none; }
.stars { display: flex; gap: 1rem; }
.star { display: flex; flex-direction: column; align-items: center; gap: .15rem; font-weight: 700; font-size: .92rem; color: var(--paper-pencil); }
.star svg { width: 2.6rem; height: 2.6rem; }
.star polygon { fill: none; stroke: #A8A190; stroke-width: 1.4; stroke-dasharray: 2 1.6; }
.star.on { color: var(--paper-ink); }
.star.on polygon { fill: var(--paper-pen); stroke: var(--paper-pen); stroke-width: 1.2; stroke-dasharray: none; }
.mr-chart { position: relative; margin: .9rem .2rem .4rem 0; padding: .55rem .7rem .5rem; background: var(--tex-paper), #F3ECD9; border-radius: 1px;
  box-shadow: 0 0 0 1px rgba(31,29,26,.18), 0 2px 3px rgba(31,29,26,.25); transform: rotate(-.35deg); }
.mr-chart::before, .mr-chart::after { content: ""; position: absolute; top: -.5rem; width: 4.2rem; height: 1.1rem; background: rgba(216,199,140,.72); box-shadow: 0 0 0 1px rgba(150,130,80,.25); }
.mr-chart::before { left: 1.4rem; transform: rotate(-4deg); } .mr-chart::after { right: 1.6rem; transform: rotate(3deg); }   /* полоски клейкой ленты */
.mrc-h { font-weight: 700; font-size: 1.05rem; margin-bottom: .3rem; color: var(--paper-ink); }
.mr-chart canvas { width: 100%; height: 14rem; display: block; background: transparent; }
.mr-chart .ch-look { margin-top: .35rem; font-size: .95rem; padding: 0; background: none; color: var(--paper-pencil); }
.mrc-legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; font-size: .92rem; color: var(--paper-ink); margin-top: .35rem; }
.mrc-legend i { font-style: normal; font-weight: 700; }
.mrc-legend .lg-dem { color: var(--paper); -webkit-text-stroke: .06rem var(--paper-ink); }
.mrc-legend .lg-band { color: var(--paint-ok); }

/* ---------- подсказка — карточка-памятка на плотной бумаге ---------- */
#tooltip { position: fixed; z-index: 60; left: 0; top: 0; max-width: 19rem; padding: .62rem .8rem .58rem; border-radius: 1px; pointer-events: none; opacity: 0; transform: translateY(.2rem);
  transition: opacity .12s, transform .12s; font-family: var(--f-text); font-size: .98rem; line-height: 1.3; color: var(--paper-ink);
  background: linear-gradient(var(--paper-stamp), var(--paper-stamp)) 0 .3rem / 100% .12rem no-repeat, var(--tex-card), #F2E9D2;
  box-shadow: 0 .35rem .8rem rgba(0,0,0,.5); }
#tooltip.show { opacity: 1; transform: none; }
#tooltip b { display: block; font-family: var(--f-plate); font-size: 1.06rem; margin: .15rem 0 .15rem; }
/* клавиши — слой игры: живут в подсказке, а не на корпусе органа (STYLE.md, 2.12) */
#tooltip .tip-keys { display: flex; align-items: center; gap: .3rem; margin-top: .45rem; font-size: .9rem; color: var(--paper-pencil); }

/* =====================================================================
   ФАКТУРА: аналоговая аппаратура (ориентир — HighFleet). У каждой детали — толщина, фаска, тень,
   материал и следы работы. Плитки материалов и износ панелей рисует модуль Tex (canvas, один раз,
   под размер панели, статично); переменные --tex-* в :root — запасной вариант без canvas.
   ===================================================================== */
@property --wear { syntax: '*'; inherits: false; }
/* цвета колпачка зарегистрированы как цвета — тогда наведение плавно переливает фаску, а не щёлкает */
@property --cap { syntax: '<color>'; inherits: true; initial-value: #30322C; }
@property --cap-hi { syntax: '<color>'; inherits: true; initial-value: #5B5E54; }
body { background: var(--tex-enamel), var(--iron-frame); }
/* панель — лист крашеной стали на винтах: фаска, сколы по кромкам, грязь в углах (рисует Tex) */
.blk { background: var(--wear, none) 0 0 / 100% 100% no-repeat, var(--tex-enamel), var(--iron-enamel);
  box-shadow: 0 0 0 1px #0C0F0D, 0 .12rem 0 1px rgba(0,0,0,.5); }   /* лист сидит в раме: чёткий стык, а не парение */
#b-dg { background: var(--wear, none) 0 0 / 100% 100% no-repeat, var(--tex-enamel), var(--iron-enamel-new); }
.blk::before { right: .22rem; top: .78rem; writing-mode: vertical-rl; letter-spacing: .1em; }   /* номер панели — по кромке, под верхним винтом */
#b-mimic::before { writing-mode: horizontal-tb; right: 1.05rem; top: auto; bottom: .17rem; letter-spacing: .06em; }
.cover { background: var(--wear, none) 0 0 / 100% 100% no-repeat, var(--tex-enamel), var(--iron-enamel-plug);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.45), inset 0 .25rem .6rem rgba(0,0,0,.35); }   /* глухая крышка тёмная и матовая — закрытое отступает */
.cover span { font-size: .86rem; padding: .56rem .6rem .2rem; box-shadow: 0 1px 0 rgba(0,0,0,.4); }
.cover svg { opacity: .7; }
#topbar { padding: 0 1rem; border-radius: 2px; background: var(--wear, none) 0 0 / 100% 100% no-repeat, var(--tex-enamel), #3B4A42; box-shadow: 0 0 0 1px #0C0F0D, 0 .12rem 0 1px rgba(0,0,0,.5); }
/* таблички: пластик слоновой кости с толщиной и грязью по кромке; буквы гравированы */
.brand, .p-name, .m-name { text-shadow: 0 1px 0 rgba(255,253,244,.6); }
.brand { box-shadow: inset 0 -2px 0 var(--iron-ivory-lo), inset 0 0 .5rem rgba(110,84,44,.32), 0 0 0 1px #0C0F0D, 0 .16rem .2rem rgba(0,0,0,.55); }
.p-name, .m-name { box-shadow: inset 0 -1px 0 var(--iron-ivory-lo), inset 0 0 .3rem rgba(110,84,44,.28), 0 0 0 1px rgba(26,22,18,.7), 0 .1rem .12rem rgba(0,0,0,.45); }

/* часы — механический счётчик: светлые цифры на чёрных барабанах в утопленном окне */
.clock { font: 400 1.35rem/1 var(--f-type); letter-spacing: 0; min-width: 0; text-align: left; padding: .34rem 0 .3rem; color: #ECE5D0;
  border-left: .32rem solid #0B0A09; border-right: .32rem solid #0B0A09; border-radius: 2px;
  background:
    linear-gradient(180deg, rgba(0,0,0,.8) 0, rgba(0,0,0,0) 32%, rgba(255,255,255,.07) 50%, rgba(0,0,0,0) 68%, rgba(0,0,0,.8) 100%),
    repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 calc(1ch - 2px), #050404 calc(1ch - 2px) 1ch), #1A1916;
  box-shadow: inset 0 .12rem .25rem rgba(0,0,0,.9), 0 0 0 1px #0B0A09, 0 0 0 .2rem #5A5E58, 0 0 0 calc(.2rem + 1px) #0B0A09, 0 .1rem .14rem .2rem rgba(0,0,0,.45); }

/* лампы: цветная линза с френелевыми кольцами в металлическом ободке */
.lmp { box-shadow: inset 0 -1px 2px rgba(0,0,0,.5), 0 0 0 .06rem #12100E, 0 0 0 .17rem #9EA29A, 0 0 0 .21rem #2C2E2A, 0 .08rem .12rem .21rem rgba(0,0,0,.5);
  background-image: radial-gradient(circle at 34% 28%, rgba(255,255,255,.55) 0 8%, rgba(255,255,255,0) 22%),
    repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 .035rem, rgba(255,255,255,0) .035rem .09rem),
    radial-gradient(circle at 50% 55%, rgba(0,0,0,0) 45%, rgba(0,0,0,.42) 100%); }

/* табло: окна молочного стекла в глубоких ячейках бакелитового корпуса */
#annunciator { gap: .26rem; background: var(--tex-bakelite), #121410; box-shadow: inset 0 .2rem .4rem rgba(0,0,0,.9), 0 0 0 1px #0B0A09, 0 .12rem 0 1px rgba(0,0,0,.5); }
.ann { background: linear-gradient(180deg, rgba(255,255,255,var(--sh)) 0, rgba(255,255,255,0) 28%, rgba(0,0,0,0) 70%, rgba(0,0,0,.14) 100%), var(--tex-enamel), var(--ann-off);
  box-shadow: inset 0 .12rem .22rem rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.1), 0 0 0 1px #070605; }

/* цифровые индикаторы: утопленное окно с фаской (верх в тени, низ на свету), стекло с бликом */
.read { border: .14rem solid; border-color: #3C3F3B #6A6E67 #9EA29A #5A5E58; padding: .11rem .41rem;
  background: radial-gradient(150% 130% at 12% -25%, rgba(255,255,255,.08), rgba(255,255,255,0) 55%), var(--iron-well);
  box-shadow: inset 0 .2rem .45rem rgba(0,0,0,.95), 0 0 0 1px #0B0A09, 0 .12rem .16rem rgba(0,0,0,.45); }
#b-rods .read.sm { padding: .06rem .31rem; }
.read::after { border-radius: 1px; }

/* шкалы: прибор в бакелитовом корпусе, поле под стеклом с бликом */
.scale { box-shadow: inset 0 .16rem .32rem rgba(31,29,26,.6), 0 0 0 1px #0B0A09, 0 0 0 .2rem #191B17, 0 0 0 calc(.2rem + 1px) #0B0A09, 0 .12rem .16rem .2rem rgba(0,0,0,.4); }
.scale::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(174deg, rgba(255,255,255,.3) 0, rgba(255,255,255,.08) 36%, rgba(255,255,255,0) 38%), linear-gradient(0deg, rgba(70,50,20,.15), rgba(70,50,20,0) 50%); }

/* тумблеры: хромированный рычаг на шестигранной гайке, бакелитовое основание на двух винтах */
.tog { background:
    linear-gradient(var(--ta, 30deg), transparent 36%, #12100E 36% 56%, rgba(255,255,255,.4) 56% 64%, transparent 64%) 50% .39rem / .24rem .24rem no-repeat,
    var(--th) 50% .3rem / .42rem .42rem no-repeat,
    linear-gradient(var(--tb, -40deg), transparent 36%, #12100E 36% 56%, rgba(255,255,255,.4) 56% 64%, transparent 64%) 50% calc(100% - .39rem) / .24rem .24rem no-repeat,
    var(--th) 50% calc(100% - .3rem) / .42rem .42rem no-repeat,
    radial-gradient(130% 70% at 50% 0%, rgba(255,250,236,.1), rgba(255,250,236,0) 60%), var(--tex-bakelite), var(--iron-bakelite);
  box-shadow: inset 0 1px 0 rgba(255,250,236,.18), inset 0 -.14rem .2rem rgba(0,0,0,.5), 0 0 0 1px #0B0A09, 0 .18rem .28rem rgba(0,0,0,.6); }
.tog::before { content: ""; position: absolute; left: 50%; top: 50%; width: 1.02rem; height: 1.02rem; margin: -.51rem 0 0 -.51rem; pointer-events: none;
  clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0 50%);
  background: radial-gradient(circle, #2A2C28 0 .2rem, rgba(0,0,0,0) .21rem), conic-gradient(from 30deg, #DCDED6 0 60deg, #A8ACA4 60deg 120deg, #6F736C 120deg 180deg, #4C504A 180deg 240deg, #7E827B 240deg 300deg, #C2C5BD 300deg 360deg); }
.tog .lever { z-index: 1; width: .36rem; left: calc(50% - .18rem); background: linear-gradient(90deg, #4C504A 0, #9EA29A 18%, #F2F3ED 36%, #C9CCC4 52%, #7E827B 76%, #3E423C 100%); box-shadow: .14rem .16rem .12rem rgba(0,0,0,.5); }
.tog .lever::after { background: radial-gradient(circle at 34% 28%, #F7F8F2 0, #D2D5CD 22%, #8E928A 62%, #464A44 100%); box-shadow: .12rem .14rem .14rem rgba(0,0,0,.55); }

/* АЗ: штриховка с той же фактурой, хромированная манжета вокруг грибка */
.az-wrap { background: radial-gradient(circle, #121410 0 2.46rem, transparent calc(2.46rem + 1px)), var(--tex-enamel), repeating-linear-gradient(-45deg, var(--iron-hazard) 0 .42rem, var(--iron-bakelite) .42rem .84rem); }
.az-wrap::before { content: ""; position: absolute; inset: .38rem; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 40% 28%, #EEF0E9 0, #A8ACA4 42%, #4E524C 82%, #2A2C28 100%);
  box-shadow: inset 0 0 0 .1rem rgba(0,0,0,.4), 0 .12rem .22rem rgba(0,0,0,.65); }
.az-btn { border: 0; background: radial-gradient(circle at 36% 26%, rgba(255,232,222,.62) 0 7%, rgba(255,232,222,0) 21%), radial-gradient(circle at 40% 32%, #CC3E30 0, #A9241A 42%, #82150E 78%, #5A0D07 100%);   /* краска, не свет: глубокий красный, тише горящего табло */
  box-shadow: 0 0 0 .08rem #2A0806, 0 .28rem 0 .08rem #4A0E09, 0 .4rem .45rem .08rem rgba(0,0,0,.55), inset 0 -.2rem .35rem rgba(0,0,0,.35); text-shadow: 0 -1px 0 rgba(0,0,0,.5); }
.az-btn:active, .az-btn.fired { box-shadow: 0 0 0 .08rem #2A0806, 0 .05rem 0 .08rem #4A0E09, 0 .1rem .16rem .08rem rgba(0,0,0,.55), inset 0 -.12rem .25rem rgba(0,0,0,.4); }


/* корпуса самописцев и громкоговорителя — бакелит с фаской */
.chart, .mentor { box-shadow: inset 0 1px 0 rgba(255,250,236,.14), inset 0 -2px 0 rgba(0,0,0,.55), 0 0 0 1px #0B0A09, 0 .14rem 0 rgba(0,0,0,.45); }
