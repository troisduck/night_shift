] };

/* ---------- ход игры ---------- */
// где вместо заглушки — пустое гнездо (монтажная ниша со жгутом); смешиваем по месту
const NICHE_GROUPS = new Set(['xenon', 'dg']);
const DUTY_EL = { power: 'b-power', powerMax: 'b-power', mwe: 'b-grid', cool: 'b-temp' };   // прибор цели по величине задания
// o.hall — вошли в зал из графика смен или после подписи: сначала свет рядами, потом задание
function startLevel(idx, quick, o = {}) {
  hideTip(); Guide.stop(true); Reveal.finish();
  const g = UI.game = new Game(idx);
  Object.assign(UI, { mode: 'brief', running: false, paused: false, resultShown: false, endT: 0, acc: 0, chartT: 0,
    prevScram: g.s.scram, prevRed: 0, prevEv: 0, prevWarn: 0, msgId: 0, winLit: -1, guideHold: false, goalN: -1, goalOk: null });
  releaseKeys(); closeAZ();
  document.querySelectorAll('.btn.pressed').forEach(b => b.classList.remove('pressed'));
  $('app').classList.remove('menu-mode', 'paused');
  UI.quick = !!quick;
  applyLocks(g, !quick && idx > 0);          // смена 1: приборы уже стоят — зал просыпается вместе с ними
  // свет следует за задачей: прибор текущей цели — с «дежурной» подсветкой шкалы чуть ярче остальных (STYLE.md 2.2)
  document.querySelectorAll('.blk.duty').forEach(b => b.classList.remove('duty'));

  const mt = $('m-text'); mt.textContent = ''; mt.className = 'm-text';

  if (quick) beginPlay();

}
// первый раз на смене (ещё не сдана): раскрытие новых приборов целиком и показ фокус-светом; повторно — коротко
function beginPlay(force) {
  const g = UI.game; hideModal();
  Object.assign(UI, { mode: 'play', running: true, paused: false, holdUntil: performance.now() + 700, last: 0 });
  const first = force || (!UI.quick && !Save.stars(g.idx)), steps = first ? GUIDE[g.level.id] : null;
  const list = [...document.querySelectorAll('.blk.unlocking')];
  g.say(g.level.mentor.intro, 1);
  if (list.length && first) Reveal.run(list, () => Guide.start(steps || [{ el: '#' + list[list.length - 1].id, text: `Сегодня ввели в работу: ${g.level.unlock.map(k => GROUP_NAMES[k]).join(', ')}.`, hold: true }]));
  else { revealNew(); if (steps) Guide.start(steps); }
  updatePauseUI();
}

function renderAll(g, dtG, now = performance.now()) {
  renderDesk(g); renderLamps(g); renderMimic(g, dtG); renderTop(g); renderMentor(g);
  if ((dtG > 0 && now - UI.chartT > 120) || UI.chartsDirty) {
    UI.chartT = now; UI.chartsDirty = false;
    for (const k of g.level.charts) drawTrend(k, g);
    drawSched(g);
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dtR = UI.last ? Math.min(0.1, Math.max(0, (now - UI.last) / 1000)) : 0; UI.last = now;
  const g = UI.game; if (!g) return;
  let n = 0;
  if (UI.mode === 'play' && UI.running && !UI.paused && !UI.guideHold && now >= (UI.holdUntil || 0)) {
    UI.acc += dtR * UI.speed;
    while (UI.acc >= CONFIG.dt && n < 400) { g.update(CONFIG.dt); UI.acc -= CONFIG.dt; n++; }
    if (n >= 400) UI.acc = 0;
    if (g.done) {
      if (!UI.endT) UI.endT = now;
      else if (!UI.resultShown && now - UI.endT > 1700) { UI.resultShown = true; showResult(g); }
    }
  }
  try { renderAll(g, n * CONFIG.dt, now); if (UI.annFit) { UI.annFit = false; fitAllAnn(); } } catch (err) { console.error(err); }
  if (Guide.cur && Guide.cur.expl && alarmFresh(g)) Guide.stop(true);   // новая тревога перебивает объяснение
  try { Win.update(g, now); } catch (err) { console.error(err); }
  Snd.update(g, n * CONFIG.dt, now);         // звук — после физики и отрисовки; ошибки звука игру не ломают
}

function init() {
  Save.load(); Snd.on = Save.data.sound !== false;
  const remPx = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 14;
  UI.remPx = remPx();
  buildDesk(); bindControls(); Tex.init();
  UI.game = new Game(0); applyLocks(UI.game, false); buildCharts(UI.game.level.charts);
  renderAll(UI.game, 0);
  updateSoundUI(); updatePauseUI();
  if (!debugWanted()) Entry.start();
  const onResize = () => { UI.remPx = remPx(); UI.chartsDirty = true; UI.annFit = true; Scenes.resize(); Guide.resize(); Win.resize(); if (UI.modal === 'm-result' && UI.game && UI.game.result) drawRun($('mr-canvas'), UI.game); };
  window.addEventListener('resize', onResize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { onResize(); Tex.refreshAll(); }).catch(() => {});
  document.addEventListener('visibilitychange', () => { if (document.hidden && UI.mode === 'play' && !UI.paused) togglePause(); });
  document.addEventListener('pointerup', () => { const a = document.activeElement; if (a && a.tagName === 'BUTTON' && !UI.modal) setTimeout(() => a.blur(), 0); });
  requestAnimationFrame(frame);
  debugStart();
  Snd.boot();
}

/* ---------- отладочные параметры адреса: для самопроверки и тестов ----------
   ?level=N — сразу в уровень N без меню; ?unlockall=1 — открыть все панели;
   ?event=pump_trip | blackout | alarm_test — вызвать событие (alarm_test зажигает все окна табло и ставит паузу);
   ?paused=1 — заморозить симуляцию после подготовки. Без параметров игра ведёт себя как обычно. */
// любой отладочный параметр — без заставок и двери (самопроверка, снимки, раскадровки)
function debugWanted() { try { const q = new URLSearchParams(location.search); return ['level', 'event', 'unlockall', 'screen', 'moment', 'paused'].some(k => q.has(k)); } catch (e) { return false; } }
function debugStart() {
  let q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
  // ?screen=splash|door|intro|sign|shifts|settings|result — сразу на экран входа или итогов
  // ?moment=hall — свет рядами (полностью); unlock — раскрытие приборов смены 2; guide — показ смены 1
  // ?dim=0.45…0.85 — сила затенения фокус-света для пробы на глаз (FEEL.focus.dim)
  const dim = parseFloat(q.get('dim')); if (dim >= 0 && dim <= 1) FEEL.focus.dim = dim;
  const mom = q.get('moment');
  if (mom === 'hall') { Save.data.hallSeen = false; startLevel(0, false, { hall: true }); return; }
  if (mom === 'unlock') { startLevel(1, false); beginPlay(true); return; }
  if (mom === 'guide') { startLevel(0, false); beginPlay(true); return; }
  const scr = q.get('screen');
  if (scr) {
    if (scr === 'result') { startLevel(Math.max(0, (parseInt(q.get('level'), 10) || 1) - 1), true); const g = UI.game; g.finish(q.get('fail') !== '1'); if (q.get('fail') === '1') { g.result.success = false; } showResult(g); }
    else if (SCENES[scr]) Scenes.go(scr, { debug: true });
    return;
  }
  const lv = parseInt(q.get('level'), 10), ev = q.get('event'), all = q.get('unlockall') === '1';
  if (!lv && !ev && !all) return;
  startLevel(lv >= 1 && lv <= LEVELS.length ? lv - 1 : 0, true);
  const g = UI.game;
  if (all) { g.open = new Set(ALL_GROUPS); applyLocks(g, false); }
  if (ev === 'pump_trip' || ev === 'blackout') {
    g.events.push(ev === 'blackout' ? { t: g.t, type: 'blackout' } : { t: g.t, type: 'pumpTrip', pump: 1 });
    for (let i = 0; i < 20; i++) g.update(CONFIG.dt);
  } else if (ev === 'alarm_test') {
    g.update(CONFIG.dt);
    LAMPS.forEach((L, i) => { g.lamps[L.id] = L.kind === 'info' ? 3 : L.kind === 'soft' ? 1 : L.kind === 'event' ? 2 : (i % 2 ? 1 : 2); });
  }
  if (q.get('paused') === '1' || ev === 'alarm_test') { UI.paused = true; updatePauseUI(); }
  renderAll(g, 0);
}
init();

</script>
