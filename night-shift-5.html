/* =====================================================================
   ФИЗИКА. step(s, dt) — только расчёт, без отрисовки.
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function interp(tab, x) {
  if (x <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) {
    if (x <= tab[i][0]) { const a = tab[i - 1], b = tab[i]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); }
  }
  return tab[tab.length - 1][1];
}
// Температура кипения воды от давления (МПа → °C) и обратно
const TSAT = [[1, 179.9], [3, 233.9], [5, 263.9], [6, 275.6], [7, 285.8], [8, 295.0], [10, 311.0], [12, 324.7],
  [13, 330.9], [14, 336.7], [15, 342.2], [16, 347.4], [17, 352.3], [18, 357.0], [20, 365.8], [22, 373.7]];
const PSAT = TSAT.map(([p, t]) => [t, p]);
const tsat = p => interp(TSAT, p);
const psat = t => interp(PSAT, t);

// Реактивность банка стержней: S-кривая, h — глубина погружения 0..100%
function rodRho(h) { const x = clamp(h / 100, 0, 1), a = CONFIG.rods.sBlend; return -CONFIG.rods.worth * (a * x + (1 - a) * (x - Math.sin(2 * Math.PI * x) / (2 * Math.PI))); }
function xenonEq(P) { const b = CONFIG.xenon.burn; return (1 + b) * P / (1 + b * P); }

function baseState() {
  return {
    t: 0, P: 0.01, D: [0, 0, 0], Pth: 0.01, decayHeat: 0,
    T: 280, Ts: 280, p: CONFIG.pressure.nominal, pSet: CONFIG.pressure.nominal, W: 1,
    Tin: 280, Tout: 280, margin: 60, dT: 0,
    h: 60, sr: 0, scram: false, scramReason: null, scramT: null, backup: false,
    pumps: [0, 1, 2, 3].map(() => ({ on: true, speed: 1, tripped: false, powered: true })),
    flow: 1, nRun: 4, allow: 1, overT: 0,
    v: 0, vSet: 0, turbineTrip: false, turbineOnline: true,
    cB: 6.5, cBset: 6.5, xi: 1, xx: 1,
    offsite: true, dg: 'off', dgT: 0,
    heater: false, spray: false, heaterOn: false, sprayOn: false, relief: false,
    mwe: 0, Qturb: 0, Qdump: 0, Qsg: 0,
    rho: 0, rhoCore: 0, parts: {}, doubling: Infinity,
    dmg: 0, dmgWhy: null, damaged: false,
    inp: { rodDir: 0, rodPulse: 0, pumpOrder: [0, 1, 2, 3] },
    flags: { xenon: false, autoPressure: false, automation: true },
  };
}

function reactivityParts(s) {
  const fb = CONFIG.feedback, p = s.parts;
  p.rods = rodRho(s.h);
  p.scram = -CONFIG.scram.worth * s.sr;
  p.boron = -CONFIG.boron.worth * s.cB;
  p.temp = fb.kT * (s.T - fb.Tref);
  p.power = fb.kP * Math.min(s.P, 2);
  p.xenon = -CONFIG.xenon.worth * s.xx;
  return p.rods + p.scram + p.boron + p.temp + p.power + p.xenon;
}

function doScram(s, reason) {
  if (s.scram) return;
  s.scram = true; s.scramReason = reason; s.scramT = s.t; s.turbineTrip = true;
}

function step(s, dt, frozen) {
  const C = CONFIG, pr = C.primary, sc = C.secondary, pc = C.pressure;
  s.t += dt;
  const powered = s.offsite || s.dg === 'on';

  // Дизель-генераторы
  if (s.dg === 'starting') { s.dgT += dt; if (s.dgT >= C.dg.startTime) s.dg = 'on'; }

  // Стержни
  if (!frozen) {
    if (s.scram) {
      s.h = Math.min(100, s.h + C.rods.scramSpeed * dt);
      s.sr = Math.min(1, s.sr + dt / C.scram.time);
    } else {
      const dir = s.inp.rodDir || Math.sign(s.inp.rodPulse);
      if (dir) {
        const dh = C.rods.speed * dt;
        s.h = clamp(s.h - dir * dh, 0, 100);          // «вверх» уменьшает погружение
        if (s.inp.rodPulse) {
          const rem = Math.abs(s.inp.rodPulse) - dh;
          s.inp.rodPulse = rem > 0 ? Math.sign(s.inp.rodPulse) * rem : 0;
        }
      }
    }
  }

  // Насосы (от дизелей работают не больше двух — в порядке включения)
  const dgSet = new Set(s.inp.pumpOrder.filter(i => s.pumps[i].on && !s.pumps[i].tripped).slice(0, C.dg.maxPumps));
  let flowSum = 0, nRun = 0;
  s.pumps.forEach((pm, i) => {
    pm.powered = s.offsite || (s.dg === 'on' && dgSet.has(i));
    const run = pm.on && !pm.tripped && pm.powered;
    if (frozen) pm.speed = run ? 1 : 0;
    else if (run) pm.speed = Math.min(1, pm.speed + dt / C.pumps.spinUp);
    else { pm.speed *= Math.exp(-dt / C.pumps.coast); if (pm.speed < 0.005) pm.speed = 0; }
    flowSum += pm.speed; if (run && pm.speed > 0.9) nRun++;
  });
  s.flow = flowSum / 4; s.nRun = nRun;
  const fe = Math.max(s.flow, pr.natCirc);
  s.allow = nRun > 0 ? Math.min(1, nRun * C.pumps.perPump) : pr.natCirc;

  // Клапан турбины
  s.turbineOnline = s.offsite && !s.turbineTrip;
  const vTarget = s.turbineOnline ? s.vSet : 0;
  const vr = (s.turbineOnline ? C.turbine.rate : 40) * dt;
  if (!frozen) s.v += clamp(vTarget - s.v, -vr, vr);

  // Борная кислота: «факт» догоняет «задание» с ограниченной скоростью
  const br = C.boron.rate * dt;
  if (!frozen) s.cB += clamp(s.cBset - s.cB, -br, br);

  // Реактивность и кинетика
  s.rho = s.rhoCore + reactivityParts(s);
  if (!frozen) {
    s.P = s.P * Math.exp(s.rho / C.kinetics.K * dt) + C.kinetics.source * dt;
    s.P = clamp(s.P, C.kinetics.minP, 5);
  }
  // Остаточное тепловыделение
  const dc = C.decay; let Dsum = 0, Asum = 0;
  for (let i = 0; i < 3; i++) {
    const eq = dc.frac[i] * s.P;
    if (!frozen) s.D[i] = eq + (s.D[i] - eq) * Math.exp(-dt / dc.tau[i]);
    Dsum += s.D[i]; Asum += dc.frac[i];
  }
  s.Pth = s.P * (1 - Asum) + Dsum;
  s.decayHeat = Dsum;

  // Ксенон (йодная яма)
  if (s.flags.xenon && !frozen) {
    const xe = C.xenon, Pp = Math.min(s.P, 1.5);
    s.xi += xe.lambdaI * (Pp - s.xi) * dt;
    s.xx += xe.lambdaX * ((1 + xe.burn) * (xe.direct * Pp + (1 - xe.direct) * s.xi) - s.xx * (1 + xe.burn * Pp)) * dt;
  }

  // Теплофизика: реактор → парогенератор → турбина / сброс пара
  const Q = s.Pth * C.plant.thermalMW;
  const phi = Math.pow(fe, pr.flowExp);
  const sgf = clamp(s.W / 0.4, 0, 1);
  s.Qsg = pr.UA * phi * sgf * (s.T - s.Ts);
  const dT = (Q - s.Qsg) / pr.C * dt;
  s.T += dT; s.dT = dT;
  s.Qturb = s.turbineOnline ? (s.v / 100) * C.plant.thermalMW * sc.valveMax * Math.pow(psat(s.Ts) / psat(sc.Tnom), sc.steamExp) : 0;
  const dumpSet = s.offsite ? sc.dumpSet : sc.atmSet;
  s.Qdump = clamp(sc.dumpGain * (s.Ts - dumpSet), 0, sc.dumpMax * C.plant.thermalMW);
  s.Ts += (s.Qsg - s.Qturb - s.Qdump) / sc.C * dt;
  // Вода в парогенераторах: без питания (нет сети и дизелей) — выкипает
  if (powered) s.W = Math.min(1, s.W + sc.feedRefill * dt);
  else if (!frozen) s.W = Math.max(0, s.W - Math.max(0, s.Qsg) / C.plant.thermalMW / sc.sgTau * dt);
  const dTc = Math.min(160, pr.dTcore * s.Pth / fe);
  s.Tout = s.T + dTc / 2; s.Tin = s.T - dTc / 2;

  // Давление: следует за температурой; нагрев и впрыск
  let dp = pc.kappa * dT;
  const canHeat = powered, canSpray = s.flow > 0.2;
  if (s.flags.autoPressure || frozen) {
    const want = pc.autoGain * (s.pSet - s.p) * (frozen ? 20 : 1);
    dp += clamp(want, canSpray ? -pc.spray * (frozen ? 50 : 1) : 0, canHeat ? pc.heater * (frozen ? 50 : 1) : 0) * dt;
    s.heaterOn = want > 0.004 && canHeat; s.sprayOn = want < -0.004 && canSpray;
  } else {
    if (s.heater && canHeat) dp += pc.heater * dt;
    if (s.spray && canSpray) dp -= pc.spray * dt;
    s.heaterOn = s.heater && canHeat; s.sprayOn = s.spray && canSpray;
  }
  s.p += dp;
  s.relief = s.p > pc.relief;
  if (s.relief) s.p -= (s.p - pc.relief) * 3 * dt;
  s.margin = tsat(s.p) - s.Tout;

  // Генератор
  s.mwe += (s.Qturb * C.plant.efficiency - s.mwe) * Math.min(1, dt / C.turbine.genLag);

  s.doubling = s.rho > 0.5 ? Math.LN2 * C.kinetics.K / s.rho : Infinity;
  if (!frozen) protect(s, dt);
}

function protect(s, dt) {
  const L = CONFIG.protect;
  if (!s.scram && s.Pth > s.allow + CONFIG.pumps.over) s.overT += dt; else s.overT = Math.max(0, s.overT - 2 * dt);
  // Без питания приводов стержни падают сами — это физика, а не автоматика
  if (!s.offsite && !s.scram) { doScram(s, 'blackout'); return; }
  if (s.flags.automation) {
    if (!s.scram) {
      let r = null;
      if (s.Pth > L.power) r = 'overpower';
      else if (s.doubling < L.doubling && s.P > 1e-5) r = 'period';
      else if (s.Tout > L.tout) r = 'tout';
      else if (s.margin < L.margin) r = 'subcool';
      else if (s.p > L.pHigh) r = 'pHigh';
      else if (s.p < L.pLow && s.Pth > 0.05) r = 'pLow';
      else if (s.overT > CONFIG.pumps.limitTime) r = 'pumpLimit';
      if (r) doScram(s, r);
    } else if (!s.backup && (s.Tout > L.backupTout || s.margin < 3)) {
      // Резервная автоматика: сама запускает дизели и насосы
      s.backup = true;
      if (s.dg === 'off') { s.dg = 'starting'; s.dgT = CONFIG.dg.startTime - 1; }
      s.pumps.forEach((pm, i) => { if (i < 2 && !pm.tripped) { pm.on = true; if (!s.inp.pumpOrder.includes(i)) s.inp.pumpOrder.push(i); } });
    }
  } else {
    const D = CONFIG.damage; let bad = null;
    if (s.Tout > D.tout) bad = 'tout';
    else if (s.margin < D.margin) bad = 'boil';
    else if (s.Pth > D.power) bad = 'power';
    else if (s.p > D.p) bad = 'pressure';
    if (bad) { s.dmg += dt; s.dmgWhy = bad; } else s.dmg = Math.max(0, s.dmg - dt * 0.5);
    if (s.dmg > D.time) s.damaged = true;
  }
}

// Тепловое равновесие при заданной мощности (без кинетики)
function equilibrate(s, matchValve) {
  const C = CONFIG, sc = C.secondary;
  s.pumps.forEach(pm => { pm.speed = pm.on ? 1 : 0; });
  for (let i = 0; i < 3; i++) s.D[i] = C.decay.frac[i] * s.P;
  if (matchValve) {
    const Ts = sc.dumpSet - 1.5;
    const Q = s.P * C.plant.thermalMW;
    s.v = s.vSet = clamp(100 * Q / (C.plant.thermalMW * sc.valveMax * Math.pow(psat(Ts) / psat(sc.Tnom), sc.steamExp)), 0, 100);
  }
  for (let k = 0; k < 6000; k++) step(s, 0.1, true);
  s.mwe = s.Qturb * C.plant.efficiency;
}

function balance(s) { s.rhoCore = -reactivityParts(s); s.rho = 0; }

function applyStart(s, st) {
  if (st.P != null) s.P = st.P;
  if (st.h != null) s.h = st.h;
  if (st.pumps) st.pumps.forEach((on, i) => { s.pumps[i].on = !!on; s.pumps[i].speed = on ? 1 : 0; });
  if (typeof st.valve === 'number') s.v = s.vSet = st.valve;
  if (st.cB != null) s.cB = s.cBset = st.cB;
  if (st.p != null) s.p = s.pSet = st.p;
}

function createState(level) {
  const s = baseState();
  s.flags.xenon = !!level.physics.xenon;
  s.flags.autoPressure = !!level.physics.autoPressure;
  s.flags.automation = level.physics.automation !== false;
  s.inp.pumpOrder = [0, 1, 2, 3];
  if (level.history) {
    // Реактор работал на полной мощности, затем — аварийный останов tripAgo секунд назад
    const H = level.history;
    applyStart(s, H.from); applyStart(s, level.start);
    s.xi = s.P; s.xx = xenonEq(s.P);
    equilibrate(s, H.from.valve === 'match');
    balance(s);
    const auto = s.flags.automation; s.flags.automation = true;
    doScram(s, 'history');
    for (let t = 0; t < H.tripAgo; t += CONFIG.dt) step(s, CONFIG.dt);
    s.flags.automation = auto;
    // АЗ взведена заново, сменщик поднял стержни
    s.scram = false; s.scramReason = null; s.sr = 0; s.h = H.after.h; s.turbineTrip = false;
    s.v = s.vSet = 0; s.backup = false; s.overT = 0;
    s.rho = s.rhoCore + reactivityParts(s);
    s.P = Math.max(CONFIG.kinetics.minP, CONFIG.kinetics.source * CONFIG.kinetics.K / Math.max(5, -s.rho));
    s.t = 0;
    return s;
  }
  applyStart(s, level.start);
  s.xi = s.P; s.xx = xenonEq(s.P);
  equilibrate(s, level.start.valve === 'match');
  balance(s);
  s.t = 0;
  return s;
}

/* =====================================================================
   ИГРОВАЯ ЛОГИКА: табло, причины АЗ, цели, звёзды, наставник.
   Ничего не рисует — только состояние для интерфейса.
   ===================================================================== */
const ALL_GROUPS = ['power', 'rods', 'scram', 'temp', 'pumps', 'turbine', 'grid', 'pressure', 'boron', 'dg', 'xenon'];
function openGroups(idx) {
  const lv = LEVELS[idx];
  if (lv.goal.type === 'shift') return new Set(ALL_GROUPS);
  const set = new Set();
  for (let i = 0; i <= idx; i++) LEVELS[i].unlock.forEach(g => set.add(g));
  return set;
}
// В щитовой есть питание: от сети или от дизель-генератора. По этому условию звучат вентиляция, гул и лампы,
// а в 2.0 по нему же включится аварийное освещение — свет и звук погаснут одновременно.
const roomPowered = s => s.offsite || s.dg === 'on';
function unlockLevelOf(group) { const lv = LEVELS.find(l => l.unlock.includes(group)); return lv ? lv.num : 1; }

const Z = CONFIG.zones;
const inGreen = (v, z) => v >= z.green[0] && v <= z.green[1];
const zoneState = (v, z) => (v < z.yellow[0] || v > z.yellow[1]) ? 2 : (v < z.green[0] || v > z.green[1]) ? 1 : 0;
const pct = v => Math.round(v * 100);
const f1 = v => v.toFixed(1).replace('.', ',');
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; };
const pumpsWord = n => `${n} ${plural(n, 'насос', 'насоса', 'насосов')}`;

// Табло сигнализации. kind: op — тревога по режиму (влияет на звёзды), event — авария извне, info — сведения
const LAMPS = [
  { id: 'rate', label: 'Быстрый разгон', kind: 'op', tip: 'Мощность растёт слишком быстро. Опусти стержни немного и подожди.',
    f: g => g.s.doubling < Z.doubling.danger ? 2 : g.s.doubling < Z.doubling.warn ? 1 : 0 },
  { id: 'power', label: 'Мощность выше нормы', full: 'Мощность выше допустимой', kind: 'op', tip: 'Реактор даёт больше тепла, чем могут унести работающие насосы. Каждый насос — около 25% мощности.',
    f: g => { const s = g.s; if (s.scram) return 0; return (s.Pth > s.allow + Z.powerRed || s.Pth > 1.07) ? 2 : s.Pth > s.allow + 0.005 ? 1 : 0; } },
  { id: 'tout', label: 'Перегрев воды', kind: 'op', tip: 'Вода на выходе из реактора горячее нормы. Снизь мощность или включи насосы.',
    f: g => g.s.Tout > Z.tout.yellow[1] ? 2 : g.s.Tout > Z.tout.green[1] ? 1 : 0 },

    f: g => g.s.margin < Z.margin.danger ? 2 : g.s.margin < Z.margin.warn ? 1 : 0 },
  { id: 'phigh', label: 'Давление высокое', kind: 'op', tip: 'Давление выше нормы: при 18 МПа откроются предохранительные клапаны. Включи впрыск.',
    f: g => g.s.p > Z.pressure.yellow[1] ? 2 : g.s.p > Z.pressure.green[1] ? 1 : 0 },
  { id: 'plow', label: 'Давление низкое', kind: 'op', tip: 'Давление ниже нормы: чем оно ниже, тем легче воде закипеть. Включи нагрев.',
    f: g => g.s.p < Z.pressure.yellow[0] ? 2 : g.s.p < Z.pressure.green[0] ? 1 : 0 },

    f: g => g.s.W < 0.25 ? 2 : g.s.W < 0.6 ? 1 : 0 },

    f: g => g.s.pumps.some(p => p.tripped) ? 2 : 0 },
  { id: 'offsite', label: 'Нет сети', full: 'Нет внешнего питания', kind: 'event', tip: 'Станция отрезана от сети: насосы и турбина без питания. Выручают дизель-генераторы.',
    f: g => g.s.offsite ? 0 : 2 },
  { id: 'scram', label: 'АЗ сработала', kind: 'event', tip: 'Аварийная защита сбросила все стержни. Реактор заглушён, но остаточное тепло ещё нужно отводить.',
    f: g => g.s.scram ? 2 : 0 },
  { id: 'grid', label: 'Отклонение от задания', kind: 'soft', tip: 'Генератор выдаёт не столько, сколько просит диспетчер. Подправь клапан турбины.',
    f: g => g.hasDemand() && g.s.turbineOnline && Math.abs(g.goalErrRel()) > g.goalCfg.tolRel ? 1 : 0 },
  { id: 'rods', label: 'Стержни вне зоны', full: 'Стержни вне рабочей зоны', kind: 'soft', tip: 'Стержни слишком глубоко или слишком высоко. Верни их в зелёную зону, компенсируя бором.',
    f: g => g.open.has('boron') && !g.s.scram && !g.rodsInZone() ? 1 : 0 },
  { id: 'xenon', label: 'Отравление ксеноном', kind: 'soft', tip: 'В топливе накопилось больше ксенона, чем обычно. Он поглощает нейтроны — реактор «ленится».',
    f: g => g.s.flags.xenon && (g.s.xx - xenonEq(g.s.P)) > 0.3 ? 1 : 0 },
  { id: 'dump', label: 'Сброс пара', kind: 'info', tip: 'Часть пара уходит мимо турбины в конденсатор (или в атмосферу). Тепло отводится, но тока от него нет.',
    f: g => g.s.Qdump > 60 ? 3 : 0 },
  { id: 'dg', label: 'Дизели в работе', kind: 'info', tip: 'Резервные дизель-генераторы дают питание насосам и подпитке.',
    f: g => g.s.dg === 'on' ? 3 : g.s.dg === 'starting' ? 1 : 0 },
];

// Почему сработала защита и что делать иначе
const REASONS = {
  overpower: s => ({ title: 'АЗ: превышение мощности', why: `Мощность дошла до ${pct(s.Pth)}% — выше предела 110%.`, advice: 'Поднимай стержни короткими нажатиями и жди, пока мощность догонит.' }),
  period:    s => ({ title: 'АЗ: слишком быстрый разгон', why: 'Мощность удваивалась быстрее, чем за 2,5 секунды, — автоматика сочла это опасным.', advice: 'Если шкала «Разгон» ушла в жёлтое — отпусти кнопку и опусти стержни чуть-чуть.' }),
  tout:      s => ({ title: 'АЗ: перегрев воды', why: `Вода на выходе нагрелась до ${Math.round(s.Tout)} °C (предел ${CONFIG.protect.tout} °C).`, advice: s.nRun < 4 ? `Тепла было больше, чем могут унести ${pumpsWord(s.nRun)}. Включай насосы или снижай мощность заранее.` : 'Снижай мощность раньше, пока температура в жёлтой зоне.' }),
  subcool:   s => ({ title: 'АЗ: вода близка к кипению', why: `До кипения оставалось ${Math.max(0, Math.round(s.margin))} °C.`, advice: 'Вода закипает, если давление низкое или вода слишком горячая. Держи давление в зелёной зоне.' }),
  pHigh:     s => ({ title: 'АЗ: высокое давление', why: `Давление поднялось до ${f1(s.p)} МПа.`, advice: 'Включай впрыск, как только давление пошло вверх, — оно растёт, когда вода греется.' }),
  pLow:      s => ({ title: 'АЗ: низкое давление', why: `Давление упало до ${f1(s.p)} МПа.`, advice: 'Включай нагрев, когда давление идёт вниз, — особенно при наборе нагрузки.' }),
  pumpLimit: s => ({ title: 'АЗ: мощность не по насосам', why: `Мощность ${pct(s.Pth)}% держалась выше, чем могут охладить ${pumpsWord(s.nRun)} (до ${pct(s.allow)}%), дольше 20 секунд.`, advice: 'При отказе насоса сразу снижай мощность: стержни вниз и клапан турбины прикрыть.' }),
  manual:    s => ({ title: 'АЗ нажата вручную', why: 'Станция в безопасности, но задачу нужно было решить без аварийной защиты.', advice: 'АЗ — правильный выбор, когда не понимаешь, что происходит. Здесь можно было справиться стержнями и клапаном.' }),
  backup:    s => ({ title: s.timeoutBackup ? 'Охлаждение не запущено' : 'Перегрев после останова', why: s.timeoutBackup ? `Больше полутора минут без насосов: вода нагрелась до ${Math.round(s.Tout)} °C, и резервная автоматика сама запустила дизели и насосы.` : `Остаточное тепло разогрело воду до ${Math.round(s.Tout)} °C. Резервная автоматика сама запустила дизели и насосы.`, advice: 'Сначала дизели, потом насосы — и как можно раньше.' }),
  damage:    s => ({ title: 'Повреждение активной зоны', why: ({ tout: `Вода перегрелась до ${Math.round(s.Tout)} °C.`, boil: 'Вода в активной зоне закипела — топливо осталось без охлаждения.', power: `Мощность дошла до ${pct(s.Pth)}%.`, pressure: `Давление ${f1(s.p)} МПа — выше прочности контура.` })[s.dmgWhy] || 'Реактор вышел за пределы безопасной работы.', advice: 'В реальности автоматика заглушила бы реактор гораздо раньше — для этого она и существует.' }),
  schedule:  (s, g) => ({ title: 'Пик не удержан', why: `Нагрузка и стержни были в норме ${pct(g.m.inBandTime / Math.max(1, g.m.total))}% времени, а нужно ${pct(g.goalCfg.need)}%.`, advice: 'Клапан турбины — для нагрузки, бор — чтобы стержни оставались в рабочей зоне.' }),
};

const fmtClock = min => { const m = ((Math.round(min) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const fmtSec = t => { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m ? `${m} мин ${s} с` : `${s} с`; };

class Game {
  constructor(idx) {
    this.idx = idx; this.level = LEVELS[idx]; this.goalCfg = this.level.goal;
    this.open = openGroups(idx);
    this.s = createState(this.level);
    this.done = false; this.result = null; this.prog = 0;
    this.m = { warnTime: 0, redCount: 0, exits: 0, entered: false, outT: 0, errSum: 0, inBandTime: 0, total: 0,
               rodsZoneTime: 0, maxTout: this.s.Tout, maxToutAfter: 0, maxP: this.s.Pth, reactTime: null, dgStartT: null, dgOnT: null, pumpsOnT: null };
    this.events = (this.level.events || []).map(e => ({ ...e }));
    this.genRandom();
    this.happened = {}; this.lastEventT = -99;
    this.log = []; this.hist = []; this.chart = [];
    this.msg = null; this.queue = []; this.msgN = 0; this.fired = {}; this.lastTipT = -99;
    this.lamps = {}; this.prevLamps = {};
    this.ann = {}; this.annReady = false;     // квитирование: по каждой лампе — новая или квитирована и когда
    // следилки для подсказок
    this.rodMoved = 0; this.rodHoldTime = 0; this.sinceRod = 999; this.pAtRodStop = this.s.Pth; this.rodStart = null;
    this.pumpsTurnedOn = 0; this.sincePumpOn = 999; this.pAtValve = this.s.Pth; this.sinceDG = 0; this.boronUsed = false;
    this.dp = 0; this.xdot = 0; this._lastP = this.s.p; this._lastX = this.s.xx; this._coalesce = {};
    this.histT = 0; this.chartT = 0;
    this.sampleHist(); this.sampleChart();
    // табло сразу в стартовом состоянии — его видно уже под брифингом (лампы старта квитированы предыдущей сменой)
    try { for (const L of LAMPS) this.lamps[L.id] = L.f(this); } catch (e) { this.lamps = {}; }
  }
  get t() { return this.s.t; }

  genRandom() {
    const r = this.level.random; if (!r) return;
    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = () => Math.floor(Math.random() * 4);
    const t1 = rnd(...r.pumpTrip), p1 = pick();
    this.events.push({ t: t1, type: 'pumpTrip', pump: p1 }, { t: t1 + r.repairAfter, type: 'pumpRepair', pump: p1 });
    if (r.pumpTrip2) { let p2 = pick(); if (p2 === p1) p2 = (p1 + 2) % 4; this.events.push({ t: rnd(...r.pumpTrip2), type: 'pumpTrip', pump: p2 }); }
  }

  /* ---------- квитирование сигнализации ----------
     ann[id] = { state: 'new' | 'ack', lv, newT, ackT, offT }. Новая лампа мигает и звучит, пока её не квитируют;
     квитированная горит ровно и молчит; погасшая — забывается через rearm секунд. Лампы, горящие на первом шаге уровня,
     квитированы предыдущей сменой (ackT = null). Интерфейс и звук это состояние только читают; ackT пригодится разбору 2.0. */
  updateAnn() {
    const rearm = CONFIG.annunciator.rearm, t = this.t;
    for (const L of LAMPS) {
      const lv = this.lamps[L.id] || 0, a = this.ann[L.id];
      if (!this.annReady) { if (lv) this.ann[L.id] = { state: 'ack', lv, newT: null, ackT: null, offT: null }; continue; }
      const fresh = () => { this.ann[L.id] = { state: L.kind === 'info' ? 'ack' : 'new', lv, newT: t, ackT: null, offT: null }; };
      if (!lv) { if (a && a.offT == null) a.offT = t; continue; }
      if (!a) fresh();
      else if (a.offT != null) {                       // снова загорелась
        if (t - a.offT < rearm && !(a.lv === 1 && lv === 2)) { a.offT = null; a.lv = lv; } else fresh();
      } else if (a.lv === 1 && lv === 2) fresh();      // «жёлтая → красная» — новая сигнализация
      else a.lv = lv;
    }
    this.annReady = true;
  }
  ack() {                                              // одно нажатие квитирует всё, что мигает
    let n = 0;
    for (const id in this.ann) { const a = this.ann[id]; if (a.state === 'new' && a.offT == null) { a.state = 'ack'; a.ackT = this.t; n++; } }
    return n;
  }
  annNew(id) { const a = this.ann[id]; return !!a && a.state === 'new' && a.offT == null; }

  /* ---------- наставник ---------- */
  say(text, prio = 1, src = null) {                      // src: 'dispatcher' — реплика диспетчера (звучит телефоном)
    const m = { text, prio, t: this.t, id: ++this.msgN, src };
    if (!this.msg || prio >= this.msg.prio || this.t - this.msg.t > 5) this.msg = m;
    else { this.queue.push(m); if (this.queue.length > 3) this.queue.shift(); }
  }
  addLog(label, kind = 'action') { this.log.push({ t: this.t, label, kind }); }
  coalesceLog(key, label) {
    const c = this._coalesce[key];
    if (c && this.t - c.t < 1.5) { c.entry.label = label; c.t = this.t; }
    else { const entry = { t: this.t, label, kind: 'action' }; this.log.push(entry); this._coalesce[key] = { t: this.t, entry }; }
  }

  /* ---------- органы управления ---------- */
  rodPress(dir) {
    if (this.done || this.s.scram) return;
    this.s.inp.rodDir = dir; this.s.inp.rodPulse = dir * CONFIG.rods.minPulse;
    this.rodStart = { t: this.t, h: this.s.h, dir };
  }
  rodRelease() {
    this.s.inp.rodDir = 0;
    if (!this.rodStart) return;
    const st = this.rodStart; this.rodStart = null;
    const dh = Math.abs(this.s.h - st.h) + CONFIG.rods.minPulse * 0.5;
    this.addLog(`Стержни ${st.dir > 0 ? '▲' : '▼'} ${dh.toFixed(1)}%`);
    this.sinceRod = 0; this.pAtRodStop = this.s.Pth; this.rodHoldTime = 0;
  }
  togglePump(i) {
    const pm = this.s.pumps[i]; if (this.done) return false;
    if (pm.tripped) { this.say(`ГЦН-${i + 1} неисправен — включить нельзя, пока его не осмотрят.`, 2); return false; }
    pm.on = !pm.on;
    const ord = this.s.inp.pumpOrder.filter(k => k !== i); if (pm.on) ord.push(i); this.s.inp.pumpOrder = ord;
    this.addLog(`ГЦН-${i + 1} ${pm.on ? 'вкл' : 'откл'}`);
    if (pm.on) { this.pumpsTurnedOn++; this.sincePumpOn = 0; }
    if (pm.on && !this.s.offsite && this.s.dg !== 'on') this.say('Насосу нужно питание: сети нет, а дизели ещё не в работе.', 2);
    else if (pm.on && !this.s.offsite && !pm.powered && this.s.inp.pumpOrder.filter(k => this.s.pumps[k].on).length > CONFIG.dg.maxPumps)
      this.say('Дизелей хватает только на два насоса — этот останется без питания.', 2);
    return true;
  }
  valve(dir, repeat) {
    if (this.done) return;
    if (!this.s.turbineOnline) { if (!repeat) this.say(this.s.offsite ? 'Турбина отключена: сети нет, ток отдавать некуда.' : 'Турбина остановлена после АЗ.', 1); return; }
    const st = repeat ? CONFIG.turbine.repeat : CONFIG.turbine.step;
    if (this.s.vSet < 3 && dir > 0) this.pAtValve = this.s.Pth;
    this.s.vSet = clamp(this.s.vSet + dir * st, 0, 100);
    this.coalesceLog('valve', `Клапан → ${Math.round(this.s.vSet)}%`);
  }
  boron(dir, repeat) {
    if (this.done) return;
    const B = CONFIG.boron;
    // ns-ok: внутреннее округление уставки (чтобы шаги бора не копили ошибку), на экран не выводится
    this.s.cBset = clamp(+(this.s.cBset + dir * (repeat ? B.repeat : B.step)).toFixed(3), B.min, B.max);
    this.boronUsed = true;
    this.coalesceLog('boron', `Бор → ${this.s.cBset.toFixed(2)} г/кг`);
  }
  setHeater(on) { if (this.done) return; this.s.heater = on; if (on) this.s.spray = false; this.addLog(on ? 'Нагрев вкл' : 'Нагрев откл'); }
  setSpray(on) { if (this.done) return; this.s.spray = on; if (on) this.s.heater = false; this.addLog(on ? 'Впрыск вкл' : 'Впрыск откл'); }
  startDG() {
    if (this.done || this.s.dg !== 'off') return;
    this.s.dg = 'starting'; this.s.dgT = 0; this.m.dgStartT = this.t; this.addLog('Пуск ДГ');
    this.say(this.s.offsite ? 'Проверка дизелей — дело хорошее. Но солярка не бесплатная.' : 'Дизели разгоняются — около 10 секунд.', 1);
  }
  pressScram() { if (this.done || this.s.scram) return; doScram(this.s, 'manual'); this.addLog('АЗ!', 'event'); }

  /* ---------- вспомогательное для подсказок и целей ---------- */
  hasDemand() { return this.goalCfg.v === 'mwe'; }
  demand(t = this.t) {
    const g = this.goalCfg; let d = g.points ? interp(g.points, t) : g.target;
    if (g.type === 'shift' && this.s.pumps.some(p => p.tripped)) d = Math.min(d, this.s.allow * 1000 - 30);
    return d;
  }
  goalErrRel() { const d = this.demand(); return d ? (this.s.mwe - d) / d : 0; }
  rodsInZone() { const [a, b] = CONFIG.rods.workZone; return this.s.h >= a && this.s.h <= b; }
  eventHappened(type) { return !!this.happened[type]; }
  xeq() { return xenonEq(this.s.P); }
  demandSlope(t = this.t) { return (this.demand(t + 4) - this.demand(t)) / 4; }
  nextTurn() {
    const pts = this.goalCfg.points || []; const sl = Math.sign(this.demandSlope());
    for (const p of pts) if (p[0] > this.t + 1 && Math.sign(this.demandSlope(p[0] + 0.5)) !== sl) return p;
    return pts[pts.length - 1] || [this.t, this.demand()];
  }
  clockAt(t) { const c = this.level.clock; return c ? fmtClock(c.start + t * c.minPerSec) : fmtSec(t); }
  nextTurnClock() { return this.clockAt(this.nextTurn()[0]); }
  nextTurnMW() { return Math.round(this.nextTurn()[1]); }

  /* ---------- один шаг игры ---------- */
  update(dt) {
    if (this.done) { step(this.s, dt); return; }
    this.processEvents();
    step(this.s, dt);
    this.tick(dt);
  }

  processEvents() {
    const s = this.s;
    // события уровня
    for (const e of this.events) {
      if (e.done || e.t > this.t) continue;
      e.done = true; this.happened[e.type] = this.t; this.lastEventT = this.t;
      if (e.type === 'pumpTrip') {
        const pm = s.pumps[e.pump]; pm.tripped = true; pm.on = false;
        this.addLog(`Отказ ГЦН-${e.pump + 1}`, 'event');
        this.say(`ГЦН-${e.pump + 1} отключился! Тепло уносить нечем — снижай мощность: стержни вниз и клапан турбины прикрыть.`, 3);
      } else if (e.type === 'pumpRepair') {
        s.pumps[e.pump].tripped = false; this.addLog(`ГЦН-${e.pump + 1} исправен`, 'event');
        this.say(`ГЦН-${e.pump + 1} осмотрели — можно включать обратно.`, 2);
      } else if (e.type === 'blackout') {
        s.offsite = false; s.pumps.forEach(p => { p.on = false; }); s.inp.pumpOrder = []; this.addLog('Блэкаут', 'event');
        this.say('Сеть пропала! Стержни упали, насосы выбегают. Автозапуск дизелей не прошёл — запускай вручную!', 3);
      }
    }
  }

  tick(dt) {
    const s = this.s;
    // следилки
    if (s.inp.rodDir) { this.rodHoldTime += dt; if (s.inp.rodDir > 0) this.rodMoved += CONFIG.rods.speed * dt; }
    else this.sinceRod += dt;
    this.sincePumpOn += dt; if (s.dg === 'on') this.sinceDG += dt;
    this.dp = 0.9 * this.dp + 0.1 * (s.p - this._lastP) / dt; this._lastP = s.p;
    this.xdot = 0.9 * this.xdot + 0.1 * (s.xx - this._lastX) / dt; this._lastX = s.xx;
    if (s.v < 3) this.pAtValve = s.Pth;

    // табло и метрики безопасности
    this.prevLamps = this.lamps; this.lamps = {};
    let op = false;
    for (const L of LAMPS) {
      const v = L.f(this); this.lamps[L.id] = v;
      if (L.kind === 'op' && v) { op = true; if (v === 2 && this.prevLamps[L.id] !== 2 && this.t - this.lastEventT > 5) this.m.redCount++; }
    }
    if (op) this.m.warnTime += dt;
    this.updateAnn();
    this.m.maxTout = Math.max(this.m.maxTout, s.Tout); this.m.maxP = Math.max(this.m.maxP, s.Pth);
    if (this.goalCfg.after && this.happened[this.goalCfg.after]) this.m.maxToutAfter = Math.max(this.m.maxToutAfter, s.Tout);
    if (this.happened.pumpTrip != null && this.m.reactTime == null && s.Pth <= s.allow + CONFIG.pumps.over) this.m.reactTime = this.t - this.happened.pumpTrip;
    if (s.dg === 'on' && this.m.dgOnT == null) this.m.dgOnT = this.t;
    if (this.m.dgOnT != null && this.m.pumpsOnT == null && s.flow >= 0.3) this.m.pumpsOnT = this.t;

    const ba = this.level.backupAfter;
    if (ba && this.happened.blackout != null && !s.backup && s.flow < 0.3 && this.t - this.happened.blackout > ba) { s.backup = true; s.timeoutBackup = true; }
    this.updateGoal(dt);
    this.updateTips();
    if (this.msg && this.queue.length && this.t - this.msg.t > 5) this.msg = this.queue.shift();

    // история
    if (this.t - this.histT >= CONFIG.history.runStep) { this.histT = this.t; this.sampleHist(); }
    if (this.t - this.chartT >= CONFIG.history.chartStep) { this.chartT = this.t; this.sampleChart(); }
    this.checkEnd();
  }

  condOk(c) {
    const s = this.s;
    if (c === 'toutGreen') return inGreen(s.Tout, Z.tout);
    if (c === 'pressureGreen') return inGreen(s.p, Z.pressure);
    if (c === 'rodsZone') return this.rodsInZone();
    if (c === 'flow30') return s.flow >= 0.3;
    return true;
  }
  goalStatus() {
    const g = this.goalCfg, s = this.s;
    let inBand = false, err = 0;
    if (g.v === 'power') { err = (s.Pth - g.target) / g.tol; inBand = Math.abs(err) <= 1; }
    else if (g.v === 'mwe') { const d = this.demand(), tol = d * g.tolRel; err = (s.mwe - d) / tol; inBand = Math.abs(err) <= 1 && s.turbineOnline; }
    else if (g.v === 'powerMax') inBand = s.Pth <= g.max;
    else if (g.v === 'cool') inBand = s.Tout <= g.maxTout;
    const conds = (g.cond || []).map(c => ({ c, ok: this.condOk(c) }));
    return { inBand, err, conds, ok: inBand && conds.every(x => x.ok) };
  }
  updateGoal(dt) {
    const g = this.goalCfg, st = this.goalStatus(), m = this.m;
    this.status = st;
    if (this.rodsInZone()) m.rodsZoneTime += dt;
    const active = !g.after || this.happened[g.after] != null;
    if (!active) return;
    m.total += dt;
    if (st.ok) { m.inBandTime += dt; m.errSum += Math.abs(st.err) * dt; }
    if (st.ok) { m.entered = true; m.outT = 0; }
    else if (m.entered) { m.outT += dt; if (m.outT >= 1 && m.outT - dt < 1) m.exits++; }
    if (g.type === 'hold') this.prog = st.ok ? this.prog + dt : Math.max(0, this.prog - 0.5 * dt);
    else this.prog = m.inBandTime;
  }
  goalTarget() {
    const g = this.goalCfg;
    if (g.type === 'hold') return g.time;
    if (g.type === 'schedule') return g.need * this.duration();
    return this.duration();
  }
  duration() { const p = this.goalCfg.points; return p ? p[p.length - 1][0] : 0; }

  updateTips() {
    if (this.done) return;
    for (const id of this.level.tips || []) {
      const d = TIPS[id]; if (!d) continue;
      const f = this.fired[id];
      if (f != null && !(d.repeat && this.t - f > d.repeat)) continue;
      const prio = d.prio || 1;
      if (prio < 2 && this.t - this.lastTipT < 4) continue;
      let ok = false; try { ok = d.cond(this); } catch (e) { ok = false; }
      if (!ok) continue;
      this.fired[id] = this.t; this.lastTipT = this.t;
      this.say(typeof d.text === 'function' ? d.text(this) : d.text, prio, d.src);
    }
  }

  sampleHist() {
    const s = this.s;
    this.hist.push({ t: this.t, P: s.Pth, Tout: s.Tout, p: s.p, mwe: s.mwe, dem: this.hasDemand() ? this.demand() : null, rho: s.rho, xx: s.xx });
  }
  sampleChart() {
    const s = this.s;
    this.chart.push({ t: this.t, P: s.Pth, Tout: s.Tout, p: s.p, mwe: s.mwe, dem: this.hasDemand() ? this.demand() : null, rho: s.rho, xx: s.xx });
    const w = CONFIG.history.chartWindow;
    while (this.chart.length && this.chart[0].t < this.t - w - 1) this.chart.shift();
  }

  checkEnd() {
    const s = this.s, g = this.goalCfg;
    if (s.damaged) return this.finish(false, 'damage');
    if (s.backup) return this.finish(false, 'backup');
    if (s.scram && !this.level.expectScram) return this.finish(false, s.scramReason);
    if (g.type === 'hold' && this.prog >= g.time) return this.finish(true);
    if ((g.type === 'schedule' || g.type === 'shift') && this.t >= this.duration()) {
      if (g.type === 'schedule') return this.finish(this.m.inBandTime >= this.goalTarget(), 'schedule');
      return this.finish(true);
    }
  }

  finish(success, reason) {
    if (this.done) return;
    this.done = true; this.s.inp.rodDir = 0; this.sampleHist();
    const g = this.goalCfg, m = this.m, s = this.s, lv = this.level;
    const shift = g.type === 'shift';
    const res = { success, reason, lines: [], stars: [], score: null, title: '' };
    const frac = m.inBandTime / Math.max(1, m.total);
    if (shift) {
      res.score = Math.max(0, this.scoreNow() - (reason ? 300 : 0));
    }
    res.stars = lv.stars.map(d => {
      let ok = false;
      switch (d.type) {
        case 'exits': ok = m.exits <= d.max; break;
        case 'meanErr': ok = m.inBandTime > 0 && m.errSum / m.inBandTime <= d.max; break;
        case 'warn': ok = m.warnTime <= d.max && m.redCount === 0; break;
        case 'inBand': ok = frac >= d.min; break;
        case 'rodsZone': ok = m.rodsZoneTime / Math.max(1, this.t) >= d.min; break;
        case 'react': ok = m.reactTime != null && m.reactTime <= d.max; break;
        case 'dgFast': ok = m.dgStartT != null && this.happened.blackout != null && m.dgStartT - this.happened.blackout <= d.max; break;
        case 'maxTout': ok = m.maxToutAfter <= d.max; break;
        case 'noRed': ok = m.redCount === 0; break;
        case 'pumpsFast': ok = m.dgOnT != null && m.pumpsOnT != null && m.pumpsOnT - m.dgOnT <= d.max; break;
      }
      if (!success) ok = false;
      return { label: d.label, ok, hint: d.hint || STAR_HINTS[d.type] || '' };
    });
    res.nStars = success ? Math.max(1, res.stars.filter(x => x.ok).length) : 0;
    if (success) {
      res.title = 'Смена сдана';
      res.lines.push(lv.mentor.success);
      if (g.v === 'power') res.lines.push(`Цель за ${fmtSec(this.t)}, наибольшая мощность — ${pct(m.maxP)}%.`);
      else if (g.v === 'mwe' && g.type === 'hold') res.lines.push(`Цель за ${fmtSec(this.t)}, среднее отклонение — ${Math.round((m.errSum / Math.max(1, m.inBandTime)) * g.target * g.tolRel)} МВт.`);
      else if (g.type === 'schedule' || shift) res.lines.push(`В коридоре — ${pct(frac)}% времени${shift ? `, счёт ${res.score}` : ''}.`);
      else if (g.v === 'powerMax') res.lines.push(m.reactTime != null ? `Мощность ушла под предел за ${Math.round(m.reactTime)} с после отказа.` : '');
      else if (g.v === 'cool') res.lines.push(`Самая горячая вода после блэкаута — ${Math.round(m.maxToutAfter)} °C.`);
      const miss = res.stars.find(x => !x.ok); if (miss) res.lines.push(miss.hint);
    } else {
      const R = (REASONS[reason] || REASONS.manual)(s, this);
      res.title = shift && reason !== 'damage' ? 'Смена прервана' : R.title;
      res.lines.push(R.why, R.advice);
      if (shift && res.score != null) res.lines.push(`Счёт: ${res.score}.`);
      if (reason !== 'damage' && reason !== 'schedule' && s.flags.automation) res.lines.push('Станция в безопасности: автоматика сделала своё дело.');
    }
    res.lines = res.lines.filter(Boolean);
    this.result = res;
  }
}

/* «Что происходит?» — наставник объясняет самое важное прямо сейчас (2–3 фразы) */
Game.prototype.explain = function () {
  const s = this.s, g = this.goalCfg, out = [];
  this.explainOn = null;                              // о чём первая причина — интерфейс наводит туда фокус-свет
  const add = (t, k) => { if (out.length < 2) { out.push(t); if (!this.explainOn) this.explainOn = k || null; } };
  const trend = s.rho > 3 ? (s.doubling < 60 ? `растёт: удвоится за ${Math.round(s.doubling)} с` : 'медленно растёт')
              : s.rho < -3 ? 'снижается' : 'стоит ровно';

  if (s.scram) {
    add(`Реактор заглушён: стержни внизу. Но распад осколков деления ещё даёт ${f1(s.Pth * 100)}% тепла — его нужно отводить.`);
    if (!s.offsite && s.dg === 'off') { this.explainOn = 'dg'; add('Сети нет, насосы стоят. Запусти дизели кнопкой «Пуск ДГ».'); }
    else if (!s.offsite && s.dg === 'starting') add(`Дизели разгоняются, осталось ${Math.ceil(CONFIG.dg.startTime - s.dgT)} с. Потом включи два насоса.`);
    else if (s.flow < 0.3) { this.explainOn = 'pumps'; add('Питание есть — включи насосы, чтобы вода снова бежала через реактор.'); }
    else add(`Насосы работают, вода на выходе ${Math.round(s.Tout)} °C. Остаётся ждать, пока остаточное тепло спадёт.`);
    return out.join(' ');
  }
  if (s.overT > 0.5) add(`Мощность ${pct(s.Pth)}% — больше, чем охладят ${pumpsWord(s.nRun)} (до ${pct(s.allow)}%). Снижай, иначе через ${Math.max(1, Math.round(CONFIG.pumps.limitTime - s.overT))} с сработает защита.`, 'power');
  if (s.doubling < Z.doubling.warn) add(`Мощность удваивается каждые ${Math.max(1, Math.round(s.doubling))} с — это быстро. Опусти стержни чуть-чуть и подожди.`, 'rate');
  if (this.open.has('temp') && s.Tout > Z.tout.green[1]) add(`Вода на выходе горячая: ${Math.round(s.Tout)} °C. Тепла больше, чем уносят насосы, — снизь мощность или включи насосы.`, 'temp');
  if (this.open.has('pressure') && !s.flags.autoPressure) {
    if (s.p < Z.pressure.green[0]) add(`Давление низкое, ${f1(s.p)} МПа: вода остыла и сжалась. Включи «Нагрев».`, 'pres');
    else if (s.p > Z.pressure.green[1]) add(`Давление высокое, ${f1(s.p)} МПа: вода нагрелась и расширилась. Включи «Впрыск».`, 'pres');
  }
  if (s.flags.xenon && s.rho < -3 && s.h < 15) add('Стержни почти наверху, а реактор не разгоняется: его «отравил» ксенон. Разбавь бор («Разбавить») или подожди, пока ксенон распадётся.', 'xenon');
  else if (s.flags.xenon && this.xdot < -0.002 && s.Pth > 0.03) add('Ксенон распадается, и реакция понемногу усиливается сама. Придерживай мощность стержнями.', 'xenon');
  if (this.hasDemand() && s.turbineOnline) {
    const d = this.demand(), e = s.mwe - d;
    if (Math.abs(e) > d * g.tolRel) add(`Генератор даёт ${Math.round(s.mwe)} МВт, а сети нужно ${Math.round(d)}. ${e < 0 ? 'Приоткрой' : 'Прикрой'} клапан турбины — реактор пойдёт следом.`, 'turb');
  }
  if (this.open.has('boron') && !this.rodsInZone()) add(`Стержни на ${Math.round(s.h)}% — вне рабочей зоны. ${s.h > CONFIG.rods.workZone[1] ? 'бор «Добавить» и стержни вверх' : 'бор «Разбавить» и стержни вниз'} — понемногу, по очереди.`, 'boron');
  if (!out.length) {
    if (g.v === 'power') {
      const d = s.Pth - g.target;
      if (Math.abs(d) <= g.tol) add(`Мощность ${pct(s.Pth)}% — в цели, ${trend}. ${Math.abs(s.rho) < 4 ? 'Ничего не трогай — просто держи.' : (s.rho > 0 ? 'Опусти стержни на полделения, чтобы рост остановился.' : 'Подними стержни на полделения, чтобы спад остановился.')}`, 'power');
      else add(`Мощность ${pct(s.Pth)}%, ${trend}. ${d < 0 ? (s.rho > 8 ? 'Она уже идёт к цели — подожди.' : 'Подними стержни немного и подожди.') : (s.rho < -8 ? 'Она уже снижается — подожди.' : 'Опусти стержни немного и подожди.')}`, 'power');
    } else add(`Мощность реактора ${pct(s.Pth)}%, ${trend}.`, 'power');
    if (s.rho > 3 && this.sinceRod > 6 && s.v > 5) add('Стержни не трогали — значит, реактор подстраивается под турбину: холодная вода усиливает реакцию.');
    else if (Math.abs(s.rho) < 3) add(`Вода ${this.open.has('temp') ? Math.round(s.Tout) + ' °C, ' : ''}давление ${f1(s.p)} МПа — всё в норме. Так держать.`);
  }
  return out.join(' ');
};

Game.prototype.scoreNow = function () {
  const m = this.m, frac = m.inBandTime / Math.max(1, m.total), zoneFrac = m.rodsZoneTime / Math.max(1, this.t);
  return Math.max(0, Math.round(600 * frac + 250 * Math.max(0, 1 - m.warnTime / 60) + 150 * zoneFrac));
};

const SEG_PTS = {
  a: '3,1 11,1 12.2,2.2 11,3.4 3,3.4 1.8,2.2', g: '3,10.8 11,10.8 12.2,12 11,13.2 3,13.2 1.8,12', d: '3,20.6 11,20.6 12.2,21.8 11,23 3,23 1.8,21.8',
  f: '1.6,2.8 2.8,4 2.8,10.4 1.6,11.6 0.4,10.4 0.4,4', b: '12.4,2.8 13.6,4 13.6,10.4 12.4,11.6 11.2,10.4 11.2,4',
  e: '1.6,12.6 2.8,13.8 2.8,20 1.6,21.2 0.4,20 0.4,13.8', c: '12.4,12.6 13.6,13.8 13.6,20 12.4,21.2 11.2,20 11.2,13.8',
};
const SEG_MAP = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', ' ': '', '_': 'd' };
class Seg {
  constructor(el, n) {
    this.n = n; this.cur = null; this.cls = null;
    const W = 17, w = n * W + 3;
    let h = `<svg class="seg-svg" viewBox="0 0 ${w} 24" style="aspect-ratio:${w}/24"><g transform="translate(2.6 0) skewX(-6)">`;
    for (let i = 0; i < n; i++) {
      h += `<g transform="translate(${i * W} 0)">`;
      for (const k of 'abcdefg') h += `<polygon class="sg" data-k="${k}" points="${SEG_PTS[k]}"/>`;
      h += '<circle class="sg" data-k="p" cx="15.6" cy="22" r="1.25"/></g>';
    }
    el.innerHTML = h + '</g></svg>';
    this.svg = el.firstChild;
    this.cells = [...this.svg.firstChild.children].map(g => { const o = {}; for (const p of g.children) o[p.dataset.k] = p; return o; });
  }
  set(text, cls) {
    if (cls !== this.cls) { this.svg.setAttribute('class', 'seg-svg s-' + (cls || 'neu')); this.cls = cls; }
    text = String(text); if (text === this.cur) return; this.cur = text;
    const cells = [];
    for (const ch of text) { if ((ch === '.' || ch === ',') && cells.length) cells[cells.length - 1].p = true; else cells.push({ ch, p: false }); }
    while (cells.length < this.n) cells.unshift({ ch: ' ', p: false });
    cells.slice(-this.n).forEach((c, i) => {
      const on = SEG_MAP[c.ch] || '', cell = this.cells[i];
      for (const k of 'abcdefg') cell[k].classList.toggle('on', on.includes(k));
      cell.p.classList.toggle('on', c.p);
    });
  }
}

/* ---------- шкала с зонами нормы ---------- */
class Scale {
  constructor(el, o) {
    this.o = o; this.el = el; this.cls = null; this.zKey = '';
    el.classList.add('scale');
    el.innerHTML = '<div class="sc-track"><div class="sc-zones"></div><div class="sc-minor"></div><div class="sc-target"></div><div class="sc-fill"></div><div class="sc-needle"></div><div class="sc-mark"></div></div><div class="sc-ticks"></div>';
    const q = s => el.querySelector(s);
    this.zEl = q('.sc-zones'); this.tEl = q('.sc-target'); this.fEl = q('.sc-fill'); this.nEl = q('.sc-needle'); this.mEl = q('.sc-mark');
    const tk = q('.sc-ticks');
    (o.ticks || []).forEach(t => {
      const [v, label] = Array.isArray(t) ? t : [t, String(t).replace('.', ',')];
      const s = document.createElement('span'), p = this.pos(v);
      s.style.left = p + '%'; s.textContent = label; if (p < 4) s.className = 'l'; else if (p > 96) s.className = 'r';
      tk.appendChild(s);
    });
    // мелкие риски шкалы — посередине между оцифрованными (только у числовых шкал)
    const nums = (o.ticks || []).filter(t => !Array.isArray(t));
    q('.sc-minor').innerHTML = nums.slice(1).map((v, i) => `<i style="left:${this.pos((v + nums[i]) / 2)}%"></i>`).join('');
  }
  pos(v) { const o = this.o; const x = o.map ? o.map(v) : (v - o.min) / (o.max - o.min); return clamp(x, 0, 1) * 100; }
  zones(list) {
    const key = list.map(z => z.join(',')).join(';'); if (key === this.zKey) return; this.zKey = key;
    this.zEl.innerHTML = list.map(([a, b, c]) => `<i class="z-${c}" style="left:${this.pos(a)}%;width:${Math.max(0, this.pos(b) - this.pos(a))}%"></i>`).join('');
  }
  target(a, b) {
    if (a == null) { this.tEl.style.display = 'none'; return; }
    this.tEl.style.display = 'block'; this.tEl.style.left = this.pos(a) + '%'; this.tEl.style.width = Math.max(1, this.pos(b) - this.pos(a)) + '%';
  }
  mark(v) { if (v == null) { this.mEl.style.display = 'none'; return; } this.mEl.style.display = 'block'; this.mEl.style.left = this.pos(v) + '%'; }
  // стрелка — пружина с затуханием (FEEL.needle): цифра показывает модель сразу, стрелка догоняет за доли секунды, с весом
  set(v, cls) {
    const p = this.pos(v), z = this.o.center != null ? this.pos(this.o.center) : 0, key = p.toFixed(2);
    if (key !== this._p) { this._p = key; this.fEl.style.left = Math.min(p, z) + '%'; this.fEl.style.width = Math.abs(p - z) + '%'; }
    const N = FEEL.needle, now = performance.now();
    if (this.x == null) { this.x = p; this.vx = 0; this.zt = N.zeta; }
    let dt = Math.min(0.1, Math.max(0, (now - (this.tn || now)) / 1000)); this.tn = now;
    if (Math.abs(p - this.x) > N.jump * 100 && Math.abs(this.vx) < 5) this.zt = N.zetaJump;   // начало большого скачка
    const w = 2 * Math.PI * N.hz;
    while (dt > 0) {                                   // полунеявный Эйлер мелкими шагами: устойчиво при любом кадре
      const h = Math.min(dt, 1 / 120); dt -= h;
      this.vx += (w * w * (p - this.x) - 2 * this.zt * w * this.vx) * h; this.x += this.vx * h;
    }
    if (Math.abs(p - this.x) < 0.02 && Math.abs(this.vx) < 0.2) { this.x = p; this.vx = 0; this.zt = N.zeta; }
    const nx = clamp(this.x, -1.5, 101.5).toFixed(2);   // перелёт — чуть за край поля, как упор стрелки
    if (nx !== this._nx) { this._nx = nx; this.nEl.style.left = nx + '%'; }
    if (cls !== this.cls) { this.el.dataset.s = cls || 'neu'; this.cls = cls; }
  }
}

const NightShiftAudio = (function () {
  const dB = d => (d <= -100 ? 0 : Math.pow(10, d / 20));
  // детерминированный генератор: оффлайн-проверка повторяема, а разброс всё равно есть
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

    win:     { bus: 'event', dur: 3.2, f: (A, t, o, d) => { CUES.breaker.f(A, t, o, d); A.chord(t + 0.08, d); } },   // ns-ok: «аккорд» из звуков самой станции — прямо по заданию, не инструмент
    // шаг привода ШЭМ: удар шума 250–400 Гц и три негармоничных металлических резонанса; вверх — чуть выше
    rodStep: { bus: 'process', dur: 0.15, f: (A, t, o, d) => {
      const R = SOUND.reactor.rods, k = A.vary(1, 0.03) * (o.dir > 0 ? R.up : 1), L = R.level;
      A.burst(t, 320 * k, 1.5, 0.015, 0.6 * L, d); A.thump(t, 120 * k, 0.05, 0.3 * L, d);
      A.ring(t, 1100 * k, 0.09, 0.35 * L, d); A.ring(t, 2700 * k, 0.07, 0.22 * L, d); A.ring(t, 4300 * k, 0.06, 0.12 * L, d);
    } },
    contactor: { bus: 'process', dur: 0.1, f: (A, t, o, d) => { A.burst(t, 1800, 2, 0.008, 0.45, d); A.thump(t, 160, 0.04, 0.4, d); A.burst(t + A.vary(0.006, 0.3), 1500, 2, 0.006, 0.2, d); } },   // контактор нагревателей
    valve:     { bus: 'process', dur: 0.2, f: (A, t, o, d) => { A.thump(t, 140, 0.06, 0.4, d); A.burst(t, 900, 1.5, 0.02, 0.3, d); A.hiss(t + 0.02, 0.12, 0.05, d); } },       // клапан впрыска
    // отключение ГЦН автоматом: резкий щелчок с дребезгом — в панораме своего насоса
    pumpTrip:  { bus: 'process', dur: 0.25, f: (A, t, o, d) => { const p = A.pan(o.pan || 0, d); A.burst(t, 3000, 1.5, 0.01, 0.6, p); A.thump(t, 110, 0.08, 0.6, p); for (let k = 1; k < 4; k++) A.burst(t + k * A.vary(0.012, 0.3), 2200, 3, 0.005, 0.25 / k, p); } },
    rodStop: { bus: 'process', dur: 0.4, f: (A, t, o, d) => { A.thump(t, 70, 0.25, 0.6, d); A.burst(t, 200, 1, 0.05, 0.4, d); A.ring(t, 640, 0.12, 0.15, d); } },   // глухой удар в упор
    // АЗ: (тяжёлая кнопка) → каскад реле; падение стержней и удар внизу ведёт слой «падение стержней» по полю fall
    // (в игре — синхронно с sr). Без поля fall (отладка, оффлайн) падение длится o.fall секунд само.
    scram:   { bus: 'event', dur: o => 0.5 + (o.fall || 2), duck: true, f: (A, t, o, d) => {
      const S2 = SOUND.reactor.scram;
      if (o.manual) { A.thump(t, 62, 0.18, 0.7, d); A.burst(t, 700, 1.5, 0.03, 0.5, d); }      // тяжёлая кнопка АЗ
      const t0 = t + (o.manual ? 0.06 : 0);
      for (let k = 0; k < S2.relays; k++) CUES.relay.f(A, t0 + Math.pow(A.R(), 0.8) * S2.spread, o, d);
      if (o.auto !== false) A.autoFall(t0 + 0.05, o.fall || 2);
    } },
    // пуск ДГ: стартер визжит с подъёмом, двигатель схватывает несколькими неровными вспышками
    diesel_start: { bus: 'process', dur: 1.4, f: (A, t, o, d) => { A.air(t, d); A.whine(t + 0.05, 0.8, 300, 900, 0.25, d); for (let k = 0; k < 4; k++) A.thump(t + 0.8 + k * A.vary(0.13, 0.3), 70, 0.08, 0.35, d); } },
    stopValve: { bus: 'process', dur: 0.5, f: (A, t, o, d) => { A.thump(t, 85, 0.2, 0.7, d); A.burst(t, 600, 1.2, 0.04, 0.5, d); A.hiss(t + 0.01, 0.35, 0.12, d); } },   // стопорный клапан турбины
    breakers:  { bus: 'event', dur: 0.6, duck: true, f: (A, t, o, d) => {     // потеря сети: удар выключателей
      for (let k = 0; k < 3; k++) { const tk = t + k * A.vary(0.035, 0.3); A.thump(tk, 66, 0.25, 0.75, d); A.burst(tk, 1500, 1, 0.03, 0.6, d); A.ring(tk, 880, 0.12, 0.15, d); }
      A.hiss(t + 0.01, 0.25, 0.1, d);
    } },
    backupRelays: { bus: 'event', dur: 0.7, f: (A, t, o, d) => { for (let k = 0; k < 12; k++) CUES.relay.f(A, t + Math.pow(A.R(), 0.8) * 0.5, o, d); } },   // резервная автоматика: каскад реле (лампы нет — ревуна нет)
    coreDamaged: { bus: 'event', dur: 2.5, duck: true, f: (A, t, o, d) => { A.thump(t, 40, 1.2, 1.0, d); A.burst(t, 140, 0.8, 0.4, 0.8, d); A.ring(t, 310, 0.6, 0.25, d); A.ring(t, 730, 0.4, 0.12, d); } },   // тяжёлый финальный удар
    // проверка шин из отладочной панели: 2 с розового шума в выбранную шину
    __test:  { bus: 'room', dur: 2.1, f: (A, t, o, d) => A.noiseShot(t, 2, 0.5, d) },
  };

  function create(ctx, opts) {
    opts = opts || {};
    const S = opts.cfg || SOUND, R = rng(opts.seed || 20261007), SR = ctx.sampleRate, T0 = ctx.currentTime;
    const vary = (x, k) => x * (1 + (R() * 2 - 1) * k);
    const now = () => ctx.currentTime;
    const stat = { nodes: 0, live: 0 };            // постоянных узлов; звучащих разовых источников
    const last = new WeakMap();

    // ---------- параметры: установка при создании и плавный ход, автоматизация уходит только при заметном изменении
    function set0(p, v) { p.setValueAtTime(v, T0); last.set(p, v); }
    function glide(p, v, when, tc) {
      const o = last.get(p);
      if (o !== undefined && Math.abs(o - v) <= 1e-4 * Math.max(1, Math.abs(v))) return;
      last.set(p, v); p.setTargetAtTime(v, when, tc);
    }
    function gain(v, dest) { const g = ctx.createGain(); stat.nodes++; set0(g.gain, v); if (dest) g.connect(dest); return g; }
    function filt(type, f, q, dest) { const b = ctx.createBiquadFilter(); stat.nodes++; b.type = type; set0(b.frequency, f); set0(b.Q, q); if (dest) b.connect(dest); return b; }
    function panner(x, dest) {
      if (!ctx.createStereoPanner) return gain(1, dest);              // старый Safari: без панорамы
      const p = ctx.createStereoPanner(); stat.nodes++; set0(p.pan, x); if (dest) p.connect(dest); return p;
    }

    // ---------- шумовые буферы создаются один раз; шов петли сшит кроссфейдом, чтобы не щёлкал
    function noise(seconds, color) {
      const n = Math.floor(SR * seconds), x = Math.floor(SR * 0.05), raw = new Float32Array(n + x);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, br = 0, mean = 0;
      for (let i = 0; i < n + x; i++) {
        const w = R() * 2 - 1; let v;
        if (color === 'brown') { br = (br + 0.02 * w) / 1.02; v = br * 3.5; }
        else if (color === 'pink') {          // фильтр Пола Келлета
          b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
          b3 = 0.8665 * b3 + w * 0.3104856;  b4 = 0.55 * b4 + w * 0.5329522;    b5 = -0.7616 * b5 - w * 0.016898;
          v = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
        } else v = w;
        raw[i] = v; mean += v;
      }
      mean /= n + x;
      const buf = ctx.createBuffer(1, n, SR), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = raw[i] - mean;
      for (let i = 0; i < x; i++) { const k = i / x; d[i] = (raw[i] - mean) * k + (raw[n + i] - mean) * (1 - k); }
      return buf;
    }
    const white = noise(1.3, 'white'), pink = noise(5.9, 'pink'), brown = noise(7.3, 'brown');

    // ---------- импульс ревера: стерео-шум с экспоненциальным спадом (−60 дБ за time), верх гаснет быстрее
    function impulse(sec, damp) {
      const n = Math.floor(SR * sec), pre = Math.floor(SR * 0.004), b = ctx.createBuffer(2, n, SR);
      for (let ch = 0; ch < 2; ch++) {
        const d = b.getChannelData(ch); let lp = 0;
        for (let i = pre; i < n; i++) {
          const x = (i - pre) / (n - pre), k = Math.max(0.06, 0.92 - damp * 0.85 * x);
          lp += k * ((R() * 2 - 1) - lp);
          d[i] = lp * Math.exp(-6.9 * x) * Math.min(1, (i - pre) / (SR * 0.002));
        }
      }
      return b;
    }

    // ---------- мастер: громкость → срез низа → лимитер → измеритель пика (для отладки) → выход
    const vol = Object.assign({}, S.volume, opts.volume);
    let muted = false;
    const out = gain(S.master * vol.master);
    const lowCut = filt('highpass', S.lowCut, 0.7);
    const lim = ctx.createDynamicsCompressor(); stat.nodes++;
    set0(lim.threshold, S.limiter.threshold); set0(lim.knee, S.limiter.knee); set0(lim.ratio, S.limiter.ratio);
    set0(lim.attack, S.limiter.attack); set0(lim.release, S.limiter.release);
    // компрессор сам поднимает выход на 0,6 × (сжатие сигнала 0 дБFS) — снимаем эту прибавку, иначе запаса до 0 дБFS нет
    const L = S.limiter, makeup = 0.6 * -(L.threshold + (0 - L.threshold) / L.ratio);
    const unMakeup = gain(dB(-makeup));
    const meter = ctx.createAnalyser(); stat.nodes++; meter.fftSize = 2048;
    const meterBuf = new Float32Array(meter.fftSize);
    out.connect(lowCut); lowCut.connect(lim); lim.connect(unMakeup); unMakeup.connect(meter); meter.connect(ctx.destination);

    // ---------- «мир»: фон, станция, процессы, тональный слой → регулятор «Станция» → вступление → срез режима → приглушение
    const duck = gain(1, out);
    const modeLP = filt('lowpass', Math.min(20000, SR * 0.45), 0.5, duck);
    const introG = gain(1, modeLP);
    const userSt = gain(vol.station, introG);
    const mode = { room: gain(1, userSt), station: gain(1, userSt), tonal: gain(1, userSt), signal: [] };
    const B = {};
    B.room = gain(dB(S.bus.room), filt('highpass', 40, 0.7, mode.room));
    B.station = gain(dB(S.bus.station), filt('lowpass', S.wall, 0.5, filt('highpass', 35, 0.7, mode.station)));
    B.process = gain(dB(S.bus.process), filt('lowpass', S.halfWall, 0.5, mode.station));
    B.desk = gain(dB(S.bus.desk), mode.station);
    B.tonal = gain(dB(S.bus.tonal), mode.tonal);

    // ---------- ближнее: тревоги, события, пульт, интерфейс → регулятор «Тревоги и пульт» → выход и ревер щитовой
    const rev = ctx.createConvolver(); stat.nodes++; rev.buffer = impulse(S.reverb.time, S.reverb.damp);
    rev.connect(gain(S.reverb.wet, out));
    const userA = [];
    function near(level, send, modeList) {
      const u = gain(vol.alarms, out); userA.push(u); u.connect(gain(send, rev));
      let head = u;
      if (modeList) { head = gain(1, u); modeList.push(head); }
      return gain(dB(level), head);
    }
    B.alarm = near(S.bus.alarm, S.reverb.send.alarm, mode.signal);
    B.event = near(S.bus.event, S.reverb.send.event, mode.signal);
    B.pult = near(S.bus.pult, S.reverb.send.pult);
    B.ui = near(S.bus.ui, S.reverb.send.ui);
    B.phone = panner(S.phone.pan, B.pult);           // аппарат диспетчера — справа, у сети

    // ---------- режимы смеси: одна функция переключения, числа — в SOUND.modes
    let curMode = null;
    function setMode(name, when) {
      const m = S.modes[name] || S.modes.play, first = curMode == null;
      when = Math.max(when == null ? now() : when, now()); curMode = S.modes[name] ? name : 'play';
      const put = (p, v) => (first ? set0(p, v) : glide(p, v, when, m.tc));
      put(mode.room.gain, dB(m.room)); put(mode.station.gain, dB(m.station)); put(mode.tonal.gain, dB(m.tonal));
      mode.signal.forEach(g => put(g.gain, dB(m.signal)));
      put(modeLP.frequency, Math.min(m.lp, SR * 0.45));
    }
    setMode('play');
    // вступление: после первого касания «мир» поднимается из тишины (пульт и тревоги звучат сразу)
    function intro(when, sec) {
      const p = introG.gain; when = Math.max(when == null ? now() : when, now());
      p.cancelScheduledValues(when); p.setValueAtTime(0, when); p.linearRampToValueAtTime(1, when + (sec || S.intro));
    }
    // приглушение «мира» под тревогу или событие; перекрывающиеся продлевают друг друга
    let duckEnd = 0;
    function duckFor(t, dur) {
      const end = t + dur; if (end <= duckEnd) return;
      const p = duck.gain; p.cancelScheduledValues(t);
      p.setTargetAtTime(dB(S.duck.db), t, S.duck.attack); p.setTargetAtTime(1, end, S.duck.release);
      duckEnd = end;
    }

    // ---------- разовые звуки: короткие фильтрованные всплески и удары, каждый раз чуть другие
    const voices = [];
    function voice(t, dur) {
      const n = now(); for (let i = voices.length - 1; i >= 0; i--) if (voices[i] < n) voices.splice(i, 1);
      if (dur < 0) return false;                      // только уборка отзвучавших (для отладки)
      if (voices.length >= S.voices) return false;
      voices.push(t + dur); return true;
    }
    function shot(s) { stat.live++; s.onended = () => { stat.live--; }; return s; }
    function env(g, t, peak, atk, tc) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + atk); g.gain.setTargetAtTime(0, t + atk, tc); }
    const A = {
      R, vary, B,
      burst(t, f, q, dur, level, dest) {             // фильтрованный щелчок: контакт, металл, кромка
        const s = shot(ctx.createBufferSource()); s.buffer = white;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(vary(f, 0.05), t); bp.Q.setValueAtTime(q, t);
        const g = ctx.createGain(); env(g, t, vary(level, 0.12), 0.0015, dur / 4);
        s.connect(bp); bp.connect(g); g.connect(dest); s.start(t, R() * 1.0, dur + 0.05);
      },
      thump(t, f, dur, level, dest) {                // глухой удар: корпус, упор, посадка — тон резонанса и шумовое возбуждение
        const f1 = vary(f, 0.06), d1 = vary(dur, 0.15), t1 = t + R() * 0.002;   // каждый удар чуть другой: высота, длина, момент
        const o = shot(ctx.createOscillator());
        o.frequency.setValueAtTime(f1, t1); o.frequency.exponentialRampToValueAtTime(f1 * vary(0.6, 0.1), t1 + d1);
        const g = ctx.createGain(); env(g, t1, vary(level, 0.15) * 0.6, 0.002, d1 / 4);
        o.connect(g); g.connect(dest); o.start(t1); o.stop(t1 + d1 * 2 + 0.05);
        const s = shot(ctx.createBufferSource()); s.buffer = white;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(f1 * vary(1.1, 0.08), t1); bp.Q.setValueAtTime(5, t1);
        const gn = ctx.createGain(); env(gn, t1, vary(level, 0.15) * 1.6, 0.0015, d1 / 5);
        s.connect(bp); bp.connect(gn); gn.connect(dest); s.start(t1, R() * 1.0, d1 * 1.5 + 0.05);
      },
      hiss(t, dur, level, dest) {                    // короткое шипение: динамик селектора, воздух
        const s = shot(ctx.createBufferSource()); s.buffer = white;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2800, t);
        const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + 0.01); g.gain.setTargetAtTime(0, t + dur * 0.6, dur / 5);
        s.connect(lp); lp.connect(g); g.connect(dest); s.start(t, R() * 0.8, dur + 0.3);
      },
      buzz(t, f, dur, level, dest) {                 // низкое жужжание: узкая полоса шума с ровной огибающей
        const s = shot(ctx.createBufferSource()); s.buffer = white;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(vary(f, 0.03), t); bp.Q.setValueAtTime(8, t);
        const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + 0.006);
        g.gain.setValueAtTime(level, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + 0.025);
        s.connect(bp); bp.connect(g); g.connect(dest); s.start(t, R() * 0.8, dur + 0.06);
      },
      // звонок: молоточек бьёт по «колоколу» из негармоничных призвуков (≈ 1 / 2,4 / 3,9 / 5,4 × f0)
      bell(t, strikes, rate, f0, level, dest, soft) {
        // множитель, громкость, затухание, с; soft — предупредительный: верхние призвуки и молоточек приглушены, без резкости
        const parts = soft ? [[1, 1, 0.42], [2.4, 0.3, 0.16], [3.9, 0.1, 0.08], [5.4, 0.04, 0.05]] : [[1, 1, 0.42], [2.4, 0.5, 0.2], [3.9, 0.3, 0.11], [5.4, 0.16, 0.06]];
        // первый удар — со случайной задержкой до 2 мс: фазы призвуков к удару каждый раз другие, повторы не совпадают до сэмпла
        const t1 = t + R() * 0.002, times = []; for (let k = 0; k < strikes; k++) times.push(t1 + vary(k / rate, k ? 0.04 : 0));
        const force = times.map(() => vary(1, 0.12)), spot = times.map(() => R());   // сила и место удара молоточка
        const tEnd = times[times.length - 1];
        parts.forEach(([m, amp, tc], j) => {
          const o = shot(ctx.createOscillator()); o.frequency.setValueAtTime(vary(f0 * m, 0.006), t);
          const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
          let pk = 0, tp = t1;
          times.forEach((ts, k) => {                  // каждый удар добавляется к ещё звенящему: огибающую считаем сами
            const cur = pk * Math.exp(-(ts - tp) / tc), tilt = j ? 0.75 + 0.5 * spot[k] : 1;   // от места удара меняется окраска
            pk = Math.min(1.5, cur + amp * force[k] * tilt); tp = ts + 0.0015;
            g.gain.setValueAtTime(cur * level, ts); g.gain.linearRampToValueAtTime(pk * level, tp); g.gain.setTargetAtTime(0, tp, tc);
          });
          o.connect(g); g.connect(dest); o.start(t); o.stop(tEnd + tc * 7 + 0.05);
        });
        times.forEach(ts => this.burst(ts, 3600, 3, 0.004, (soft ? 0.015 : 0.05) * level, dest));    // стук молоточка
      },
      siren(t, dur, level, dest) {
        const o = shot(ctx.createOscillator()); o.setPeriodicWave(sawWave);
        o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(vary(255, 0.02), t + 0.15);
        o.frequency.setValueAtTime(255, t + Math.max(0.2, dur - 0.15)); o.frequency.exponentialRampToValueAtTime(150, t + dur + 0.15);
        const am = ctx.createGain(); am.gain.setValueAtTime(0.65, t);
        const lfo = shot(ctx.createOscillator()); lfo.frequency.setValueAtTime(7, t); const dp = ctx.createGain(); dp.gain.setValueAtTime(0.35, t); lfo.connect(dp); dp.connect(am.gain);
        [[720, 3, 0.9], [1450, 3, 0.6], [900, 0.7, 0.35]].forEach(([f, q, k], i) => { const b = ctx.createBiquadFilter(); b.type = i < 2 ? 'bandpass' : 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.setValueAtTime(q, t); const g = ctx.createGain(); g.gain.setValueAtTime(k, t); o.connect(b); b.connect(g); g.connect(am); });
        const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + 0.05); g.gain.setValueAtTime(level, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + 0.18);
        am.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.25); lfo.start(t); lfo.stop(t + dur + 0.25);
      },
      chord(t, dest) {                               // ns-ok: гармоники сети 100 / 200 / 250 / 300 Гц — гул трансформатора под нагрузкой, не музыка

}

    band: g => { const gc = g.goalCfg; return gc.v === 'power' ? [(gc.target - gc.tol) * 100, (gc.target + gc.tol) * 100] : gc.v === 'powerMax' && g.happened.pumpTrip != null ? [0, gc.max * 100] : null; } },
  tout: { title: 'Вода на выходе из реактора, °C', key: 'Tout', color: '#A84E0E', expand: true,
    look: 'Растёт — значит, тепла больше, чем уносят насосы. Зелёная полоса — норма.',
    range: () => [260, 340], band: () => CONFIG.zones.tout.green },
  pressure: { title: 'Давление в контуре, МПа', key: 'p', color: '#1F4F9C', expand: true, ticks: [14, 16, 18],
    look: 'Идёт за температурой: вода греется — давление растёт, остывает — падает.',
    range: () => [14, 18], band: () => CONFIG.zones.pressure.green },
  mwe: { title: 'Генератор, МВт', key: 'mwe', color: '#1C6E35', dem: true,
    look: 'Зелёная линия должна идти внутри коридора вокруг белого пунктира — задания.',
    range: (g, mx) => [0, clamp(niceUp(mx * 1.15), 200, 1200)] },
  rho: { title: 'Разгон реактора', key: 'rho', color: '#1F1D1A', zero: true, ticks: [0],
    look: 'Выше нуля — мощность растёт, ниже — падает. Ксенон тянет линию вниз.',
    range: (g, mx, mn) => { const r = clamp(niceUp(Math.max(Math.abs(mx), Math.abs(mn), 40) * 1.1), 50, 500); return [-r, r]; } },
