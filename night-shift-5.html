function prepCanvas(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(10, Math.round(cv.clientWidth * dpr)), h = Math.max(10, Math.round(cv.clientHeight * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const ctx = cv.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h, dpr, fs: UI.remPx * dpr };
}
function pathLine(ctx, pts, X, Y) { ctx.beginPath(); pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); }

function buildCharts(list) {
  const c = $('charts'); c.style.setProperty('--n', list.length);
  c.innerHTML = list.map(k => `<div class="chart" data-tip="chart:${k}"><div class="ch-h">${CHARTS[k].title}</div><canvas id="ch-${k}"></canvas><div class="ch-look">${CHARTS[k].look}</div></div>`).join('');
  UI.chartsDirty = true;
}

function drawTrend(key, g) {
  const PAPER = TAPE;
  const cv = $('ch-' + key), d = CHARTS[key]; if (!cv || !d || cv.clientWidth < 20) return;
  const { ctx, w, h, dpr, fs } = prepCanvas(cv), data = g.chart, now = g.t, win = CONFIG.history.chartWindow;
  const val = p => p[d.key] * (d.k || 1);
  let mx = -Infinity, mn = Infinity;
  for (const p of data) { const v = val(p); if (v > mx) mx = v; if (v < mn) mn = v; if (d.dem && p.dem != null && p.dem > mx) mx = p.dem; }
  let [y0, y1] = d.range(g, mx, mn);
  if (d.expand) { const sp = y1 - y0; if (mx > y1) y1 = mx + sp * 0.06; if (mn < y0) y0 = mn - sp * 0.06; }
  const L = fs * 2.5, Rr = fs * 1.05, T = fs * 0.45, B = fs * 1.05, pw = w - L - Rr, ph = h - T - B;
  if (pw < 10 || ph < 10) return;
  const X = t => L + pw * (1 - (now - t) / win), Y = v => T + ph * (1 - (v - y0) / (y1 - y0));
  ctx.font = FONT(fs * 0.74);
  // сетка, отпечатанная на ленте; вертикали едут вместе со временем — лента протягивается
  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip(); ctx.lineWidth = dpr;
  for (let t = Math.ceil((now - win) / 5) * 5; t <= now + 1e-6; t += 5) {
    const x = X(t); ctx.strokeStyle = Math.round(t) % 15 === 0 ? PAPER.major : PAPER.grid;
    ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke();
  }
  ctx.restore();
  ctx.lineWidth = dpr; ctx.strokeStyle = PAPER.major; ctx.strokeRect(L, T, pw, ph);
  // коридор нормы — отпечатанная полоса
  const band = d.band ? d.band(g) : null;
  if (band) {
    const ya = Y(Math.min(band[1], y1)), yb = Y(Math.max(band[0], y0));
    if (yb > ya) {
      ctx.fillStyle = PAPER.band; ctx.fillRect(L, ya, pw, yb - ya);
      ctx.strokeStyle = PAPER.bandEdge; ctx.lineWidth = dpr; ctx.setLineDash([5 * dpr, 4 * dpr]);
      ctx.beginPath(); ctx.moveTo(L, ya); ctx.lineTo(L + pw, ya); ctx.moveTo(L, yb); ctx.lineTo(L + pw, yb); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  ctx.lineWidth = dpr; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const tv of (d.ticks || niceTicks(y0, y1, 3))) {
    if (tv < y0 - 1e-9 || tv > y1 + 1e-9) continue;
    const y = Y(tv); ctx.strokeStyle = d.zero && tv === 0 ? PAPER.ink : PAPER.major;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
    ctx.fillStyle = PAPER.label; ctx.fillText(fmtTick(tv), L - fs * 0.25, y);
  }
  ctx.textBaseline = 'alphabetic'; ctx.fillStyle = PAPER.label;
  ctx.textAlign = 'left'; ctx.fillText('−60 с', L, h - fs * 0.2); ctx.textAlign = 'right'; ctx.fillText('сейчас', L + pw, h - fs * 0.2);
  if (d.zero) { ctx.textAlign = 'left'; ctx.fillStyle = PAPER.label; ctx.fillText('растёт ↑', L + fs * 0.3, T + fs * 0.85); ctx.fillText('падает ↓', L + fs * 0.3, T + ph - fs * 0.3); }
  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  if (d.dem) {
    const tol = g.goalCfg.tolRel || 0.05, pts = data.filter(p => p.dem != null);
    if (pts.length > 1) {
      ctx.fillStyle = PAPER.band; ctx.beginPath();
      pts.forEach((p, i) => { const x = X(p.t), y = Y(p.dem * (1 + tol)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(X(pts[i].t), Y(pts[i].dem * (1 - tol)));
      ctx.closePath(); ctx.fill();
      whiteDash(ctx, () => pathLine(ctx, pts.map(p => [p.t, p.dem]), X, Y), dpr, 1.6);
    }
  }
  if (data.length > 1) {
    ctx.strokeStyle = d.color; ctx.lineWidth = 2.8 * dpr; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    pathLine(ctx, data.map(p => [p.t, val(p)]), X, Y); ctx.stroke();
  }
  ctx.restore();
  // перо самописца в точке «сейчас»
  if (data.length) {
    const lp = data[data.length - 1], px = X(lp.t), py = clamp(Y(val(lp)), T, T + ph), u = fs * 0.34;
    ctx.fillStyle = PAPER.white; ctx.strokeStyle = PAPER.ink; ctx.lineWidth = 1.4 * dpr;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 2.4 * u, py - u); ctx.lineTo(px + 2.4 * u, py + u); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // лента за стеклом самописца: один косой блик
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(w * .62, 0); ctx.lineTo(w * .7, 0); ctx.lineTo(w * .7 - h * .5, h); ctx.lineTo(w * .62 - h * .5, h); ctx.closePath(); ctx.fill();
}

/* ---------- мини-график диспетчера ---------- */
function drawSched(g) {
  const PAPER = TAPE;
  const cv = $('c-sched'), gc = g.goalCfg; if (!gc.points || !cv || cv.clientWidth < 20) return;
  const { ctx, w, h, dpr, fs } = prepCanvas(cv), T1 = g.duration(), tol = gc.tolRel || 0.05;
  const y0 = 400, y1 = 1050, L = fs * 1.9, Rr = fs * 0.4, Tp = fs * 0.3, B = fs * 0.95, pw = w - L - Rr, ph = h - Tp - B;
  if (pw < 10 || ph < 8) return;
  const X = t => L + pw * t / T1, Y = v => Tp + ph * (1 - (clamp(v, y0, y1) - y0) / (y1 - y0));
  ctx.font = FONT(fs * 0.7);
  // бланк графика: часовые вертикали и горизонтали 500 / 750 / 1000 МВт
  ctx.lineWidth = dpr; ctx.strokeStyle = PAPER.grid;
  const c = g.level.clock;
  if (c) for (let m = Math.ceil(c.start / 60) * 60; m <= c.start + T1 * c.minPerSec + 1e-6; m += 60) { const x = X((m - c.start) / c.minPerSec); ctx.beginPath(); ctx.moveTo(x, Tp); ctx.lineTo(x, Tp + ph); ctx.stroke(); }
  for (const v of [500, 750, 1000]) { const y = Y(v); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke(); }
  ctx.strokeStyle = PAPER.major; ctx.strokeRect(L, Tp, pw, ph);
  const N = 90; ctx.fillStyle = PAPER.band; ctx.beginPath();
  for (let i = 0; i <= N; i++) { const t = T1 * i / N, x = X(t), y = Y(interp(gc.points, t) * (1 + tol)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  for (let i = N; i >= 0; i--) { const t = T1 * i / N; ctx.lineTo(X(t), Y(interp(gc.points, t) * (1 - tol))); }
  ctx.fill();
  whiteDash(ctx, () => pathLine(ctx, gc.points, X, Y), dpr, 1.4);
  if (g.hist.length > 1) { ctx.strokeStyle = PAPER.bandEdge; ctx.lineWidth = 2 * dpr; ctx.lineJoin = 'round'; pathLine(ctx, g.hist.map(p => [p.t, p.mwe]), X, Y); ctx.stroke(); }
  // жёлтая черта «сейчас» — в чёрной обводке, чтобы читалась на бумаге
  const xn = X(Math.min(g.t, T1));
  ctx.strokeStyle = PAPER.ink; ctx.lineWidth = 4 * dpr; ctx.beginPath(); ctx.moveTo(xn, Tp); ctx.lineTo(xn, Tp + ph); ctx.stroke();
  ctx.strokeStyle = PAPER.yellow; ctx.lineWidth = 2 * dpr; ctx.stroke();
  ctx.fillStyle = PAPER.label; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; [500, 1000].forEach(v => ctx.fillText(String(v), L - fs * 0.2, Y(v)));
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.fillText(g.clockAt(0), L, h - fs * 0.12); ctx.textAlign = 'right'; ctx.fillText(g.clockAt(T1), L + pw, h - fs * 0.12);
  // бланк лежит под оргстеклом: один косой блик
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.beginPath(); ctx.moveTo(w * 0.16, 0); ctx.lineTo(w * 0.24, 0); ctx.lineTo(w * 0.24 - h * 0.6, h); ctx.lineTo(w * 0.16 - h * 0.6, h); ctx.closePath(); ctx.fill();
}

/* ---------- разбор: график всей попытки ---------- */
function drawRun(cv, g) {
  if (!cv || cv.clientWidth < 20) return;
  const { ctx, w, h, dpr, fs } = prepCanvas(cv), H = g.hist, gc = g.goalCfg, r = g.result;
  if (!r || H.length < 2) return;
  const T1 = Math.max(1, H[H.length - 1].t);
  const S = { P: { key: 'P', k: 100, name: 'мощность, %', color: '#1C6E35' }, mwe: { key: 'mwe', k: 1, name: 'генератор, МВт', color: '#1C6E35' },
    Tout: { key: 'Tout', k: 1, name: 'вода на выходе, °C', color: '#A84E0E' }, p: { key: 'p', k: 1, name: 'давление, МПа', color: '#1F4F9C' } };
  const main = gc.v === 'mwe' ? S.mwe : gc.v === 'cool' ? S.Tout : S.P;
  const sk = { tout: 'Tout', backup: 'Tout', damage: 'Tout', pLow: 'p', pHigh: 'p', subcool: 'p', pumpLimit: 'P', overpower: 'P', period: 'P' }[r.reason];
  const sec = sk && S[sk] !== main ? { ...S[sk], color: sk === 'P' ? '#7D5A07' : S[sk].color } : null;
  const ext = d => { let mn = Infinity, mx = -Infinity; for (const p of H) { const v = p[d.key] * d.k; if (v < mn) mn = v; if (v > mx) mx = v; if (d.key === 'mwe' && p.dem != null) mx = Math.max(mx, p.dem * 1.05); } return [mn, mx]; };
  const [mn, mx] = ext(main); let y0, y1;
  if (main.key === 'P') { const tg = gc.v === 'power' ? (gc.target + gc.tol) * 100 : gc.v === 'powerMax' ? gc.max * 100 : 0; y0 = 0; y1 = niceUp(Math.max(mx, tg, 4) * 1.12); }
  else if (main.key === 'mwe') { y0 = 0; y1 = niceUp(mx * 1.08); }
  else { y0 = Math.floor((mn - 4) / 10) * 10; y1 = Math.ceil((mx + 4) / 10) * 10; }
  let s0 = 0, s1 = 1; if (sec) { const [a, b] = ext(sec), pad = Math.max((b - a) * 0.15, sec.key === 'p' ? 0.3 : 3); s0 = a - pad; s1 = b + pad; }
  const L = fs * 2.8, Rr = sec ? fs * 2.8 : fs * 0.8, Tp = fs * 1.75, B = fs * 1.35, pw = w - L - Rr, ph = h - Tp - B;
  if (pw < 20 || ph < 20) return;
  const X = t => L + pw * t / T1, Y = v => Tp + ph * (1 - (v - y0) / (y1 - y0)), Y2 = v => Tp + ph * (1 - (v - s0) / (s1 - s0));
  ctx.font = FONT(fs * 0.8);
  let hasTarget = false;
  ctx.save(); ctx.beginPath(); ctx.rect(L, Tp, pw, ph); ctx.clip();
  if (gc.v === 'power') { hasTarget = true; const a = Y((gc.target + gc.tol) * 100), b = Y((gc.target - gc.tol) * 100); ctx.fillStyle = PAPER.band; ctx.fillRect(L, a, pw, b - a); }
  if (gc.v === 'mwe') {
    const pts = H.filter(p => p.dem != null), tol = gc.tolRel;
    if (pts.length > 1) {
      hasTarget = true; ctx.fillStyle = PAPER.band; ctx.beginPath();
      pts.forEach((p, i) => { const x = X(p.t), y = Y(p.dem * (1 + tol)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(X(pts[i].t), Y(pts[i].dem * (1 - tol)));
      ctx.closePath(); ctx.fill();
      whiteDash(ctx, () => pathLine(ctx, pts.map(p => [p.t, p.dem]), X, Y), dpr, 1.5);
    }
  }
  if ((gc.v === 'powerMax' || gc.v === 'cool') && g.happened[gc.after] != null) {
    hasTarget = true; const lim = gc.v === 'cool' ? gc.maxTout : gc.max * 100, x0 = X(g.happened[gc.after]);
    ctx.fillStyle = PAPER.band; ctx.fillRect(x0, Y(lim), L + pw - x0, Tp + ph - Y(lim));
  }
  ctx.lineWidth = dpr; ctx.strokeStyle = PAPER.major;
  for (const tv of niceTicks(y0, y1, 4)) { const y = Y(tv); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke(); }
  if (sec) { ctx.strokeStyle = sec.color; ctx.lineWidth = 2 * dpr; pathLine(ctx, H.map(p => [p.t, p[sec.key] * sec.k]), X, Y2); ctx.stroke(); }
  ctx.strokeStyle = main.color; ctx.lineWidth = 2.8 * dpr; ctx.lineJoin = 'round'; pathLine(ctx, H.map(p => [p.t, p[main.key] * main.k]), X, Y); ctx.stroke();
  const evs = g.log.filter(e => e.kind === 'event').map(e => ({ t: e.t, label: e.label }));
  if (g.s.scramT != null && !evs.some(e => Math.abs(e.t - g.s.scramT) < 1.5)) evs.push({ t: g.s.scramT, label: 'АЗ' });
  ctx.setLineDash([4 * dpr, 4 * dpr]); ctx.strokeStyle = PAPER.stamp; ctx.lineWidth = 1.8 * dpr;
  for (const e of evs) { const x = X(e.t); ctx.beginPath(); ctx.moveTo(x, Tp); ctx.lineTo(x, Tp + ph); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const e of evs) { const x = X(e.t), tw = ctx.measureText(e.label).width, bx = Math.min(x + 3 * dpr, L + pw - tw - 8 * dpr); ctx.fillStyle = PAPER.white; ctx.fillRect(bx, Tp + 3 * dpr, tw + 6 * dpr, fs * 1.05); ctx.strokeStyle = PAPER.stamp; ctx.lineWidth = dpr; ctx.strokeRect(bx, Tp + 3 * dpr, tw + 6 * dpr, fs * 1.05); ctx.fillStyle = PAPER.stamp; ctx.fillText(e.label, bx + 3 * dpr, Tp + fs * 0.85); }
  ctx.restore();
  // оси
  ctx.fillStyle = PAPER.label; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const tv of niceTicks(y0, y1, 4)) ctx.fillText(fmtTick(tv), L - fs * 0.3, Y(tv));
  if (sec) { ctx.fillStyle = sec.color; ctx.textAlign = 'left'; for (const tv of niceTicks(s0, s1, 3)) if (tv >= s0 && tv <= s1) ctx.fillText(fmtTick(tv), L + pw + fs * 0.3, Y2(tv)); }
  ctx.fillStyle = PAPER.label; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
  for (const tv of niceTicks(0, T1, 5)) { const x = X(tv); if (x < L + fs || x > L + pw - fs) continue; ctx.fillText(g.level.clock ? g.clockAt(tv) : `${tv} с`, x, h - fs * 0.25); }
  // действия игрока: метки сверху
  const acts = g.log.filter(e => e.kind === 'action');
  ctx.fillStyle = PAPER.pen;
  for (const a of acts) { const x = X(a.t); ctx.beginPath(); ctx.moveTo(x - 4 * dpr, Tp - fs * 0.5); ctx.lineTo(x + 4 * dpr, Tp - fs * 0.5); ctx.lineTo(x, Tp - fs * 0.08); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = PAPER.pen; ctx.textAlign = 'left'; ctx.font = FONT(fs * 0.74, 400);
  let lastX = -1e9;
  for (const a of acts) { const x = X(a.t), tw = ctx.measureText(a.label).width; if (x - lastX < tw + 12 * dpr || x + tw > w - 2) continue; ctx.fillText(a.label, x - 4 * dpr, Tp - fs * 0.65); lastX = x; }
  const lg = [`<i style="color:${main.color}">━━</i> ${main.name}`];
  if (sec) lg.push(`<i style="color:${sec.color}">━━</i> ${sec.name}, шкала справа`);
  if (gc.v === 'mwe') lg.push('<i class="lg-dem">┅┅</i> задание диспетчера');
  if (hasTarget) lg.push('<i class="lg-band">■</i> цель');
  lg.push('<i style="color:#2F3A8F">▼</i> твои действия');
  if (evs.length) lg.push('<i style="color:#B3261E">┆</i> события');
  const le = $('mr-legend'); if (le) le.innerHTML = lg.map(x => `<span>${x}</span>`).join('');
}

/* ---------- окна: меню, брифинг, разбор ---------- */
const COND_TEXT = { toutGreen: 'вода горячее нормы', pressureGreen: 'давление вне нормы', rodsZone: 'стержни вне рабочей зоны', flow30: 'включи насосы' };
const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,1.8 15,8.6 22.4,9.3 16.8,14.2 18.5,21.5 12,17.7 5.5,21.5 7.2,14.2 1.6,9.3 9,8.6"/></svg>';
// ns-ok: звёзды — оценка уровня из исходной игры (их логика не меняется); в журнале они проставлены шариковой ручкой

// выбор смены — пульт «График смен» (сцена shifts); старое меню-журнал убрано

// задание на смену: номер, название, 1–3 фразы, цель и одна кнопка «Принять смену» (задание 4, 6.7)
function showBrief(idx) {
  const lv = LEVELS[idx], news = idx > 0 ? lv.unlock.map(gp => GROUP_NAMES[gp]).filter(Boolean) : [], nMain = LEVELS.filter(l => !l.hidden).length;
  let h = `<div class="mb-num">${lv.hidden ? 'Особый режим' : `Смена ${lv.num} из ${nMain}`}</div><h2>${lv.title}</h2><div class="mb-lines">${lv.brief.map(p => `<p>${p}</p>`).join('')}</div>`;

/* журнал смены (задание 4, 6.8): запись в оперативном журнале вместо окна итогов.

  const d = new Date(), date = `«${d.getDate()}»&nbsp;${MONTHS_GEN[d.getMonth()]}&nbsp;${d.getFullYear()}&nbsp;г.`;

  }
  const say = r.success ? r.lines[0] : null;
  const rest = r.lines.filter((x, i) => !(r.success && i === 0) && !shown.has(x));
  if (!r.success && r.title && r.title !== 'Смена прервана') rest.unshift(r.title + '.');
  h += `<div class="jr-lines">${rest.map(x => `<p>${x}</p>`).join('')}</div>`;
  h += '<div class="mr-chart"><div class="mrc-h">Лента самописца: что делал реактор и что делал ты</div><canvas id="mr-canvas"></canvas>';
  h += '<div class="ch-look">Синие метки — твои нажатия. Посмотри, через сколько секунд линия на них отзывается.</div><div class="mrc-legend" id="mr-legend"></div></div>';
  if (say) h += `<p class="jr-say">${say}</p>`;
  h += `<div class="jr-sign"><div class="jr-sg jr-me"><span>Смену сдал</span>${signSVG(Save.data.sign, 160, 44, 'jr-me')}<i>стажёр</i></div>`
     + `<div class="jr-sg jr-boss"><span>Смену принял</span>${signSVG(PALYCH_SIGN, 160, 44)}<i>нач. смены</i></div></div>`;
  h += '<div class="mr-actions">';
  if (hasNext) h += `<button class="btn primary big" id="mr-next">${LEVELS[nx].hidden ? 'Без страховки' : 'Следующая смена'}</button>`;
  h += `<button class="btn big${hasNext ? '' : ' primary'}" id="mr-retry">Ещё раз</button><button class="btn big" id="mr-menu">К сменам</button></div>`;
  const m = $('m-result'); m.innerHTML = h;
  if (hasNext) $('mr-next').addEventListener('click', () => { Snd.ui(); startLevel(nx, false); });
  $('mr-retry').addEventListener('click', () => { Snd.ui(); startLevel(idx, true); });
  $('mr-menu').addEventListener('click', () => { Snd.ui(); showMenu(); });
  m.querySelectorAll('.sig path').forEach(p => { try { p.style.setProperty('--len', Math.ceil(p.getTotalLength() + 4)); } catch (e) { /* — */ } });
  showModal('m-result');
  requestAnimationFrame(() => drawRun($('mr-canvas'), g));
  // запись появляется по порядку: лист, вклейка, штампы по одному, подписи. Клик по листу — всё сразу
  const T = FEEL.journal, timers = [], at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const stamps = [...m.querySelectorAll('.jr-st[data-k]')], me = m.querySelector('.jr-me'), boss = m.querySelector('.jr-boss'), chart = m.querySelector('.mr-chart');
  Snd.cue('paper'); r.success ? Snd.win() : Snd.lose();
  at(T.paste, () => { chart.classList.add('pasted'); Snd.cue('paper'); });
  stamps.forEach((s, k) => at(T.stamps + k * T.stampGap, () => { s.classList.add('on'); Snd.cue('stamp'); }));
  const sigAt = T.stamps + stamps.length * T.stampGap + T.sign;
  [me, boss].forEach((el, k) => { el.style.visibility = 'hidden'; at(sigAt + k * T.signGap, () => { el.style.visibility = ''; el.classList.add('draw'); for (let i = 0; i < 4; i++) setTimeout(() => Snd.cue('pen', { v: .6 }), i * 120); }); });
  const all = () => { timers.forEach(clearTimeout); chart.classList.remove('pasted'); stamps.forEach(s => s.classList.add('on')); [me, boss].forEach(el => { el.style.visibility = ''; el.classList.remove('draw'); }); m.removeEventListener('pointerdown', all); };
  m.addEventListener('pointerdown', all);
  at(sigAt + 2 * T.signGap + 800, () => m.removeEventListener('pointerdown', all));
}

/* ---------- верхняя полоса и наставник ---------- */
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function renderTop(g) {
  const gc = g.goalCfg, st = g.status || g.goalStatus(), waiting = !!gc.after && g.happened[gc.after] == null;
  setText($('goal-label'), waiting && gc.waitLabel ? gc.waitLabel : gc.label);
  let cnt, frac;

  else if (gc.type === 'hold') { frac = g.prog / gc.time; cnt = `${Math.floor(g.prog)} из ${gc.time} с`; }
  else if (gc.type === 'schedule') { const tg = g.goalTarget(); frac = g.m.inBandTime / tg; cnt = `в норме ${Math.floor(g.m.inBandTime)} из ${Math.ceil(tg)} с`; }

  const n = waiting ? 0 : Math.min(10, Math.floor(clamp(frac, 0, 1) * 10 + 1e-6));

  if (UI.goalOk !== okc) { $('goal-okl').className = 'lmp' + (okc ? ' ' + okc : ''); UI.goalOk = okc; }
  $('goal').classList.toggle('ok', !waiting && st.ok);

/* ---------- подсказки при наведении и тапе ---------- */
const Tip = { timer: 0, hideT: 0, cur: null };
function tipFor(el) {
  if (el.classList.contains('cover')) { const gp = el.parentElement.dataset.g; return [el.dataset.niche ? 'Пустое гнездо' : 'Прибор ещё не установлен', `Здесь будет: ${GROUP_NAMES[gp] || 'новый прибор'}. Ввод в работу — смена ${unlockLevelOf(gp)}.`]; }
  const k = el.dataset.tip; if (!k) return null;
  if (k.startsWith('shift:')) { const i = +k.slice(6); return ['Смена закрыта', `Откроется, когда сдашь смену ${LEVELS[i - 1].num}.`]; }
  if (k === 'hard:locked') return ['Без страховки', 'Смена без автоматики защиты: реактор не заглушит себя сам. Пломбу снимут, когда сдашь все девять смен.'];
  if (k === 'hard:open') return ['Без страховки', 'Автоматика защиты отключена: реактор не заглушит себя сам. Подними крышку и нажми кнопку.'];
  if (k.startsWith('lamp:')) { const L = LAMPS.find(x => x.id === k.slice(5)); return L ? [L.full || L.label, L.tip] : null; }   // на окне табло надпись короткая, в подсказке — полная
  if (k.startsWith('chart:')) { const d = CHARTS[k.slice(6)]; return d ? [d.title, `${d.look} Лента — последние 60 секунд: видно не только где ты сейчас, но и куда всё движется.`] : null; }
  return UI_TIPS[k] || null;
}
function showTip(el) {
  const c = tipFor(el); if (!c) return;
  const keys = c[2] ? `<span class="tip-keys">клавиша ${c[2].map(k => `<kbd class="kc">${k}</kbd>`).join(' или ')}</span>` : '';
  const t = $('tooltip'); t.innerHTML = `<b>${c[0]}</b>${c[1]}${keys}`; t.classList.add('show'); Tip.cur = el;
  const r = el.getBoundingClientRect(), tw = t.offsetWidth, th = t.offsetHeight;
  const x = clamp(r.left + r.width / 2 - tw / 2, 8, Math.max(8, innerWidth - tw - 8));
  let y = r.top - th - 10; if (y < 8) y = Math.min(innerHeight - th - 8, r.bottom + 10);
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTip() { clearTimeout(Tip.timer); clearTimeout(Tip.hideT); const t = $('tooltip'); if (t) t.classList.remove('show'); Tip.cur = null; }
const tipTarget = e => (e.target && e.target.closest) ? e.target.closest('[data-tip], .cover') : null;
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const el = tipTarget(e); if (el === Tip.cur) return;
  clearTimeout(Tip.timer); if (Tip.cur) hideTip(); if (!el || UI.modal) return;
  Tip.timer = setTimeout(() => showTip(el), 450);
});
document.addEventListener('pointerout', e => {
  if (e.pointerType !== 'mouse') return;
  const el = tipTarget(e); if (!el || (e.relatedTarget && el.contains(e.relatedTarget))) return;
  clearTimeout(Tip.timer); if (Tip.cur === el) hideTip();
});
document.addEventListener('pointerdown', e => {
  Snd.init();
  if (e.pointerType === 'mouse') { hideTip(); return; }
  const el = tipTarget(e); hideTip(); if (!el || UI.modal) return;
  showTip(el); Tip.hideT = setTimeout(hideTip, 2600);
}, true);

/* ---------- ввод ---------- */
let keyRod = 0;
function releaseKeys() { keyRod = 0; $('btn-up').classList.remove('pressed'); $('btn-down').classList.remove('pressed'); }
function flashPause() { const b = $('gl-pz'); if (!b) return; b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }   // на паузе орган не работает — подсказка паузы мигает
function canAct(gp) {
  const g = UI.game;
  if (!g || UI.mode !== 'play' || g.done) return false;
  if (UI.paused) { Snd.deny(); flashPause(); return false; }
  if (!g.open.has(gp)) return false;
  if (Guide.steps) Guide.act(gp);                          // показ: игрок сделал действие — свет возвращается, физика идёт
  return true;
}
function bindHold(btn, dir) {
  const press = () => { if (!canAct('rods')) return false; btn.classList.add('pressed'); UI.game.rodPress(dir); Snd.click(); return true; };
  const up = () => { if (!btn.classList.contains('pressed')) return; btn.classList.remove('pressed'); Snd.cue('buttonUp'); if (UI.game) UI.game.rodRelease(); };
  btn.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); if (press()) { try { btn.setPointerCapture(e.pointerId); } catch (_) { /* не критично */ } } });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, up));
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); if (!e.repeat) press(); } });
  btn.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); up(); } });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
function bindRepeat(btn, gp, fn) {
  let t1 = 0, t2 = 0; btn.classList.add('rep');
  const stop = () => { clearTimeout(t1); clearInterval(t2); if (btn.classList.contains('pressed')) { btn.classList.remove('pressed'); Snd.cue('buttonUp'); } };
  btn.addEventListener('pointerdown', e => {
    if (e.button > 0) return; e.preventDefault(); if (!canAct(gp)) return;
    try { btn.setPointerCapture(e.pointerId); } catch (_) { /* не критично */ }
    btn.classList.add('pressed'); fn(false); Snd.cue('button');
    t1 = setTimeout(() => { t2 = setInterval(() => { if (UI.mode === 'play' && !UI.paused && UI.game && !UI.game.done) fn(true); else stop(); }, 110); }, 420);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); if (!canAct(gp)) return; fn(e.repeat); if (!e.repeat) Snd.click(); } });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
// громкость: положение фейдера → громкость по квадрату (середина звучит «вдвое тише», а не почти беззвучно)
function bindVolume() {
  const panel = $('vol-panel'), btn = $('btn-vol'), toPos = g => Math.round(Math.sqrt(Math.max(0, g)) * 100), toGain = x => (x / 100) * (x / 100);
  const show = open => { panel.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false'); btn.classList.toggle('sel', open); };
  const sync = () => { const v = Snd.volumes(); panel.querySelectorAll('input').forEach(i => { i.value = toPos(v[i.dataset.vol]); i.nextElementSibling.textContent = i.value + '%'; }); };

  panel.addEventListener('click', e => e.stopPropagation());
  panel.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') { show(false); btn.focus(); } });   // стрелки двигают фейдер, а не стержни
  panel.querySelectorAll('input').forEach(i => {
    i.addEventListener('input', () => { i.nextElementSibling.textContent = i.value + '%'; Snd.setVolumes({ [i.dataset.vol]: toGain(+i.value) }); });
    i.addEventListener('change', () => { if (i.dataset.vol === 'alarms') Snd.cue('button'); });   // отпустил — слышно, как теперь звучит пульт
  });
  document.addEventListener('click', () => show(false));

}

const KEY_ROD = { ArrowUp: 1, KeyW: 1, ArrowDown: -1, KeyS: -1 };

/* ---------- окно в город (П3): посёлок за станцией. Свет в окнах — мощность в сеть ----------

const Win = {

  // доля горящих окон: выдача в сеть × час ночи (вечером окон больше, глубокой ночью люди спят); сети нет — темно
  target(g) {
    const s = g.s, W = FEEL.window;
    if (!s.offsite) return { lit: W.dark, streets: 0 };
    const out = clamp(s.mwe / W.fullMw, 0, 1), c = g.level.clock;
    const h = c ? ((c.start + g.t * c.minPerSec) / 60) % 24 : null;
    const awake = h == null ? W.awake.night : h >= 17 && h < 22 ? W.awake.evening : h >= 22 ? W.awake.late : h < 5 ? W.awake.deep : W.awake.morning;
    return { lit: W.base + (1 - W.base) * out * awake, streets: out > .02 ? .25 + .7 * out : .05 };
  },
  update(g, now) {
    const cv = $('win-town'); if (!cv || !cv.clientWidth) return;
    const tg = this.target(g), q = Math.round(tg.lit * 40) / 40, sq = Math.round(tg.streets * 10) / 10;
    if ((q === this.lit && sq === this.streets && !this.dirty) || now - this.t < 1000 / FEEL.window.maxHz) return;
    this.lit = q; this.streets = sq; this.t = now; this.dirty = false; this.paint(cv);
  },
  // панорама посёлка шире окна; в окно попадает кусок с водонапорной башней и домами
  paint(cv) {
    const W = cv.clientWidth, H = cv.clientHeight, c = sceneCanvas(cv, W, H), P = H * FEEL.window.zoom * FEEL.window.pan;
    c.x.scale(c.d, c.d); const off = P * FEEL.window.look - W * .55;
    const Z = FEEL.window.zoom, HV = H * Z, dy = HV - H;
    c.x.save(); c.x.translate(-off, -dy); Town.paint(c.x, P, HV, { lit: this.lit, streets: this.streets, horizon: FEEL.window.horizon, seed: 2207, dark: true }); c.x.restore();
    const r = $('win-red'), [rx, ry] = Town.redAt || [0, 0];
    if (r) { r.style.left = `calc(.55rem + ${Math.round(rx - off)}px)`; r.style.top = `calc(.55rem + ${Math.round(ry - dy)}px)`; r.style.display = rx - off > 0 && rx - off < W ? '' : 'none'; }
  },
  resize() { this.dirty = true; this.t = 0; },
};

/* =====================================================================
   ВХОД В ИГРУ (полишинг, П2): заставки → дверь → вступление → подпись → зал. Повторно: дверь → график смен.
   Сцены живут в #scene поверх пульта; UI.mode = имя сцены, звук — пресет SOUND.modes. Числа — FEEL.entry.
   Рисованное — canvas один раз под размер экрана; живое — только то, что двигается.
   ===================================================================== */
const Scenes = {
  cur: null, name: null, timers: [],
  later(fn, ms) { const id = setTimeout(fn, ms); this.timers.push(id); return id; },
  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; },
  go(name, opts = {}) {
    if (typeof hideTip === 'function') hideTip();
    this.clearTimers(); Snd.forceMode = null;
    if (this.cur && this.cur.exit) { try { this.cur.exit(); } catch (e) { /* сцена не мешает следующей */ } }
    const root = this.fresh(); root.hidden = false; root.className = 'scene sc-' + name;
    this.name = name; this.cur = SCENES[name];
    hideModal(); UI.mode = name; UI.running = false; UI.paused = false;
    $('app').classList.add('menu-mode');
    this.cur.enter(root, opts);
  },
  close() {
    this.clearTimers(); Snd.forceMode = null;
    if (this.cur && this.cur.exit) { try { this.cur.exit(); } catch (e) { /* — */ } }
    this.cur = null; this.name = null; const r = this.fresh(); r.hidden = true; r.className = 'scene';
  },
  // новый пустой корень сцены: обработчики прошлой сцены (на корне — пропуск заставки, шаг в проём) не доживают до следующей
  fresh() { const old = $('scene'), r = old.cloneNode(false); old.replaceWith(r); return r; },
  resize() { if (this.cur && this.cur.resize) { try { this.cur.resize(); } catch (e) { console.error(e); } } },
};

// порядок сцен входа
const Entry = {
  start() { Scenes.go('splash'); },
  afterSplash() { Scenes.go('door'); },
  afterDoor() { if (!Save.data.introSeen) Scenes.go('intro'); else Scenes.go('shifts'); },
  afterIntro(replay) { Scenes.go('sign', { replay }); },
  // первый раз — сразу в зал на смену 1; «Вступление заново» — обратно к графику смен
  afterSign() { const first = !Save.data.introSeen; Save.data.introSeen = true; Save.save(); if (first) { Scenes.close(); startLevel(0, false, { hall: true }); } else Scenes.go('shifts'); },
};

// дата на бланке и в журнале — по-русски, месяц в родительном падеже
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
// неразборчивый текст бланка: слова-«рыба» из слогов; при таком кегле это фактура, а не текст
function greek(n, seed) {
  const r = Tex.rng(seed), syl = ['ни', 'ра', 'то', 'ве', 'ло', 'ста', 'про', 'же', 'ний', 'ова', 'ния', 'ски', 'при', 'вы', 'ре', 'пол', 'ти', 'мо', 'ка', 'ен'];
  let s = ''; for (let i = 0; i < n; i++) { let w = ''; const k = 1 + Math.floor(r() * 4); for (let j = 0; j < k; j++) w += syl[Math.floor(r() * syl.length)]; s += w + (r() < .08 ? ', ' : ' '); }
  return s;
}
// подпись игрока: штрихи в долях строки подписи → SVG-путь (журнал смены, бумаги игры)
function signSVG(sign, w, h, cls = '') {
  if (!sign || !sign.strokes || !sign.strokes.length) return `<svg class="sig ${cls}" viewBox="0 0 ${w} ${h}"><text x="4" y="${h * .75}" style="font: 400 ${h * .6}px var(--f-hand); fill: var(--paper-pen)">стажёр</text></svg>`;
  let d = '';
  for (const st of sign.strokes) {
    if (st.length < 2) { const [px, py] = st[0]; d += `M${(px * w).toFixed(1)} ${(py * h).toFixed(1)}h.5`; continue; }
    // ns-ok: точность координат SVG-пути подписи — не число на экране
    d += `M${(st[0][0] * w).toFixed(1)} ${(st[0][1] * h).toFixed(1)}`;
    for (let i = 1; i < st.length - 1; i++) { const a = st[i], b = st[i + 1]; d += `Q${(a[0] * w).toFixed(1)} ${(a[1] * h).toFixed(1)} ${((a[0] + b[0]) / 2 * w).toFixed(1)} ${((a[1] + b[1]) / 2 * h).toFixed(1)}`; }
  }
  return `<svg class="sig ${cls}" viewBox="0 0 ${w} ${h}" aria-label="Подпись"><path d="${d}" fill="none" stroke="var(--paper-pen)" stroke-width="${(h / 28).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// холст сцены под размер экрана; рисует в «проектных» координатах сцены через k и сдвиг
function sceneCanvas(cv, W, H) {
  const d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * d); cv.height = Math.round(H * d); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  return { x: cv.getContext('2d'), d };
}
// фактура из плиток Tex — узор для заливки в canvas сцены (плитка рисуется один раз и кэшируется)
const ScenePat = {
  cache: new Map(),
  get(x, key, make) { let t = this.cache.get(key); if (!t) { t = make(); this.cache.set(key, t); } return x.createPattern(t, 'repeat'); },
  plaster(x) { return this.get(x, 'plaster', () => Tex.tile(512, 91, { mottle: .38, grain: .18, specks: .006, pores: .004, light: [255, 250, 236], dark: [30, 26, 18] })); },
  steel(x) { return this.get(x, 'steel', () => Tex.tile(256, 92, { mottle: .22, grain: .12, scratch: 30, pores: .002 })); },
  asphalt(x) { return this.get(x, 'asphalt', () => Tex.tile(256, 93, { mottle: .2, grain: .32, specks: .02 })); },
  paper(x) { return this.get(x, 'paper', () => Tex.tile(512, 94, { mottle: .1, grain: .06, fibers: 1300, light: [255, 252, 240], dark: [96, 72, 38] })); },
  wood(x) { return this.get(x, 'wood', () => Tex.tile(256, 95, { brush: .35, grain: .08, light: [255, 226, 186], dark: [20, 10, 4] })); },
};
const fillPat = (x, pat, alpha, path) => { x.save(); x.globalAlpha = alpha; x.fillStyle = pat; path ? x.fill(path) : x.fill(); x.restore(); };

/* ---------- посёлок ночью: фон вступления; в П3 — вид из окна зала. Рисуется один раз под размер ----------
   lit — доля горящих окон (0…1); красные огни трубы и мачт — мельче и темнее сигнального красного (CLAUDE.md, «Окно в город») */
const Town = {
  paint(x, W, H, o = {}) {
    const rnd = Tex.rng(o.seed || 1347), lit = o.lit == null ? 0.42 : o.lit, hz = H * (o.horizon || 0.64), u = H / 900;
    // небо: чёрно-синее, над посёлком — тёплая засветка от фонарей
    let g = x.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#04060B'); g.addColorStop(.7, '#0A101A'); g.addColorStop(1, '#151A22');
    x.fillStyle = g; x.fillRect(0, 0, W, hz + 2);
    g = x.createRadialGradient(W * .66, hz, 0, W * .66, hz, W * .45); g.addColorStop(0, `rgba(150,96,46,${.22 * lit + .05})`); g.addColorStop(1, 'rgba(150,96,46,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, hz);
    for (let i = 0; i < 140; i++) { const sx = rnd() * W, sy = rnd() * hz * .8, a = .15 + rnd() * .5; x.fillStyle = `rgba(220,226,240,${a * (1 - sy / hz)})`; x.fillRect(sx, sy, rnd() < .1 ? 2 : 1, 1); }
    // дальние холмы
    x.fillStyle = '#080B0F'; x.beginPath(); x.moveTo(0, hz);
    for (let px = 0; px <= W; px += W / 24) x.lineTo(px, hz - u * (18 + 26 * Math.sin(px / W * 7 + 1.3) + 14 * Math.sin(px / W * 19)));
    x.lineTo(W, hz); x.closePath(); x.fill();
    // станция слева: реакторное здание, машинный зал, вентиляционная труба
    const sx0 = W * .05, base = hz + u * 6;
    x.fillStyle = '#0B0E12';
    x.fillRect(sx0, base - u * 120, u * 110, u * 120); x.fillRect(sx0 + u * 110, base - u * 70, u * 210, u * 70);
    x.fillRect(sx0 + u * 30, base - u * 150, u * 54, u * 30);
    x.beginPath(); x.moveTo(sx0 + u * 150, base - u * 70); x.lineTo(sx0 + u * 156, base - u * 250); x.lineTo(sx0 + u * 168, base - u * 250); x.lineTo(sx0 + u * 174, base - u * 70); x.closePath(); x.fill();
    const red = (px, py) => { const rg = x.createRadialGradient(px, py, 0, px, py, u * 7); rg.addColorStop(0, 'rgba(176,40,30,.9)'); rg.addColorStop(1, 'rgba(176,40,30,0)'); x.fillStyle = rg; x.fillRect(px - u * 7, py - u * 7, u * 14, u * 14); x.fillStyle = '#B4342A'; x.fillRect(px - u, py - u, u * 2, u * 2); };
    red(sx0 + u * 162, base - u * 252); red(sx0 + u * 162, base - u * 170);
    for (let i = 0; i < 7; i++) { x.fillStyle = `rgba(255,214,150,${.25 + rnd() * .3})`; x.fillRect(sx0 + u * (130 + i * 26), base - u * (40 + (i % 2) * 14), u * 6, u * 3); }   // окна машзала
    // ЛЭП от станции к посёлку
    const masts = [[W * .26, hz + u * 2], [W * .37, hz - u * 4], [W * .48, hz + u * 1]];
    x.strokeStyle = '#11151B'; x.lineWidth = Math.max(1, u * 1.6);
    for (const [mx, my] of masts) { x.beginPath(); x.moveTo(mx - u * 12, my); x.lineTo(mx, my - u * 70); x.lineTo(mx + u * 12, my); x.moveTo(mx - u * 18, my - u * 52); x.lineTo(mx + u * 18, my - u * 52); x.moveTo(mx - u * 14, my - u * 62); x.lineTo(mx + u * 14, my - u * 62); x.stroke(); }
    x.strokeStyle = 'rgba(30,36,44,.9)'; x.lineWidth = Math.max(.6, u * .8);
    const pts = [[sx0 + u * 300, base - u * 60], ...masts.map(([mx, my]) => [mx, my - u * 52]), [W * .58, hz - u * 30]];
    for (const dy of [0, u * 8]) for (let i = 0; i < pts.length - 1; i++) { const [ax, ay] = pts[i], [bx, by] = pts[i + 1]; x.beginPath(); x.moveTo(ax, ay + dy); x.quadraticCurveTo((ax + bx) / 2, Math.max(ay, by) + u * 14 + dy, bx, by + dy); x.stroke(); }
    // посёлок: пятиэтажки, частные дома, водонапорная башня; окна — тёплый свет ламп накаливания
    const win = (wx, wy, w, h) => { const r0 = rnd(), r1 = rnd(), r2 = rnd(), r3 = rnd();   // всегда четыре числа: порог окна не зависит от lit
      if (r0 < lit) { x.fillStyle = r1 < .2 ? 'rgba(210,226,255,.7)' : `rgba(255,${196 + (r2 * 30 | 0)},120,${.65 + r3 * .3})`; x.fillRect(wx, wy, w, h); }
      else if (o.dark) { x.fillStyle = 'rgba(40,46,56,.5)'; x.fillRect(wx, wy, w, h); } };
    let bx = W * .55;
    while (bx < W * 1.02) {
      const tall = rnd() < .55, bw = u * (tall ? 120 + rnd() * 60 : 46 + rnd() * 20), bh = u * (tall ? 92 + rnd() * 10 : 34 + rnd() * 10), by = hz + u * 4 - bh;
      x.fillStyle = tall ? '#0D1015' : '#0F1216'; x.fillRect(bx, by, bw, bh);
      if (tall) { for (let r = 0; r < 5; r++) for (let c = 0; c < Math.floor(bw / (u * 14)); c++) win(bx + u * 5 + c * u * 14, by + u * 8 + r * u * 17, u * 6, u * 8); }
      else { x.beginPath(); x.moveTo(bx - u * 4, by); x.lineTo(bx + bw / 2, by - u * 18); x.lineTo(bx + bw + u * 4, by); x.closePath(); x.fill(); win(bx + u * 10, by + u * 12, u * 9, u * 9); win(bx + bw - u * 20, by + u * 12, u * 9, u * 9); }
      bx += bw + u * (6 + rnd() * 18);
    }
    const tx = W * .8, ty = hz - u * 60;   // водонапорная башня
    x.fillStyle = '#0C0F13'; x.fillRect(tx - u * 22, ty - u * 40, u * 44, u * 34); x.beginPath(); x.moveTo(tx - u * 26, ty - u * 40); x.lineTo(tx, ty - u * 56); x.lineTo(tx + u * 26, ty - u * 40); x.closePath(); x.fill();
    x.fillRect(tx - u * 14, ty - u * 6, u * 6, u * 66); x.fillRect(tx + u * 8, ty - u * 6, u * 6, u * 66);
    red(tx, ty - u * 58); this.redAt = [tx, ty - u * 58];
    // земля и дорога с фонарями
    g = x.createLinearGradient(0, hz, 0, H); g.addColorStop(0, '#07090B'); g.addColorStop(1, '#030405'); x.fillStyle = g; x.fillRect(0, hz + u * 4, W, H - hz);
    for (let i = 0; i < 16; i++) {
      const lx = W * (.3 + i * .05), ly = hz + u * (16 + i * 1.5);
      const rl = rnd(); if (rl < (o.streets != null ? o.streets : .85 * (lit + .3))) { const lg = x.createRadialGradient(lx, ly, 0, lx, ly, u * 26); lg.addColorStop(0, 'rgba(255,170,80,.5)'); lg.addColorStop(1, 'rgba(255,170,80,0)'); x.fillStyle = lg; x.fillRect(lx - u * 26, ly - u * 26, u * 52, u * 52); x.fillStyle = '#FFC27A'; x.fillRect(lx - u, ly - u, u * 2, u * 2); }
    }
  },
};

// стена зала у входа на щит: побелка сверху, масляная краска снизу, светильник над ящиком «График смен» (за кадром сверху)
function paintHallWall(x, W, H) {
  const py = H * .68;
  x.fillStyle = '#6E6B62'; x.fillRect(0, 0, W, py); x.beginPath(); x.rect(0, 0, W, py); fillPat(x, ScenePat.plaster(x), .45);
  x.fillStyle = '#2B3F36'; x.fillRect(0, py, W, H - py); x.beginPath(); x.rect(0, py, W, H - py); fillPat(x, ScenePat.steel(x), .3);
  x.fillStyle = 'rgba(16,22,19,.9)'; x.fillRect(0, py - 3, W, 5);
  const u = Math.min(W, H) / 900;   // кабель-канал от ящика к потолку и короб вдоль стены
  x.fillStyle = '#5E6159'; x.fillRect(W / 2 - 9 * u, 0, 18 * u, H * .3); x.fillStyle = 'rgba(255,255,255,.16)'; x.fillRect(W / 2 - 9 * u, 0, 3 * u, H * .3);
  x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(W / 2 + 7 * u, 0, 2 * u, H * .3);
  let g = x.createRadialGradient(W / 2, -H * .12, 0, W / 2, -H * .12, Math.hypot(W, H) * .78);
  g.addColorStop(0, 'rgba(5,6,6,.08)'); g.addColorStop(.28, 'rgba(5,6,6,.34)'); g.addColorStop(.6, 'rgba(5,6,6,.8)'); g.addColorStop(1, 'rgba(5,6,6,.96)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  g = x.createRadialGradient(W / 2, H * .2, 0, W / 2, H * .2, Math.max(W, H) * .5); g.addColorStop(0, 'rgba(255,226,170,.07)'); g.addColorStop(1, 'rgba(255,226,170,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
}

// вступление: три карточки, одна мысль в каждой, не больше 25 слов (задание 4, 6.4). Материал — машинопись
const INTRO = [
  'Посёлок живёт станцией: свет в окнах, тепло в домах — всё отсюда.',
  'Тем, кто её запускал, за шестьдесят. Скоро они уйдут на пенсию — а смену передать некому.',
  'Ты единственный из посёлка, кто выучился на физика-ядерщика. Сегодня твоя первая ночная смена.',
];

const SCENES = {
  /* ---------- заставки: «for m10» и название; в тишине; клик или клавиша пропускает ---------- */
  splash: {
    enter(root) {
      Snd.forceMode = 'splash';
      // ns-ok: посвящение «for m10» — латиницей и строчными по просьбе автора (задание 4, раздел 6.2)
      root.innerHTML = '<div class="sp-card" id="sp1"><span class="sp-dedic">for m10</span></div>' +
        '<div class="sp-card" id="sp2"><div class="sp-title">Ночная смена</div><div class="sp-sub">лучше в наушниках</div></div>';
      // повторный запуск — заставки короче: длинное при повторе так же длинным не бывает
      const E = FEEL.entry, card = Save.data.introSeen ? E.splashRepeat : E.splashCard;
      const step = (id, t0) => { Scenes.later(() => $(id).classList.add('on'), t0); Scenes.later(() => $(id).classList.remove('on'), t0 + card - E.splashFade); };
      step('sp1', 120); step('sp2', 120 + card);
      Scenes.later(() => Entry.afterSplash(), 120 + 2 * card);
      root.addEventListener('pointerdown', () => Entry.afterSplash(), { once: true });
    },
    key(e) { e.preventDefault(); if (!e.repeat) Entry.afterSplash(); },
  },

  /* ---------- вступление: посёлок ночью и три машинописные карточки; листается кликом, Пробелом, Enter ---------- */
  intro: {
    enter(root, o) {
      Snd.forceMode = 'intro'; this.i = -1; this.replay = !!o.replay;
      root.innerHTML = `<canvas class="in-town"></canvas><div class="in-cards"></div><div class="in-flood"></div>
        <nav class="gl-links gl-right"><button data-a="skip">Пропустить</button></nav>`;
      this.root = root; this.resize();
      root.querySelector('.gl-links').addEventListener('click', e => { e.stopPropagation(); Snd.cue('ui'); this.done(); });
      root.addEventListener('pointerdown', e => { if (!e.target.closest('.gl-links')) this.next(); });
      requestAnimationFrame(() => root.classList.add('in'));   // тёплый свет из проёма гаснет — вокруг ночь
      Scenes.later(() => this.next(), 650);
    },
    key(e) { if (['Space', 'Enter', 'NumpadEnter', 'ArrowRight'].includes(e.code)) { e.preventDefault(); if (!e.repeat) this.next(); } else if (e.code === 'Escape') this.done(); },
    next() {
      const box = this.root.querySelector('.in-cards'); if (this.busy) return;
      if (this.i >= INTRO.length - 1) { this.done(); return; }
      this.i++; this.busy = true; Scenes.later(() => { this.busy = false; }, 260);
      const old = box.querySelector('.in-card.on'); if (old) { old.classList.remove('on'); old.classList.add('off'); Scenes.later(() => old.remove(), 400); }
      const c = document.createElement('div'); c.className = 'in-card'; c.style.setProperty('--tilt', [-.8, .6, -.4][this.i] + 'deg');
      c.innerHTML = `<p>${INTRO[this.i]}</p><span class="in-n">${this.i + 1} из ${INTRO.length}</span>`;
      box.appendChild(c); requestAnimationFrame(() => requestAnimationFrame(() => c.classList.add('on')));
      Snd.cue('paper');
    },
    done() { if (this.gone) return; this.gone = true; Entry.afterIntro(this.replay); },
    exit() { this.gone = false; this.busy = false; },
    resize() { const W = innerWidth, H = innerHeight, c = sceneCanvas(this.root.querySelector('.in-town'), W, H); c.x.scale(c.d, c.d); Town.paint(c.x, W, H, { lit: .42 }); },
  },

  /* ---------- подпись: первый отдел, стол под настольной лампой, обязательство и инструкция ----------
     Расписываешься мышью, тачпадом или пальцем прямо на бланке. «Сдать» — штамп «ДОПУЩЕН», лист уходит в папку. */
  sign: {
    enter(root, o) {
      Snd.forceMode = 'sign'; this.replay = !!o.replay; this.strokes = []; this.len = 0; this.done = false;
      const d = new Date(), date = `«${d.getDate()}»&nbsp;${MONTHS_GEN[d.getMonth()]}&nbsp;${d.getFullYear()}&nbsp;г.`;
      root.innerHTML = `<canvas class="sg-desk"></canvas>
        <div class="sg-pen" aria-hidden="true"></div>
        <div class="sg-papers">
          <div class="sg-doc2" aria-hidden="true"><div class="sg-h">ДОЛЖНОСТНАЯ ИНСТРУКЦИЯ</div><div class="sg-h2">оператора-стажёра блочного щита управления энергоблока № 1</div><div class="sg-greek">${greek(120, 7)}</div></div>
          <div class="sg-doc">
            <div class="sg-top"><span class="sg-form">Форма № 7-ОТ</span><span class="sg-grif">Для служебного пользования<br>Экз. № 2</span></div>
            <div class="sg-h">ОБЯЗАТЕЛЬСТВО</div>
            <div class="sg-h2">о неразглашении сведений, ставших известными по работе</div>
            <div class="sg-fill">Я, принимаемый на должность <span class="tw">оператора-стажёра БЩУ энергоблока №&nbsp;1</span>, обязуюсь:</div>
            <div class="sg-greek">${greek(260, 11)}</div>
            <div class="sg-greek">${greek(150, 13)}</div>
            <div class="sg-bottom"><span class="tw">${date}</span><span class="sg-sigl">Подпись <span class="sg-sig" title="Распишись здесь"><canvas></canvas><i class="sg-x">× здесь</i></span></span></div>
            <div class="sg-stamp" aria-hidden="true">ДОПУЩЕН</div>
          </div>
          <div class="sg-folder" aria-hidden="true"><span>ЛИЧНОЕ ДЕЛО</span></div>
        </div>
        <div class="sg-actions"><button class="btn sg-erase" disabled>Стереть</button><button class="btn primary big sg-ok" disabled>Сдать</button></div>`;
      this.root = root;
      const area = root.querySelector('.sg-sig'), cv = area.querySelector('canvas');
      this.cv = cv; this.area = area; this.resize();
      area.addEventListener('pointerenter', () => root.classList.add('pen-up'));    // ручку взяли со стола: курсор — перо
      area.addEventListener('pointerleave', () => { if (!this.drawing) root.classList.remove('pen-up'); });
      area.addEventListener('pointerdown', e => this.down(e));
      area.addEventListener('pointermove', e => this.move(e));
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => area.addEventListener(ev, () => this.up()));
      root.querySelector('.sg-erase').addEventListener('click', () => { Snd.cue('paper'); this.clear(); });
      root.querySelector('.sg-ok').addEventListener('click', () => this.submit());
    },
    key(e) { if ((e.code === 'Enter' || e.code === 'NumpadEnter') && !this.root.querySelector('.sg-ok').disabled) { e.preventDefault(); this.submit(); } },
    pt(e) { const r = this.cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, performance.now()]; },
    down(e) {
      if (this.done || e.button > 0) return; e.preventDefault(); Snd.init();
      try { this.area.setPointerCapture(e.pointerId); } catch (_) { /* — */ }
      this.drawing = true; this.cur = [this.pt(e)]; this.strokes.push(this.cur); this.root.classList.add('signing');
      this.lastSnd = 0; this.dot(this.cur[0]);
    },
    move(e) {
      if (!this.drawing) return;
      const p = this.pt(e), a = this.cur[this.cur.length - 1], r = this.cv.getBoundingClientRect();
      const dx = (p[0] - a[0]) * r.width, dy = (p[1] - a[1]) * r.height, dist = Math.hypot(dx, dy), dt = Math.max(1, p[2] - a[2]);
      if (dist < 1.5) return;
      const v = dist / dt;                                   // px/мс: быстрее — тоньше, скрип выше
      this.seg(a, p, v); this.cur.push(p); this.len += dist;
      if (p[2] - this.lastSnd > 38) { this.lastSnd = p[2]; Snd.cue('pen', { v: Math.min(1, v / 1.6) }); }
      if (this.len > r.width * .12) { this.root.querySelector('.sg-ok').disabled = false; this.root.querySelector('.sg-ok').classList.add('lit'); }
      this.root.querySelector('.sg-erase').disabled = false;
    },
    up() { if (!this.drawing) return; this.drawing = false; this.cur = null; },
    ctx2() { const x = this.cv.getContext('2d'); x.setTransform(this.k, 0, 0, this.k, 0, 0); x.strokeStyle = '#2F3A8F'; x.fillStyle = '#2F3A8F'; x.lineCap = 'round'; x.lineJoin = 'round'; return x; },
    dot(p) { const x = this.ctx2(), r = this.cv.getBoundingClientRect(); x.beginPath(); x.arc(p[0] * r.width, p[1] * r.height, 1.1, 0, 7); x.fill(); },
    seg(a, b, v) {
      const x = this.ctx2(), r = this.cv.getBoundingClientRect(), w = Math.max(.9, Math.min(2.7, 2.7 - v * 1.1)) * (r.height / 60);
      x.globalAlpha = .9; x.lineWidth = w; x.beginPath(); x.moveTo(a[0] * r.width, a[1] * r.height); x.lineTo(b[0] * r.width, b[1] * r.height); x.stroke();
    },
    clear() { this.strokes = []; this.len = 0; const x = this.cv.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, this.cv.width, this.cv.height);
      this.root.classList.remove('signing'); const ok = this.root.querySelector('.sg-ok'); ok.disabled = true; ok.classList.remove('lit'); this.root.querySelector('.sg-erase').disabled = true; },
    submit() {
      if (this.done || this.len <= 0) return; this.done = true;
      // подпись — в доли строки, с прореживанием: в сохранении остаётся форма, а не каждая точка
      Save.data.sign = { strokes: this.strokes.map(st => st.filter((p, i) => i === 0 || i === st.length - 1 || i % 2 === 0).map(([px, py]) => [Math.round(px * 1000) / 1000, Math.round(py * 1000) / 1000])) };
      Save.save();
      this.root.classList.add('stamped'); Snd.cue('stamp');
      Scenes.later(() => { this.root.classList.add('filed'); Snd.cue('folder'); }, 900);
      Scenes.later(() => this.root.classList.add('leave'), 1700);
      Scenes.later(() => Entry.afterSign(), 2300);
    },
    resize() {
      const W = innerWidth, H = innerHeight, c = sceneCanvas(this.root.querySelector('.sg-desk'), W, H); c.x.scale(c.d, c.d); this.paintDesk(c.x, W, H);
      const r = this.cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
      this.k = d; this.cv.width = Math.round(r.width * d); this.cv.height = Math.round(r.height * d);
      for (const st of this.strokes) { if (st.length === 1) this.dot(st[0]); for (let i = 1; i < st.length; i++) this.seg(st[i - 1], st[i], .6); }
    },
    // стол под настольной лампой: тёмный кабинет, тёплое пятно на бумагах, абажур в углу кадра
    paintDesk(x, W, H) {
      x.fillStyle = '#0B0A09'; x.fillRect(0, 0, W, H);
      x.fillStyle = '#2A1C12'; x.fillRect(0, 0, W, H); x.beginPath(); x.rect(0, 0, W, H); fillPat(x, ScenePat.wood(x), .55);
      const cx = W * .5, cy = H * .5, R = Math.max(W, H) * .62;
      let g = x.createRadialGradient(cx - W * .06, cy - H * .08, 0, cx, cy, R);
      g.addColorStop(0, 'rgba(255,214,150,.22)'); g.addColorStop(.35, 'rgba(10,6,3,.12)'); g.addColorStop(.7, 'rgba(6,4,2,.7)'); g.addColorStop(1, 'rgba(4,3,2,.95)');
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      // абажур настольной лампы в левом верхнем углу: изнутри светится
      x.save(); x.translate(W * .1, -H * .02); x.rotate(.35);
      x.fillStyle = '#1F2A22'; x.beginPath(); x.ellipse(0, 0, W * .14, H * .12, 0, 0, Math.PI); x.fill();
      g = x.createRadialGradient(0, 0, 0, 0, 0, W * .13); g.addColorStop(0, 'rgba(255,244,214,.95)'); g.addColorStop(.6, 'rgba(255,214,150,.35)'); g.addColorStop(1, 'rgba(255,214,150,0)');
      x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, W * .13, H * .04, 0, 0, 7); x.fill(); x.restore();
    },
    exit() { this.drawing = false; },
  },

  /* ---------- пульт «График смен» (задание 4, 6.6): стальной ящик на стене зала ----------
     Девять кнопок: открытая смена — колпачок светится, следующая — ярче всех. Закрытая — тёмная, нажатие — глухой упор.
     Один клик по светящейся кнопке — брифинг. Клавиши: 1–9 — смена, Enter — следующая, Esc — к двери. */
  shifts: {
    enter(root) {
      Snd.forceMode = 'shifts'; this.busy = false; this.pd = 0;
      const hardIdx = LEVELS.findIndex(l => l.hidden), hardOpen = hardIdx >= 0 && Save.playable(hardIdx);
      const next = LEVELS.findIndex((l, i) => !l.hidden && Save.playable(i) && !Save.stars(i));
      this.hardIdx = hardIdx; this.hardOpen = hardOpen; this.next = next;
      let cells = '';
      LEVELS.forEach((lv, i) => {
        if (lv.hidden) return;
        const ok = Save.playable(i), st = Save.stars(i), cls = !ok ? 'dead' : i === next ? 'lit next' : 'lit';
        const say = ok ? (st ? `, сдана, звёзд: ${st} из 3` : ', не сдана') : ', закрыта';
        cells += `<div class="gs-cell${ok ? '' : ' locked'}">`
          + `<button class="btn gs-b ${cls}" data-lv="${i}"${ok ? '' : ` aria-disabled="true" data-tip="shift:${i}"`} aria-label="Смена ${lv.num}: ${lv.title}${say}">${lv.num}</button>`
          + `<span class="gs-stars" aria-hidden="true">${[0, 1, 2].map(k => `<i class="lmp${k < st ? ' mlk' : ''}"></i>`).join('')}</span>`
          + `<span class="gs-plate">${lv.title}</span></div>`;
      });
      root.innerHTML = `<canvas class="gs-bg"></canvas>
        <div class="gs-box hf" role="group" aria-label="График смен">
          <div class="gs-title">График смен</div>
          <div class="gs-sub">Энергоблок 1 · БЩУ</div>
          <div class="gs-grid">${cells}</div>
          <div class="gs-hard${hardOpen ? ' broken' : ' locked'}">
            <div class="gs-hw" data-tip="hard:${hardOpen ? 'open' : 'locked'}">
              <button class="btn gs-hb" aria-label="Без страховки" tabindex="-1"></button>
              <button class="gs-cov" aria-label="${hardOpen ? 'Поднять крышку «Без страховки»' : 'Без страховки: закрыто пломбой'}"></button>
              <span class="gs-seal"></span>
            </div>
            <span class="gs-plate">Без страховки</span>
          </div>
        </div>
        <nav class="gl-links" aria-label="Слой игры"><button data-a="settings">Настройки</button><button data-a="door">К двери</button></nav>`;
      this.root = root; this.resize();
      const grid = root.querySelector('.gs-grid');
      grid.addEventListener('pointerdown', e => {
        const b = e.target.closest('.gs-b'); if (!b || e.button > 0) return; Snd.init(); this.pd = performance.now();
        if (b.classList.contains('dead')) { e.preventDefault(); Snd.deny(); } else Snd.cue('button');
      });
      grid.addEventListener('click', e => { const b = e.target.closest('.gs-b'); if (b) this.press(+b.dataset.lv); });
      const cov = root.querySelector('.gs-cov'), hb = root.querySelector('.gs-hb');
      cov.addEventListener('click', () => this.cover());
      hb.addEventListener('pointerdown', e => { if (e.button > 0) return; Snd.init(); this.pd = performance.now(); Snd.cue('bigButton'); });
      hb.addEventListener('click', () => { if (this.covOpen) this.go(this.hardIdx); });
      root.querySelector('.gl-links').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return; Snd.init(); Snd.cue('ui');
        if (b.dataset.a === 'settings') Scenes.go('settings', { back: 'shifts' }); else Scenes.go('door');
      });
      const first = root.querySelector('.gs-b.next') || root.querySelector('.gs-b.lit');
      setTimeout(() => { try { if (first) first.focus({ preventScroll: true }); } catch (_) { /* — */ } }, 60);
    },
    // нажатие кнопки смены: закрытая — глухой упор (с клавиатуры тоже), открытая — в зал
    press(i) {
      const ok = Save.playable(i), kbd = performance.now() - this.pd > 400;
      if (!ok) { if (kbd) Snd.deny(); return; }
      if (kbd) Snd.cue('button');
      this.go(i);
    },
    go(i) {
      if (this.busy) return; this.busy = true;
      Scenes.later(() => { Scenes.close(); startLevel(i, false, { hall: true }); }, 160);   // кнопка успела вернуться — и мы в зале
    },
    // крышка «Без страховки»: на пломбе — глухой упор; пломба сорвана — крышка поднимается, через 6 с падает сама
    cover() {
      Snd.init();
      if (!this.hardOpen) { Snd.deny(); return; }
      if (this.covOpen) return;
      this.covOpen = true; this.root.querySelector('.gs-hard').classList.add('open'); Snd.cover();
      const hb = this.root.querySelector('.gs-hb'); hb.tabIndex = 0; setTimeout(() => { try { hb.focus({ preventScroll: true }); } catch (_) { /* — */ } }, 60);
      Scenes.later(() => { this.covOpen = false; hb.tabIndex = -1; this.root.querySelector('.gs-hard').classList.remove('open'); Snd.cue('coverClose'); }, 6000);
    },
    key(e) {
      if (e.code === 'Escape') { e.preventDefault(); Snd.cue('ui'); Scenes.go('door'); return; }
      const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
      if (m && !e.repeat) {
        const i = LEVELS.findIndex(l => !l.hidden && l.num === +m[1]); if (i < 0) return;
        e.preventDefault(); Snd.init(); this.pd = 0;
        const b = this.root.querySelector(`.gs-b[data-lv="${i}"]`);
        if (b && Save.playable(i)) { b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 110); }
        this.press(i); return;
      }
      if ((e.code === 'Enter' || e.code === 'NumpadEnter') && !e.repeat && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#scene button'))) {
        e.preventDefault(); if (this.next >= 0) { this.pd = 0; this.press(this.next); }
      }
    },
    resize() { const W = innerWidth, H = innerHeight, c = sceneCanvas(this.root.querySelector('.gs-bg'), W, H); c.x.scale(c.d, c.d); paintHallWall(c.x, W, H); },
  },

  /* ---------- настройки — слой игры (задание 4, раздел 14): громкость, комфорт, вступление, сброс ---------- */
  settings: {
    enter(root, o) {
      Snd.forceMode = 'settings'; this.back = o.back || 'door';
      const c = Save.data.comfort, v = Snd.volumes(), pos = g => Math.round(Math.sqrt(Math.max(0, g)) * 100);
      const seg = (key, opts) => `<div class="st-seg" role="radiogroup" data-k="${key}">${opts.map(([val, t]) =>
        `<button role="radio" data-v="${val}" aria-checked="${String(c[key]) === String(val)}" class="${String(c[key]) === String(val) ? 'on' : ''}">${t}</button>`).join('')}</div>`;
      const vol = [['master', 'Общая'], ['alarms', 'Тревоги и пульт'], ['station', 'Станция']];
      root.innerHTML = `<div class="st-sheet" role="dialog" aria-label="Настройки">
          <h2>Настройки</h2>
          <h3>Звук</h3>
          <div class="st-row"><span>Звук</span><div class="st-seg" role="radiogroup" data-k="sound"><button role="radio" data-v="true" class="${Snd.on ? 'on' : ''}">вкл</button><button role="radio" data-v="false" class="${Snd.on ? '' : 'on'}">выкл</button></div></div>
          ${vol.map(([k, t]) => `<label class="st-row"><span>${t}</span><input type="range" min="0" max="100" step="1" data-vol="${k}" value="${pos(v[k])}"><output>${pos(v[k])}%</output></label>`).join('')}
          <h3>Комфорт</h3>
          <div class="st-row"><span>Тряска</span>${seg('shake', [['full', 'полная'], ['weak', 'слабая'], ['off', 'выключена']])}</div>
          <div class="st-row"><span>Вспышки</span>${seg('flash', [[true, 'вкл'], [false, 'выкл']])}</div>
          <div class="st-row"><span>Мерцание света</span>${seg('flicker', [[true, 'вкл'], [false, 'выкл']])}</div>
          <p class="st-note">Новые тревоги мигают всегда: это информация, а не украшение.</p>
          <div class="st-links gl-links"><button data-a="intro">Показать вступление снова</button><button data-a="reset">Сбросить прогресс</button></div>
          <div class="st-foot"><button class="st-back" data-a="back">Готово</button></div>
        </div>`;
      this.root = root;
      root.querySelectorAll('.st-seg').forEach(sg => sg.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return; Snd.init();
        const k = sg.dataset.k, raw = b.dataset.v, val = raw === 'true' ? true : raw === 'false' ? false : raw;
        if (k === 'sound') { Snd.setOn(val); if (typeof updateSoundUI === 'function') updateSoundUI(); }
        else { Save.data.comfort[k] = val; Save.save(); }
        sg.querySelectorAll('button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
        Snd.cue('ui');
      }));
      root.querySelectorAll('input[data-vol]').forEach(i => {
        i.addEventListener('input', () => { i.nextElementSibling.textContent = i.value + '%'; Snd.setVolumes({ [i.dataset.vol]: (i.value / 100) * (i.value / 100) }); });
        i.addEventListener('change', () => { Snd.init(); Snd.cue(i.dataset.vol === 'station' ? 'ui' : 'button'); });   // отпустил — слышно, как теперь звучит
      });
      root.querySelector('.st-sheet').addEventListener('click', e => {
        const b = e.target.closest('[data-a]'); if (!b) return; Snd.init();
        if (b.dataset.a === 'back') { Snd.cue('ui'); Scenes.go(this.back); }
        else if (b.dataset.a === 'intro') { Snd.cue('ui'); Scenes.go('intro', { replay: true }); }
        else if (b.dataset.a === 'reset') {
          Snd.cue('ui');
          if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Точно сбросить? Нажми ещё раз'; return; }
          Save.reset(); delete b.dataset.armed; b.textContent = 'Прогресс сброшен'; this.back = 'door';
        }
      });
      setTimeout(() => { try { root.querySelector('.st-back').focus({ preventScroll: true }); } catch (_) { /* — */ } }, 60);
    },
    key(e) { if (e.code === 'Escape') { e.preventDefault(); Snd.cue('ui'); Scenes.go(this.back); } },
  },

  /* ---------- дверь служебного входа — главное меню ----------
     Ночь. Над дверью лампа в решётке — единственный ключевой свет. Звонок звенит, пока держат кнопку; отпустил —
     зуммер замка, щелчок ригеля, дверь подаётся с рывком, из проёма тёплый свет и гул; шаг в проём — следующая сцена. */
  door: {
    CORE: { x: 588, y: 84, w: 690, h: 770 },   // что обязано помещаться на любом экране: лампа, дверь, звонок, надпись
    enter(root) {
      Snd.forceMode = 'door'; this.state = 'idle';
      root.innerHTML = `<div class="door-world">
          <canvas class="door-bg"></canvas>
          <div class="door-stage">
            <div class="door-in"></div>
            <div class="door-leaf"><canvas></canvas></div>
            <div class="door-spill"></div>
            <button class="door-bell" aria-label="Звонок: начать игру"><i></i></button>
          </div>
        </div>
        <div class="door-flood"></div>
        <nav class="gl-links" aria-label="Настройки игры">
          <button data-a="settings">Настройки</button><button data-a="intro">Вступление заново</button><button data-a="reset">Сбросить прогресс</button>
        </nav>`;
      this.root = root; this.world = root.querySelector('.door-world'); this.stage = root.querySelector('.door-stage');
      this.resize();
      const bell = root.querySelector('.door-bell');
      bell.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); try { bell.setPointerCapture(e.pointerId); } catch (_) { /* — */ } this.press(); });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => bell.addEventListener(ev, () => this.release()));
      bell.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); e.stopPropagation(); this.press(); } });
      bell.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); this.release(); } });
      root.querySelector('.gl-links').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return; Snd.init(); Snd.cue('ui');
        if (b.dataset.a === 'settings') Scenes.go('settings', { back: 'door' });
        else if (b.dataset.a === 'intro') Scenes.go('intro', { replay: true });
        else if (b.dataset.a === 'reset') {
          if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Точно сбросить? Ещё раз'; return; }
          Save.reset(); b.textContent = 'Прогресс сброшен'; delete b.dataset.armed;
        }
      });
      root.addEventListener('pointerdown', e => { if (this.state === 'open' && !e.target.closest('.gl-links')) this.skip(); });
      setTimeout(() => { try { bell.focus({ preventScroll: true }); } catch (_) { /* — */ } }, 60);
    },
    key(e) {
      if (this.state === 'open') { e.preventDefault(); this.skip(); return; }
      if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat && document.activeElement !== this.root.querySelector('.door-bell')) { e.preventDefault(); this.press(); }
    },

/* =====================================================================
   ЗАЛ: свет рядами, фокус-свет, раскрытие прибора (полишинг, П2). Числа — FEEL.hall, FEEL.focus, FEEL.reveal.
   ===================================================================== */
const reducedMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const flickerOn = () => Save.data.comfort.flicker !== false && !reducedMotion();

/* ---------- первый вход в зал (задание 4, 6.7): потолочные лампы включаются рядами ----------
   Полностью — один раз (Save.data.hallSeen), потом коротко. Темнота зала — узкий холст с вертикальным градиентом поверх пульта:
   каждый ряд — светлая полоса и немного рассеянного света на весь зал. Трубка вспыхивает с запинкой (мерцание — в настройках).
   Потом приборы просыпаются (щелчки реле, цифры загораются), и Палыч кладёт задание на смену. Клик или клавиша — сразу свет. */
const Hall = {
  cv: null, timers: [],
  lights(full, done) {
    this.finish(true);
    const F = FEEL.hall, cv = document.createElement('canvas');
    cv.id = 'hall-dark'; cv.width = 2; cv.height = 128; cv.setAttribute('aria-hidden', 'true'); document.body.appendChild(cv);
    this.cv = cv; this.lv = F.rows.map(() => 0); this.done = done; this.timers = [];
    UI.mode = 'hall'; this.paint();
    const at = (ms, fn) => this.timers.push(setTimeout(fn, ms)), pat = flickerOn() ? F.flick : [[0, 1]];
    let end;
    if (full) {
      F.rows.forEach((_, k) => {
        const t0 = F.start + k * F.gap;
        at(t0, () => Snd.cue('tube'));
        pat.forEach(([dt, v]) => at(t0 + dt, () => { this.lv[k] = v; this.paint(); }));
      });
      end = F.start + (F.rows.length - 1) * F.gap + pat[pat.length - 1][0] + F.settle;
    } else {
      at(F.short, () => { Snd.cue('tube'); this.lv = this.lv.map(() => 1); this.paint(); });
      end = F.short + F.settle;
    }
    at(end, () => this.finish());

  },
  // ряд k горит на lv[k] (0…1): полоса света вокруг его высоты и рассеянный свет на весь зал
  paint() {
    const F = FEEL.hall, x = this.cv.getContext('2d'), H = this.cv.height, g = x.createLinearGradient(0, 0, 0, H);
    for (let i = 0; i <= 24; i++) {
      const y = i / 24; let dark = F.dark;

  finish(silent) {
    if (!this.cv) return;

    Snd.cue('selftest'); const app = $('app'); app.classList.add('waking'); setTimeout(() => app.classList.remove('waking'), FEEL.hall.wake);

};

    { el: '#b-boron', text: 'Разбавь бор понемногу или подожди, пока ксенон распадётся. И смотри на «Разгон».', after: 500, auto: 8000 },

// куда смотреть по «Что происходит?» — по первой причине из explain() (Game.explainOn)
const EXPLAIN_EL = { dg: '#b-dg', pumps: '#b-pumps', temp: '#b-temp', power: '#b-power .read', rate: '#b-power .rate-row', pres: '#b-pres', xenon: '#b-xenon', turb: '#b-turb', boron: '#b-boron' };
const alarmFresh = g => !!g && LAMPS.some(L => g.lamps[L.id] && g.annNew(L.id));

const Guide = {
  steps: null, i: -1, cur: null, t: 0, acted: null,
  start(steps, done) {
    this.stop(true); if (!steps || !steps.length) { if (done) done(); return; }
    this.steps = steps; this.i = -1; this.done = done; this.acted = null; this.next();
  },
  next() {
    clearTimeout(this.t); this.i++;
    const st = this.steps && this.steps[this.i];
    if (!st) { this.stop(); return; }
    if (st.needs && this.acted !== st.needs) { this.next(); return; }   // шаг про отклик на действие, а действия не было
    this.cur = null;
    if (st.after) { this.hide(); this.t = setTimeout(() => this.show(st), st.after); } else this.show(st);
  },
  show(st) {
    const g = UI.game, el = document.querySelector(st.el);
    if (!g || g.done || UI.mode !== 'play' || !el) { this.next(); return; }
    if (st.when && g.happened[st.when] == null) { UI.guideHold = false; this.cur = null; this.t = setTimeout(() => this.show(st), 250); return; }   // ждём события смены (блэкаут), время идёт
    this.cur = st; UI.guideHold = !!st.hold; hideTip();
    g.say(st.text, 1);                                         // селектор щёлкает, лампа вызова горит — Палыч говорит
    if (!st.alarm && alarmFresh(g)) { UI.guideHold = false; this.t = setTimeout(() => this.next(), 2500); return; }
    this.into(el); this.paint(el, st.also && document.querySelector(st.also)); this.note(el, st.text);
    if (st.auto) this.t = setTimeout(() => this.next(), st.auto);
  },
  // игрок что-то сделал на пульте (canAct): свет возвращается, физика идёт
  act(gp) {
    if (!this.steps) return; this.acted = gp; UI.guideHold = false;
    const ai = this.steps.findIndex((s, i) => i >= this.i && s.act === gp);   // ждали этого действия — дальше показ отклика на него
    if (ai >= 0) this.i = ai;
    if (this.cur || ai >= 0) this.next();
  },
  // клик мимо органа: свет возвращается. Отложено на такт — если клик был по органу, сначала сработает act()
  click() { const st = this.cur; if (st) setTimeout(() => { if (this.cur === st) this.next(); }, 0); },
  stop(silent) {
    clearTimeout(this.t); const had = !!this.steps;
    this.steps = null; this.cur = null; UI.guideHold = false; this.hide();
    if (had && !silent && this.done) { const d = this.done; this.done = null; d(); }
  },
  // «Что происходит?»: пятно на то, о чём речь; физика идёт (решение автора после П2 — без паузы)
  explain(g) {
    const el = EXPLAIN_EL[g.explainOn]; if (!el || alarmFresh(g) && g.explainOn !== 'alarm') return;
    this.stop(true); this.steps = [{ el, text: g.msg.text, expl: true }]; this.i = 0; this.acted = null;
    const st = this.steps[0], e = document.querySelector(el); if (!e) { this.stop(true); return; }
    this.cur = st; this.into(e); this.paint(e); this.note(e, st.text);
    this.t = setTimeout(() => this.next(), FEEL.focus.explainMs);
  },
  // узкий экран и 1024×768 — щит в одну колонку и прокручивается: объект показа выводится на середину экрана
  into(el) { const r = el.getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) el.scrollIntoView({ block: 'center', behavior: 'instant' }); },
  els() {
    if (!this.cv) {
      this.cv = document.createElement('div'); this.cv.id = 'focus'; this.cv.setAttribute('aria-hidden', 'true');
      this.nt = document.createElement('div'); this.nt.className = 'fc-note'; this.nt.setAttribute('role', 'status');
      document.body.append(this.cv, this.nt);
    }
  },
  // тень на весь зал и мягкое пятно света на объекте: один слой с радиальным градиентом, появление — прозрачностью
  paint(el, also) {
    this.els(); const F = FEEL.focus, rem = UI.remPx || 14, r = el.getBoundingClientRect();
    let L = r.left, T = r.top, R = r.right, B = r.bottom;
    if (also) { const a = also.getBoundingClientRect(); L = Math.min(L, a.left); T = Math.min(T, a.top); R = Math.max(R, a.right); B = Math.max(B, a.bottom); }
    const p = F.pad * rem; L -= p; T -= p; R += p; B += p;
    this.rect = { L, T, R, B };
    // эллипс описывает прямоугольник объекта (×√2), мягкая кромка — ещё soft rem наружу
    const cx = (L + R) / 2, cy = (T + B) / 2, s = F.soft * rem, rx = (R - L) / 2 * Math.SQRT2 + s, ry = (B - T) / 2 * Math.SQRT2 + s;
    const k = Math.round(100 * ((R - L) / 2 * Math.SQRT2) / rx);
    this.cv.style.background = `radial-gradient(${rx.toFixed(0)}px ${ry.toFixed(0)}px at ${cx.toFixed(0)}px ${cy.toFixed(0)}px, rgba(255,232,190,${F.warm}) 0, rgba(255,232,190,0) ${k - 10}%, rgba(4,5,5,0) ${k}%, rgba(4,5,5,${F.dim}) 100%)`;
    const cv = this.cv; cv.classList.remove('on'); void cv.offsetWidth; cv.classList.add('on');
  },
  // записка Палыча рядом с объектом: справа, если есть место, иначе слева, снизу или сверху
  note(el, text) {
    const nt = this.nt, r = this.rect, gap = (UI.remPx || 14) * .9, W = innerWidth, H = innerHeight;
    nt.innerHTML = `<b class="fc-who">Палыч</b><p>${text}</p><span class="fc-hint">щёлкни, чтобы продолжить</span>`;
    nt.classList.remove('on'); nt.style.left = '0px'; nt.style.top = '0px';
    const w = nt.offsetWidth, h = nt.offsetHeight;
    let x, y;
    if (r.R + gap + w < W - 8) { x = r.R + gap; y = (r.T + r.B) / 2 - h / 2; }
    else if (r.L - gap - w > 8) { x = r.L - gap - w; y = (r.T + r.B) / 2 - h / 2; }
    else { x = (r.L + r.R) / 2 - w / 2; y = r.B + gap + h < H - 8 ? r.B + gap : r.T - gap - h; }
    nt.style.left = Math.round(clamp(x, 8, W - w - 8)) + 'px'; nt.style.top = Math.round(clamp(y, 8, H - h - 8)) + 'px';
    void nt.offsetWidth; nt.classList.add('on');
  },
  hide() { if (this.cv) this.cv.classList.remove('on'); if (this.nt) this.nt.classList.remove('on'); },
  resize() { if (this.cur) { const e = document.querySelector(this.cur.el); if (e) { this.paint(e, this.cur.also && document.querySelector(this.cur.also)); this.note(e, this.cur.text); } } },
};
// прокрутили щит во время показа — пятно и записка идут за объектом
addEventListener('scroll', () => { if (Guide.cur && !Guide.raf) Guide.raf = requestAnimationFrame(() => { Guide.raf = 0; Guide.resize(); }); }, { passive: true });
// клик по залу во время показа — свет возвращается (сам клик по органу работает как обычно)

/* ---------- раскрытие прибора (задание 4, 8.3; STYLE.md 2.13): винты, лязг пластины, пыль, самопроверка ----------
   Первый раз — целиком (3–4 с), повторно — коротко. Клик пропускает. Потом — фокус-свет на новый прибор. */
const Reveal = {
  run(list, done) {
    const R = FEEL.reveal; this.done = done; this.list = list; this.timers = [];
    const at = (ms, fn) => this.timers.push(setTimeout(fn, ms));
    UI.guideHold = true;
    list.forEach((b, n) => {
      const cv = b.querySelector('.cover'), o = n * R.stagger; if (!cv) return;
      if (cv.dataset.niche) {   // пустое гнездо: прибор вставляют на направляющие — щелчок фиксатора, потом самопроверка
        at(o + R.screwGap, () => { b.classList.remove('locked'); cv.classList.add('installing'); b.classList.add('slide-in'); Snd.cue('latch'); });
        at(o + R.screwGap + 420, () => Snd.cue('bolt'));
        at(o + R.screwGap + 480, () => { b.classList.remove('unlocking', 'slide-in'); cv.classList.add('gone'); b.classList.add('selftest'); Snd.cue('selftest'); });
        at(o + R.screwGap + 480 + R.selftest, () => b.classList.remove('selftest'));
        return;
      }
      // четыре винта поверх нарисованных: выкручиваются по одному
      const ins = .38;
      [[ins, ins], [null, ins], [ins, null], [null, null]].forEach(([l, t], k) => {
        const s = document.createElement('i'); s.className = 'rv-screw';
        s.style.left = l != null ? `${l}rem` : `calc(100% - ${ins}rem)`; s.style.top = t != null ? `${t}rem` : `calc(100% - ${ins}rem)`;
        s.style.setProperty('--sa', `${(k * 47 + n * 31) % 180}deg`); cv.appendChild(s);
        at(o + k * R.screwGap, () => { s.classList.add('out'); Snd.cue('screw'); });
        at(o + k * R.screwGap + R.screwDur * .55, () => Snd.cue('screw'));
      });
      const fallAt = o + 3 * R.screwGap + R.screwDur;
      at(fallAt, () => { cv.classList.add('falling'); });
      at(fallAt + R.fall, () => { Snd.cue('plate'); this.dust(b); });
      at(fallAt + R.fall + 60, () => { b.classList.remove('locked', 'unlocking'); cv.classList.add('gone'); b.classList.add('selftest'); Snd.cue('selftest'); });
      at(fallAt + R.fall + 60 + R.selftest, () => b.classList.remove('selftest'));
    });
    const last = (list.length - 1) * R.stagger + 3 * R.screwGap + R.screwDur + R.fall + 60 + R.selftest + R.settle;
    at(last, () => this.finish());
    this.skip = e => { if (e.button === 0) this.finish(); };
    addEventListener('pointerdown', this.skip, true);
  },
  dust(b) {
    const d = document.createElement('div'); d.className = 'rv-dust'; d.setAttribute('aria-hidden', 'true');
    const rnd = Tex.rng(b.id.length * 97 + 13);
    for (let i = 0; i < 9; i++) { const p = document.createElement('i'); p.style.left = `${8 + rnd() * 84}%`; p.style.setProperty('--dx', `${(rnd() - .5) * 3}rem`); p.style.setProperty('--dy', `${-1 - rnd() * 2.4}rem`); p.style.animationDelay = `${Math.round(rnd() * 80)}ms`; d.appendChild(p); }
    b.appendChild(d); setTimeout(() => d.remove(), 1100);
  },
  finish() {
    if (!this.list) return;
    this.timers.forEach(clearTimeout); removeEventListener('pointerdown', this.skip, true);
    this.list.forEach(b => { b.classList.remove('locked', 'unlocking', 'selftest', 'slide-in'); const cv = b.querySelector('.cover'); if (cv) { cv.classList.add('gone'); cv.querySelectorAll('.rv-screw').forEach(s => s.remove()); } });
    this.list = null; const d = this.done; this.done = null; if (d) d();
  },
};

// подпись Палыча в журнале: росчерк «П» с длинным хвостом (в долях строки)
const PALYCH_SIGN = { strokes: [
  [[.04, .78], [.06, .42], [.09, .2], [.13, .22], [.15, .5], [.16, .8]],
